<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Navigation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"Plus Jakarta Sans",system-ui,sans-serif}
a{text-decoration:none}
</style>
</helmet>
<nav aria-label="Main navigation" style="width:260px;min-height:100vh;background:{{t.bg}};color:#e8eef5;padding:22px 14px 28px;box-sizing:border-box;font-family:'Plus Jakarta Sans',system-ui,sans-serif">
<div aria-hidden="true" style="height:6px;margin:-22px -14px 20px;background:linear-gradient(90deg,#007FFF 0 50%,#F7D618 50% 100%)"></div>
<div style="display:flex;gap:12px;align-items:center;padding:0 8px 20px;border-bottom:1px solid {{t.line}};margin-bottom:10px">
<svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#F7D618"></rect><path d="M20 7v26" stroke="{{t.bg}}" stroke-width="3" stroke-dasharray="4 3"></path><path d="M12 33 17 7M28 33 23 7" stroke="{{t.bg}}" stroke-width="2" stroke-linecap="round"></path></svg>
<div>
<div style="font-size:15px;font-weight:800;letter-spacing:.01em;color:#fff">{{brand1}}</div>
<div style="font-size:11px;color:{{t.sub}};margin-top:2px">{{brand2}}</div>
</div>
</div>
<div role="group" aria-label="{{langLabel}}" style="display:flex;gap:6px;align-items:center;padding:0 8px 6px;margin-top:-2px">
<span style="font-size:11px;color:{{t.sub}};margin-right:4px">{{langLabel}}</span>
<button onClick="{{goEn}}" aria-pressed="{{enOn}}" style="min-height:32px;min-width:44px;border-radius:8px;border:1px solid {{t.line}};background:{{enBg}};color:{{enFg}};font-weight:700;font-size:12px;cursor:pointer;font-family:inherit">EN</button>
<button onClick="{{goFr}}" aria-pressed="{{frOn}}" style="min-height:32px;min-width:44px;border-radius:8px;border:1px solid {{t.line}};background:{{frBg}};color:{{frFg}};font-weight:700;font-size:12px;cursor:pointer;font-family:inherit">FR</button>
</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
<sc-if value="{{r.head}}" hint-placeholder-val="{{ false }}">
<div style="font-size:10.5px;font-weight:700;letter-spacing:.14em;color:{{t.head}};padding:16px 10px 6px">{{r.label}}</div>
</sc-if>
<sc-if value="{{r.link}}" hint-placeholder-val="{{ true }}">
<a href="{{r.href}}" style="display:flex;align-items:center;gap:10px;min-height:38px;padding:0 10px;border-radius:9px;font-size:13.5px;color:{{r.fg}};background:{{r.bg}};font-weight:{{r.weight}}"><span style="width:6px;height:6px;border-radius:50%;background:{{r.dot}};flex:0 0 6px"></span>{{r.label}}</a>
</sc-if>
<sc-if value="{{r.off}}" hint-placeholder-val="{{ false }}">
<div aria-disabled="true" style="display:flex;align-items:center;gap:10px;min-height:34px;padding:0 10px;font-size:13px;color:{{t.sub}}"><span style="width:6px;height:6px;border-radius:50%;background:{{t.dotOff}};flex:0 0 6px"></span>{{r.label}}</div>
</sc-if>
</sc-for>
<a href="{{waHref}}" target="_blank" rel="noopener" aria-label="{{waLabel}}" style="display:flex;align-items:center;gap:10px;min-height:48px;margin:16px 10px 0;padding:6px 12px;border-radius:10px;background:rgba(255,255,255,.1);border:1px solid {{t.line}};color:#ffffff;font-weight:700;font-size:13.5px">

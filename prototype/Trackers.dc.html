<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>All Trackers</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"Plus Jakarta Sans",system-ui,sans-serif;color:#0e1a2b;background:#f3f5f9}
button,input,select,textarea{font-family:inherit;font-size:14px}
input,select,textarea{border:1px solid #b9c4d0;border-radius:8px;padding:9px 10px;box-sizing:border-box;width:100%;background:#fff;color:#0e1a2b}
label.f{display:block;font-size:12px;font-weight:700;color:#4a5a6e;margin-bottom:8px}
label.f>*{margin-top:4px;font-weight:400}
.gq{display:grid;align-items:stretch}
.gq>*{box-sizing:border-box;min-width:0;height:100%}
.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1000px){.c4{grid-template-columns:repeat(2,minmax(0,1fr))}.c3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.c3,.c4{grid-template-columns:minmax(0,1fr)}}
</style>
</helmet>
<div style="display:flex;flex-wrap:wrap;min-height:100vh">
<div style="flex:0 0 260px"><dc-import name="Nav" active="trackers" hint-size="260px,1000px"></dc-import></div>
<main style="flex:999 1 560px;min-width:0;padding:24px 28px 40px;box-sizing:border-box">
<div style="font-size:11px;letter-spacing:.14em;font-weight:700;color:#0a5cc2">{{k.eyebrow}}</div>
<h1 style="margin:4px 0 6px;font-size:28px;font-weight:800">{{k.title}}</h1>
<p style="margin:0 0 14px;font-size:14px;color:#4a5a6e;max-width:860px;line-height:1.55">{{k.intro}}</p>
<div style="background:#fff7dd;border:1px solid #e0b84f;border-radius:10px;padding:10px 14px;font-size:13px;color:#4a3200;margin-bottom:18px;max-width:860px;line-height:1.5"><b>{{k.protoB}}</b> {{k.proto}}</div>

<div class="gq c4" style="gap:14px;margin-bottom:20px">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="4">
<div style="background:#fff;border:1px solid #e1e7ee;border-top:4px solid {{t.color}};border-radius:14px;padding:14px 16px"><div style="font-size:12px;color:#4a5a6e;font-weight:600">{{t.label}}</div><div style="font-size:26px;font-weight:800;margin-top:4px">{{t.value}}</div></div>
</sc-for>
</div>

<div style="display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start">
<section style="flex:2 1 520px;min-width:0">
<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="6">
<button onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="min-height:40px;padding:0 14px;border-radius:999px;border:1px solid {{c.border}};background:{{c.bg}};color:{{c.fg}};font-weight:700;cursor:pointer">{{c.label}}</button>
</sc-for>
</div>
<sc-if value="{{empty}}" hint-placeholder-val=""><div style="background:#fff;border:1px dashed #9aa9ba;border-radius:16px;padding:22px;font-size:14px;color:#4a5a6e;line-height:1.6">{{k.empty}}</div></sc-if>
<div class="gq c3" style="gap:12px">
<sc-for list="{{items}}" as="r" hint-placeholder-count="3">
<div style="background:#fff;border:1px solid #e1e7ee;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px">
<div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center"><span style="font-size:12px;font-weight:800;color:#0a5cc2">{{r.ref}}</span><span style="font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#e2ecfb;color:#123f86;border:1px solid #9db9e6">{{r.kind}}</span></div>
<div style="font-size:14.5px;font-weight:700;line-height:1.4">{{r.title}}</div>
<div style="font-size:12.5px;color:#4a5a6e;line-height:1.5">{{r.owner}}<br>{{r.basis}}</div>
<div style="margin-top:auto;padding:8px 10px;border-radius:10px;font-size:13px;font-weight:800;{{r.tone}}">{{r.when}}</div>
<div style="font-size:12px;color:#4a5a6e">{{r.statusText}}</div>
<sc-if value="{{r.canAct}}" hint-placeholder-val="{{ true }}">
<div style="display:flex;gap:6px;flex-wrap:wrap">
<button onClick="{{r.advance}}" style="flex:1 1 90px;min-height:40px;border:1px solid #0a5cc2;background:#fff;color:#0a5cc2;border-radius:9px;font-weight:700;cursor:pointer">{{r.advanceLabel}}</button>
<button onClick="{{r.close}}" style="flex:1 1 90px;min-height:40px;border:1px solid #0a5cc2;background:#0a5cc2;color:#fff;border-radius:9px;font-weight:700;cursor:pointer">{{k.close}}</button>
</div>
</sc-if>
<sc-if value="{{r.closed}}" hint-placeholder-val=""><div style="font-size:12px;color:#145c36;line-height:1.5">{{r.note}}</div></sc-if>
</div>
</sc-for>
</div>
<div style="font-size:12.5px;color:#4a5a6e;margin-top:14px;line-height:1.55">{{k.also}}</div>
</section>

<aside style="flex:1 1 320px;max-width:430px;min-width:0;background:#fff;border:1px solid #e1e7ee;border-radius:16px;padding:18px">
<h2 style="margin:0 0 10px;font-size:16px;font-weight:800">{{k.addTitle}}</h2>
<label class="f">{{k.kind}}<select value="{{n.kind}}" onChange="{{setKind}}"><sc-for list="{{kinds}}" as="o"><option value="{{o.v}}">{{o.t}}</option></sc-for></select></label>
<label class="f">{{k.what}}<input value="{{n.title}}" onInput="{{setTitle}}"></label>
<label class="f">{{k.owner}}<input value="{{n.owner}}" onInput="{{setOwner}}"></label>
<label class="f">{{k.basisL}}<select value="{{n.basis}}" onChange="{{setBasis}}"><option value="none">{{k.bNone}}</option><option value="internal_target">{{k.bInternal}}</option><option value="contract_deadline" disabled>{{k.bContract}}</option></select></label>
<sc-if value="{{showDate}}" hint-placeholder-val=""><label class="f">{{k.date}}<input type="date" value="{{n.due}}" onInput="{{setDue}}"></label></sc-if>
<div style="font-size:12px;color:#4a5a6e;line-height:1.5;margin-bottom:12px">{{k.basisNote}}</div>
<button onClick="{{add}}" style="width:100%;min-height:44px;border:1px solid #0a5cc2;background:#0a5cc2;color:#fff;border-radius:10px;font-weight:700;cursor:pointer">{{k.add}}</button>
<sc-if value="{{msg}}" hint-placeholder-val=""><div style="margin-top:12px;padding:10px 12px;border-radius:10px;font-size:13px;line-height:1.5;{{msgTone}}">{{msg}}</div></sc-if>
<sc-if value="{{closing}}" hint-placeholder-val=""><div style="margin-top:14px;border-top:1px solid #e1e7ee;padding-top:14px">
<div style="font-size:13px;font-weight:800;margin-bottom:6px">{{closingTitle}}</div>
<label class="f">{{k.note}}<textarea rows="3" value="{{closeNote}}" onInput="{{setNote}}"></textarea></label>
<div style="display:flex;gap:8px"><button onClick="{{confirmClose}}" style="flex:1;min-height:44px;border:1px solid #0a5cc2;background:#0a5cc2;color:#fff;border-radius:10px;font-weight:700;cursor:pointer">{{k.confirm}}</button><button onClick="{{cancelClose}}" style="flex:1;min-height:44px;border:1px solid #b9c4d0;background:#fff;color:#0e1a2b;border-radius:10px;font-weight:700;cursor:pointer">{{k.cancel}}</button></div>
</div></sc-if>
</aside>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1360,"height":1500}}'>
class Component extends DCLogic {
  load() {
    if (this._d) return this._d;
    let d = null;
    try { d = JSON.parse(localStorage.getItem('beni_track_v1') || 'null'); } catch (e) {}
    this._d = d || { items: [], filter: 'all', n: { kind: 'variation', title: '', owner: '', basis: 'none', due: '' }, msg: '', bad: false, closing: '', note: '', counters: {} };
    return this._d;
  }
  save() { try { localStorage.setItem('beni_track_v1', JSON.stringify(this._d)); } catch (e) {} this.setState({ k: Date.now() }); }
  renderVals() {
    const D = this.load();
    const fr = (() => { try { return localStorage.getItem('beni_lang') === 'fr'; } catch (e) { return false; } })();
    const T = (en, f) => fr ? f : en;
    const loc = fr ? 'fr-FR' : 'en-GB';
    const KINDS = [
      ['claim', 'CLM', 'Claim', 'Réclamation'], ['variation', 'VAR', 'Variation', 'Modification'], ['payment_application', 'PAY', 'Payment application', 'Demande de paiement'],
      ['interim_payment_certificate', 'IPC', 'Interim payment certificate', 'Certificat de paiement intérimaire'], ['rfi', 'RFI', 'RFI', 'Demande d\'information'],
      ['design_submission', 'DSB', 'Design submission', 'Soumission de conception'], ['engineer_instruction', 'INS', 'Engineer\'s instruction', 'Instruction de l\'Ingénieur'],
      ['determination', 'DET', 'Determination', 'Détermination'], ['early_warning', 'EWN', 'Early warning', 'Alerte précoce'], ['security', 'SEC', 'Security (bond, guarantee)', 'Garantie (caution)'],
      ['insurance', 'INR', 'Insurance', 'Assurance'], ['procurement', 'PRC', 'Procurement', 'Approvisionnement'], ['other', 'TRK', 'Other', 'Autre']
    ];
    const kn = (v) => { const x = KINDS.find(q => q[0] === v); return x ? (fr ? x[3] : x[2]) : v; };
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const dleft = (it) => it.due ? Math.round((new Date(it.due + 'T00:00:00') - today) / 86400000) : null;
    const open = D.items.filter(i => i.status !== 'closed');
    const overdue = open.filter(i => dleft(i) !== null && dleft(i) < 0);
    const soon = open.filter(i => dleft(i) !== null && dleft(i) >= 0 && dleft(i) <= 7);
    const tiles = [
      { label: T('Open', 'Ouverts'), value: String(open.length), color: '#0a5cc2' },
      { label: T('Overdue', 'En retard'), value: String(overdue.length), color: '#c2410c' },
      { label: T('Due in 7 days', 'Échéance sous 7 jours'), value: String(soon.length), color: '#e0b800' },
      { label: T('Closed', 'Clos'), value: String(D.items.length - open.length), color: '#6b7a8c' }
    ];
    const chips = [['all', T('All', 'Tous')]].concat(KINDS.filter(q => D.items.some(i => i.kind === q[0])).map(q => [q[0], fr ? q[3] : q[2]])).map(c => ({
      label: c[1], pick: () => { D.filter = c[0]; this.save(); }, on: D.filter === c[0] ? 'true' : 'false',
      bg: D.filter === c[0] ? '#0a5cc2' : '#fff', fg: D.filter === c[0] ? '#fff' : '#0e1a2b', border: D.filter === c[0] ? '#0a5cc2' : '#b9c4d0' }));
    const STAT = { open: T('Open', 'Ouvert'), submitted: T('Submitted', 'Soumis'), responded: T('Responded', 'Réponse reçue'), closed: T('Closed', 'Clos') };
    const NEXT = { open: 'submitted', submitted: 'responded' };
    const NEXTL = { open: T('Mark submitted', 'Marquer soumis'), submitted: T('Mark responded', 'Marquer répondu') };
    const sorted = D.items.filter(i => D.filter === 'all' || i.kind === D.filter).slice().sort((a, b) => {
      if ((a.status === 'closed') !== (b.status === 'closed')) return a.status === 'closed' ? 1 : -1;
      if (!a.due && !b.due) return a.ref.localeCompare(b.ref); if (!a.due) return 1; if (!b.due) return -1; return a.due.localeCompare(b.due);
    });
    const items = sorted.map(it => {
      const d = dleft(it); const closed = it.status === 'closed';
      let when, tone;
      if (closed) { when = T('Closed', 'Clos'); tone = 'background:#eceff2;color:#3f4854'; }
      else if (d === null) { when = T('No date set', 'Aucune date'); tone = 'background:#eceff2;color:#3f4854'; }
      else if (d < 0) { when = Math.abs(d) + T(' day(s) overdue', ' jour(s) de retard'); tone = 'background:#ffedd5;color:#9a3412'; }
      else if (d === 0) { when = T('Due today', 'Échéance aujourd\'hui'); tone = 'background:#fff1cc;color:#6b4600'; }
      else if (d <= 7) { when = d + T(' day(s) left', ' jour(s) restant(s)'); tone = 'background:#fff1cc;color:#6b4600'; }
      else { when = d + T(' day(s) left', ' jour(s) restant(s)'); tone = 'background:#e2ecfb;color:#123f86'; }
      return { ref: it.ref, kind: kn(it.kind), title: it.title, owner: (it.owner ? T('Owner: ', 'Responsable : ') + it.owner : T('No owner entered', 'Aucun responsable saisi')),
        basis: it.due ? T('Internal target: ', 'Objectif interne : ') + new Date(it.due + 'T00:00:00').toLocaleDateString(loc, { day: '2-digit', month: 'short', year: 'numeric' }) : T('No date', 'Sans date'),
        when, tone, statusText: STAT[it.status], canAct: closed ? '' : 'yes', closed: closed ? 'yes' : '', note: closed ? T('Closed: ', 'Clos : ') + (it.note || '') : '',
        advanceLabel: NEXTL[it.status] || T('Mark responded', 'Marquer répondu'),
        advance: () => { if (NEXT[it.status]) { it.status = NEXT[it.status]; this.save(); } },
        close: () => { D.closing = it.id; D.note = ''; this.save(); } };
    });
    const cur = D.items.find(i => i.id === D.closing);
    const say = (m, bad) => { D.msg = m; D.bad = !!bad; this.save(); };
    const add = () => {
      const n = D.n;
      if (!n.title.trim()) return say(T('Describe what is being tracked.', 'Décrivez ce qui est suivi.'), true);
      if (n.basis === 'internal_target' && !n.due) return say(T('Enter the internal target date.', 'Saisissez la date d\'objectif interne.'), true);
      const q = KINDS.find(x => x[0] === n.kind);
      D.counters[q[1]] = (D.counters[q[1]] || 0) + 1;
      D.items.push({ id: String(Date.now()), ref: 'T-' + q[1] + '-' + String(D.counters[q[1]]).padStart(3, '0'), kind: n.kind, title: n.title.trim(), owner: n.owner.trim(), due: n.basis === 'internal_target' ? n.due : '', status: 'open', note: '' });
      D.n = { kind: n.kind, title: '', owner: '', basis: 'none', due: '' };
      say(T('Added. The reference is assigned by the system and cannot be changed.', 'Ajouté. La référence est attribuée par le système et ne peut pas être modifiée.'), false);
    };
    const K = {
      eyebrow: T('ADMIN', 'ADMINISTRATION'), title: T('All Trackers', 'Tous les suivis'),
      intro: T('Everything that has a timeline in one place: claims, variations, payment applications, IPCs, RFIs, design submissions, instructions, determinations, early warnings, securities, insurance and procurement. A date is either your own internal target, or it comes from an approved contract rule. It is never guessed.', 'Tout ce qui a un échéancier au même endroit : réclamations, modifications, demandes de paiement, certificats, demandes d\'information, soumissions de conception, instructions, déterminations, alertes précoces, garanties, assurances et approvisionnement. Une date est soit votre objectif interne, soit issue d\'une règle contractuelle approuvée. Elle n\'est jamais devinée.'),
      protoB: T('Prototype:', 'Prototype :'), proto: T('Records stay in this browser only. In the live system they are shared, access-controlled and every change is logged.', 'Les enregistrements restent dans ce navigateur uniquement. Dans le système réel, ils sont partagés, protégés par des droits d\'accès et chaque modification est journalisée.'),
      empty: T('Nothing is being tracked yet. Add the first item on the right.', 'Rien n\'est encore suivi. Ajoutez le premier élément à droite.'),
      also: T('In the live system this timeline also pulls in calculated contractual deadlines, open NCRs, corrective actions, planned quality audits and the monthly report due date, each from its own page.', 'Dans le système réel, cet échéancier inclut aussi les délais contractuels calculés, les NCR ouvertes, les actions correctives, les audits qualité planifiés et la date de remise du rapport mensuel, chacun depuis sa propre page.'),
      close: T('Close', 'Clore'), addTitle: T('Add to the tracker', 'Ajouter au suivi'), kind: T('Kind', 'Type'), what: T('What is being tracked', 'Ce qui est suivi'), owner: T('Owner (name)', 'Responsable (nom)'),
      basisL: T('Date', 'Date'), bNone: T('No date', 'Sans date'), bInternal: T('Internal target (my own date)', 'Objectif interne (ma propre date)'),
      bContract: T('Contract deadline: needs an approved rule (none yet)', 'Délai contractuel : nécessite une règle approuvée (aucune pour l\'instant)'),
      date: T('Target date', 'Date cible'), basisNote: T('A contract deadline can only be linked once the deadline rule has been verified and approved. Until then, use an internal target and it will be labelled as one.', 'Un délai contractuel ne peut être lié qu\'une fois la règle vérifiée et approuvée. D\'ici là, utilisez un objectif interne ; il sera étiqueté comme tel.'),
      add: T('Add', 'Ajouter'), note: T('How was this closed?', 'Comment cela a-t-il été clos ?'), confirm: T('Confirm close', 'Confirmer la clôture'), cancel: T('Cancel', 'Annuler')
    };
    return {
      k: K, tiles, chips, items, empty: sorted.length ? '' : 'yes', kinds: KINDS.map(q => ({ v: q[0], t: fr ? q[3] : q[2] })),
      n: D.n, setKind: (e) => { D.n.kind = e.target.value; this.save(); }, setTitle: (e) => { D.n.title = e.target.value; this.save(); }, setOwner: (e) => { D.n.owner = e.target.value; this.save(); },
      setBasis: (e) => { D.n.basis = e.target.value; this.save(); }, setDue: (e) => { D.n.due = e.target.value; this.save(); }, showDate: D.n.basis === 'internal_target' ? 'yes' : '',
      add, msg: D.msg, msgTone: D.bad ? 'background:#ffedd5;border:1px solid #fdba74;color:#9a3412' : 'background:#e3f3ea;border:1px solid #9bcdb0;color:#145c36',
      closing: cur ? 'yes' : '', closingTitle: cur ? cur.ref + ' · ' + cur.title : '', closeNote: D.note, setNote: (e) => { D.note = e.target.value; this.save(); },
      confirmClose: () => { if (!cur) return; if (!D.note.trim()) return say(T('Record how this was closed.', 'Indiquez comment cela a été clos.'), true); cur.status = 'closed'; cur.note = D.note.trim(); D.closing = ''; D.note = ''; say(T('Closed. A closed record cannot be changed.', 'Clos. Un enregistrement clos ne peut plus être modifié.'), false); },
      cancelClose: () => { D.closing = ''; this.save(); }
    };
  }
}
</script>
</body>
</html>

>\n<div style=\"flex:1 1 auto;position:relative;height:20px;background:repeating-linear-gradient(90deg,#f1f4f8 0,#f1f4f8 1px,transparent 1px,transparent 8.3333%)\">\n<div style=\"position:absolute;top:2px;bottom:2px;border-radius:5px;background:#cfe0ee;left:{{g.left}};width:{{g.width}};overflow:hidden\"><div style=\"height:100%;width:{{g.done}};background:#0a5cc2\"><\/div><\/div>\n<div style=\"position:absolute;top:-10px;bottom:-10px;width:2px;background:#c2410c;left:{{g.today}}\"><\/div>\n<\/div>\n<\/div>\n<\/sc-for>\n<\/section>\n<\/div>\n\n<div class=\"g2\" style=\"margin-bottom:0\">\n<section class=\"col\" style=\"min-width:0;background:#fff;border-radius:16px;padding:16px 18px;border:1px solid #d3dbe5\" aria-labelledby=\"mih\">\n<div style=\"display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px\">\n<h2 id=\"mih\" style=\"margin:0;font-size:16px;font-weight:800\">Milestones<\/h2>\n<span style=\"font-size:12.5px;font-weight:700;color:#145c36\">{{msDone}} of {{msTotal}} achieved<\/span>\n<\/div>\n<div style=\"height:8px;border-radius:999px;background:#e3e9f0;overflow:hidden;margin-bottom:12px\"><div style=\"height:100%;width:{{msPct}};background:#1f9d5b\"><\/div><\/div>\n<sc-for list=\"{{milestones}}\" as=\"m\" hint-placeholder-count=\"6\">\n<div style=\"display:flex;gap:12px;padding:8px 0\">\n<div style=\"flex:0 0 26px;height:26px;border-radius:50%;background:{{m.bg}};color:{{m.fg}};border:2px solid {{m.fg}};display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;box-sizing:border-box\">{{m.icon}}<\/div>\n<div style=\"flex:1 1 auto;min-width:0\"><div style=\"font-size:13.5px;font-weight:700\">{{m.name}}<\/div><div style=\"font-size:12px;color:#4a5a6e\">{{m.area}} · planned month {{m.month}} · <span style=\"font-weight:700;color:{{m.fg}}\">{{m.status}}<\/span><\/div><\/div>\n<\/div>\n<\/sc-for>\n<\/section>\n\n<section class=\"col\" style=\"min-width:0;background:#fff;border-radius:16px;padding:16px 18px;border:1px solid #d3dbe5\" aria-labelledby=\"fdh\">\n<h2 id=\"fdh\" style=\"margin:0 0 10px;font-size:16px;font-weight:800\">Latest site updates<\/h2>\n<sc-for list=\"{{feed}}\" as=\"f\" hint-placeholder-count=\"5\">\n<div class=\"fill\" style=\"display:flex;gap:12px;padding:9px 0;border-bottom:1px solid #edf1f5;align-items:center\">\n<span style=\"flex:0 0 10px;height:10px;border-radius:50%;background:{{f.dot}};margin-top:5px\"><\/span>\n<div style=\"min-width:0;font-size:13px;line-height:1.45\"><div><span style=\"font-size:10px;font-weight:800;border:1px solid {{f.tagColor}};color:{{f.tagColor}};border-radius:4px;padding:0 4px;margin-right:6px\">{{f.tag}}<\/span>{{f.text}}<\/div><div style=\"font-size:11.5px;color:#4a5a6e;margin-top:2px\">{{f.when}}<\/div><\/div>\n<\/div>\n<\/sc-for>\n<\/section>\n<\/div>\n<\/sc-if>\n\n<\/main>\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script data-props='{\"$preview\":{\"width\":1360,\"height\":1900}}'>\nclass Component extends DCLogic {\n  renderVals() {\n    const demo = this.state.demo !== false;\n    const scope = this.state.scope || 'all';\n    const sel = this.state.ws === undefined ? -1 : this.state.ws;\n    const bump = this.state.bump || [0, 0, 0, 0, 0, 0];\n    const extra = this.state.extra || [];\n    const W = [\n      { n: 'Design', wt: 0.15, span: [1, 6], t: [72, 68], w: [85, 80] },\n      { n: 'Procurement', wt: 0.15, span: [2, 9], t: [55, 46], w: [60, 52] },\n      { n: 'Substructure', wt: 0.20, span: [2, 7], t: [80, 78], w: [90, 90] },\n      { n: 'Superstructure', wt: 0.25, span: [5, 11], t: [45, 38], w: [55, 50] },\n      { n: 'Systems and finishes', wt: 0.15, span: [7, 12], t: [20, 12], w: [25, 18] },\n      { n: 'Testing and commissioning', wt: 0.10, span: [11, 12], t: [0, 0], w: [0, 0] }\n    ];\n    const mix = (i, k) => {\n      const t = W[i].t[k], w = W[i].w[k];\n      return scope === 'terminal' ? t : scope === 'tower' ? w : 0.7 * t + 0.3 * w;\n    };\n    const vals = W.map((x, i) => {\n      const p = mix(i, 0);\n      const a = Math.min(100, mix(i, 1) + bump[i]);\n      return { p, a };\n    });\n    let P = 0, A = 0;\n    W.forEach((x, i) => { P += x.wt * vals[i].p; A += x.wt * vals[i].a; });\n    const r1 = (v) => Math.round(v * 10) / 10;\n    const S = (x) => 3 * x * x - 2 * x * x * x;\n    // find today month so that planned curve equals overall planned\n    let lo = 0, hi = 1;\n    for (let k = 0; k < 40; k++) { const mid = (lo + hi) / 2; if (100 * S(mid) < P) lo = mid; else hi = mid; }\n    const tStar = Math.max(0.2, 12 * lo);\n    const X = (t) => 44 + 456 * t / 12;\n    const Y = (v) => 220 - 2 * v;\n    let planned = '';\n    for (let t = 0; t <= 12; t++) planned += (t ? 'L' : 'M') + X(t).toFixed(1) + ' ' + Y(100 * S(t / 12)).toFixed(1);\n    const ratio = P > 0 ? A / P : 1;\n    let actual = 'M' + X(0).toFixed(1) + ' ' + Y(0).toFixed(1);\n    for (let t = 1; t <= Math.floor(tStar); t++) actual += 'L' + X(t).toFixed(1) + ' ' + Y(100 * S(t / 12) * ratio).toFixed(1);\n    actual += 'L' + X(tStar).toFixed(1) + ' ' + Y(A).toFixed(1);\n    const areaActual = actual + 'L' + X(tStar).toFixed(1) + ' 220L44 220Z';\n    const tx = X(tStar);\n    const curve = { planned, actual, areaActual, tx: tx.toFixed(1), ay: Y(A).toFixed(1), tm: String(r1(tStar)), tlx: (tx > 420 ? tx - 6 : tx + 6).toFixed(1), anchor: tx > 420 ? 'end' : 'start' };\n\n    const spi = P > 0 ? A / P : 1;\n    const status = spi >= 0.95 ? ['✓ On track', '#145c36', '#1f9d5b'] : spi >= 0.85 ? ['▲ Behind plan', '#6b4600', '#d99a00'] : ['■ Critical', '#9a3412', '#c2410c'];\n\n    const M = [\n      ['Commencement and mobilisation', 'all', 1],\n      ['Concept design reviewed', 'all', 2],\n      ['Tower foundations complete', 'tower', 4],\n      ['Terminal substructure complete', 'terminal', 6],\n      ['Tower structure topped out', 'tower', 8],\n      ['Terminal structure complete', 'terminal', 10],\n      ['Systems installation starts', 'all', 9],\n      ['Tests on Completion', 'all', 12]\n    ];\n    const state = (name, i) => {\n      if (name === 'Commencement and mobilisation' || name === 'Concept design reviewed' || name === 'Tower foundations complete') return 'done';\n      if (name === 'Terminal substructure complete' || name === 'Tower structure topped out') return 'prog';\n      if (name === 'Terminal structure complete') return 'risk';\n      return 'next';\n    };\n    const SM = {\n      done: ['✓', '#145c36', '#e3f3ea', 'Achieved'],\n      prog: ['●', '#123f86', '#e2ecfb', 'In progress'],\n      risk: ['▲', '#7a4b00', '#fff1cc', 'At risk'],\n      next: ['○', '#3f4854', '#eceff2', 'Upcoming']\n    };\n    const AREA = { all: 'Whole project', terminal: 'Terminal', tower: 'Control Tower' };\n    const ms = M.filter(m => scope === 'all' || m[1] === 'all' || m[1] === scope).sort((a, b) => a[2] - b[2]);\n    const milestones = ms.map(m => { const s = SM[state(m[0])]; return { name: m[0], area: AREA[m[1]], month: String(m[2]), icon: s[0], fg: s[1], bg: s[2], status: s[3] }; });\n    const msDone = ms.filter(m => state(m[0]) === 'done').length;\n\n    const rows = W.map((x, i) => {\n      const v = vals[i]; const d = v.a - v.p;\n      const c = x.n && v.p === 0 ? ['○', '#3f4854', '#8b9bb0'] : d >= -3 ? ['✓', '#145c36', '#007FFF'] : d >= -10 ? ['▲', '#7a4b00', '#d99a00'] : ['■', '#9a3412', '#c2410c'];\n      const on = sel === i;\n      return {\n        name: x.n, planned: String(Math.round(v.p)), actual: String(Math.round(v.a)),\n        icon: c[0], color: c[1], fill: c[2], aw: v.a + '%', pw: 'calc(' + v.p + '% - 1px)',\n        pick: () => this.setState({ ws: on ? -1 : i }),\n        pressed: on ? 'true' : 'false',\n        bg: on ? '#e6f1ff' : '#ffffff', border: on ? '#7fb9ff' : '#e3e9f0',\n        op: sel === -1 || on ? '1' : '0.4'\n      };\n    });\n    const gantt = W.map((x, i) => {\n      const v = vals[i];\n      const span = x.span[1] - x.span[0] + 1;\n      return {\n        name: x.n, left: ((x.span[0] - 1) / 12 * 100) + '%', width: (span / 12 * 100) + '%',\n        done: (v.p > 0 ? Math.min(100, v.a / Math.max(v.p, 0.0001) * Math.min(100, (tStar - (x.span[0] - 1)) / span * 100)) : 0).toFixed(1) + '%',\n        today: (tStar / 12 * 100) + '%',\n        op: sel === -1 || sel === i ? '1' : '0.4'\n      };\n    });\n    const behind = vals.filter((v, i) => v.p > 0 && v.a - v.p < -3).length;\n    const kpis = [\n      { label: 'Overall progress', value: r1(A) + '%', note: 'Actual', color: '#007FFF', noteColor: '#4a5a6e' },\n      { label: 'Planned to date', value: r1(P) + '%', note: 'Per programme', color: '#6d7f94', noteColor: '#4a5a6e' },\n      { label: 'Schedule performance', value: spi.toFixed(2), note: status[0], color: status[2], noteColor: status[1] },\n      { label: 'Variance', value: (A - P >= 0 ? '+' : '') + r1(A - P) + ' pts', note: 'Actual minus planned', color: '#F7D618', noteColor: '#4a5a6e' },\n      { label: 'Milestones achieved', value: msDone + ' / ' + ms.length, note: 'In current scope', color: '#1f9d5b', noteColor: '#4a5a6e' },\n      { label: 'Workstreams behind', value: String(behind), note: 'More than 3 pts behind', color: behind ? '#d99a00' : '#1f9d5b', noteColor: '#4a5a6e' }\n    ];\n\n    const base = [\n      { text: 'Tower foundations signed off after inspection', when: 'Sample · 2 days ago', dot: '#1f9d5b' },\n      { text: 'Design package B resubmitted to the Engineer', when: 'Sample · 3 days ago', dot: '#1a56b0' },\n      { text: 'Long-lead lift equipment order placed', when: 'Sample · 5 days ago', dot: '#1a56b0' },\n      { text: 'Terminal slab pour at sample grid C delayed by weather', when: 'Sample · 6 days ago', dot: '#d99a00' },\n      { text: 'Monthly progress meeting held', when: 'Sample · 8 days ago', dot: '#6d7f94' }\n    ].map(f => ({ text: f.text, when: f.when, dot: f.dot, tag: 'DEMO', tagColor: '#0b4fb3' }));\n    const feed = demo ? extra.concat(base).slice(0, 7) : [];\n\n    const demoOff = !demo;\n    const sim = () => {\n      const i = (this.state.cnt || 0) % 5;\n      const nb = bump.slice(); nb[i] += 2;\n      const nm = W[i].n;\n      const stamp = new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });\n      const ex = [{ text: nm + ' progress updated by +2 points after a site report (' + (scope === 'all' ? 'whole project' : AREA[scope]) + ')', when: 'Just now · ' + stamp, dot: '#007FFF', tag: 'SIMULATED', tagColor: '#0f4c99' }].concat(extra).slice(0, 4);\n      this.setState({ bump: nb, extra: ex, cnt: (this.state.cnt || 0) + 1, stamp });\n    };\n    const scopes = [['all', 'Whole project'], ['terminal', 'Terminal'], ['tower', 'Control Tower']].map(s => ({\n      label: s[1], pick: () => this.setState({ scope: s[0] }), pressed: scope === s[0] ? 'true' : 'false',\n      bg: scope === s[0] ? '#0a5cc2' : '#ffffff', fg: scope === s[0] ? '#ffffff' : '#0e1a2b', border: scope === s[0] ? '#0a5cc2' : '#cfd8e2'\n    }));\n    const C = 2 * Math.PI;\n    return {\n      hasData: demo ? 'yes' : '', empty: demo ? '' : 'yes',\n      scopes, kpis, rows, gantt, milestones, feed, curve,\n      curveAria: 'S-curve: planned ' + r1(P) + ' percent and actual ' + r1(A) + ' percent at month ' + r1(tStar),\n      kpiActual: String(r1(A)), kpiPlanned: String(r1(P)),\n      ring: { aDash: (C * 54 * A / 100).toFixed(1) + ' ' + (C * 54).toFixed(1), pDash: (C * 70 * P / 100).toFixed(1) + ' ' + (C * 70).toFixed(1) },\n      msDone: String(msDone), msTotal: String(ms.length), msPct: (ms.length ? msDone / ms.length * 100 : 0) + '%',\n      liveLabel: demo ? (this.state.stamp ? 'Sample feed · refreshed ' + this.state.stamp : 'Sample feed') : 'No data connected',\n      bannerTitle: demo ? 'Sample figures.' : 'Not connected.',\n      bannerText: demo ? 'Every number on this page is invented sample data to show the layout. It becomes live when your baseline programme and site progress updates are entered. Use Simulate site update to see how the charts react.' : 'Demo data is removed. This report shows only what the team records.',\n      simulate: sim,\n      demoBtn: demo ? 'Remove demo data' : 'Restore demo data (prototype only)',\n      toggleDemo: () => this.setState({ demo: !demo }),\n      clearWs: () => this.setState({ ws: -1 }),\n      clearLabel: sel === -1 ? '' : 'Clear highlight'\n    };\n  }\n}\n<\/script>\n<\/body>\n<\/html>\n", "Qms": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>Quality Management System<\/title>\n<script src=\"./support.js\"><\/script>\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap\" rel=\"stylesheet\">\n<style>\nbody{margin:0;font-family:\"Plus Jakarta Sans\",system-ui,sans-serif;color:#0e1a2b;background:#f3f5f9}\nbutton,input,select,textarea{font-family:inherit;font-size:14px}\ninput,select,textarea{border:1px solid #b9c4d0;border-radius:8px;padding:9px 10px;box-sizing:border-box;width:100%;background:#fff;color:#0e1a2b}\nlabel.f{display:block;font-size:12px;font-weight:700;color:#4a5a6e;margin-bottom:10px}\nlabel.f>*{margin-top:4px;font-weight:400}\nth{font-size:11.5px;letter-spacing:.04em;text-align:left;color:#4a5a6e;padding:8px 10px;border-bottom:2px solid #e1e7ee}\ntd{padding:9px 10px;border-bottom:1px solid #edf1f5;font-size:13.5px;vertical-align:top}\n\n.gq{display:grid;align-items:stretch}\n.gq>*{box-sizing:border-box;min-width:0;height:100%}\n.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.c4{grid-template-columns:repeat(4,minmax(0,1fr))}\n.c5{grid-template-columns:repeat(5,minmax(0,1fr))}.c6{grid-template-columns:repeat(6,minmax(0,1fr))}\n@media (max-width:1000px){.c5,.c6{grid-template-columns:repeat(3,minmax(0,1fr))}.c4{grid-template-columns:repeat(2,minmax(0,1fr))}}\n@media (max-width:640px){.c3,.c4,.c5,.c6{grid-template-columns:minmax(0,1fr)}}\n<\/style>\n<\/helmet>\n<div style=\"display:flex;flex-wrap:wrap;min-height:100vh\">\n<div style=\"flex:0 0 260px\"><dc-import name=\"Nav\" active=\"qms\" hint-size=\"260px,1000px\"><\/dc-import><\/div>\n<main style=\"flex:999 1 560px;min-width:0;padding:24px 28px 40px;box-sizing:border-box\">\n\n<div style=\"font-size:11px;letter-spacing:.14em;font-weight:700;color:#0a5cc2\">QUALITY MANAGEMENT SYSTEM<\/div>\n<h1 style=\"margin:4px 0 6px;font-size:28px;font-weight:800\">Employer's Requirements and Performance<\/h1>\n<p style=\"margin:0 0 18px;font-size:14px;color:#4a5a6e;max-width:800px;line-height:1.55\">Enter each Employer's Requirement once. Record the evidence that proves it is met. The scorecard measures performance against targets that you enter from the Employer's Requirements or the contract. Nothing is pre-filled.<\/p>\n\n<div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px\">\n<sc-for list=\"{{tabs}}\" as=\"t\" hint-placeholder-count=\"3\">\n<button onClick=\"{{t.pick}}\" aria-pressed=\"{{t.pressed}}\" style=\"min-height:44px;padding:0 18px;border-radius:10px;border:1px solid {{t.border}};background:{{t.bg}};color:{{t.fg}};font-weight:700;cursor:pointer\">{{t.label}}<\/button>\n<\/sc-for>\n<\/div>\n\n<div class=\"gq c5\" style=\"gap:12px;margin-bottom:24px\">\n<sc-for list=\"{{stats}}\" as=\"s\" hint-placeholder-count=\"5\">\n<div style=\"background:#fff;border-radius:14px;padding:14px 16px;border:1px solid #e1e7ee;border-top:4px solid {{s.color}}\"><div style=\"font-size:12px;font-weight:600;color:#4a5a6e;min-height:30px;line-height:1.35\">{{s.label}}<\/div><div style=\"font-size:24px;font-weight:800;margin-top:2px\">{{s.value}}<\/div><\/div>\n<\/sc-for>\n<\/div>\n\n<sc-if value=\"{{isReq}}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display:flex;flex-wrap:wrap;gap:22px;align-items:stretch\">\n<section style=\"flex:1 1 340px;max-width:460px;background:#fff;border:1px solid #e1e7ee;border-radius:16px;padding:18px 20px\">\n<h2 style=\"margin:0 0 12px;font-size:18px;font-weight:800\">Add a requirement<\/h2>\n<label class=\"f\">Employer's Requirements clause<input value=\"{{d.section}}\" onInput=\"{{setSection}}\" placeholder=\"Clause or section number as written\"><\/label>\n<label class=\"f\">Short title<input value=\"{{d.title}}\" onInput=\"{{setTitle}}\"><\/label>\n<label class=\"f\">Requirement text, word for word<textarea rows=\"4\" value=\"{{d.text}}\" onInput=\"{{setText}}\"><\/textarea><\/label>\n<label class=\"f\">Acceptance criteria<textarea rows=\"2\" value=\"{{d.criteria}}\" onInput=\"{{setCriteria}}\"><\/textarea><\/label>\n<label class=\"f\">Discipline<select value=\"{{d.disc}}\" onChange=\"{{setDisc}}\"><sc-for list=\"{{discOpts}}\" as=\"o\"><option value=\"{{o.v}}\">{{o.v}}<\/option><\/sc-for><\/select><\/label>\n<label class=\"f\">Priority<select value=\"{{d.prio}}\" onChange=\"{{setPrio}}\"><option value=\"critical\">critical<\/option><option value=\"major\">major<\/option><option value=\"minor\">minor<\/option><\/select><\/label>\n<div style=\"font-size:12px;font-weight:700;color:#4a5a6e;margin-bottom:6px\">How it will be verified (choose at least one)<\/div>\n<div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px\">\n<sc-for list=\"{{methods}}\" as=\"m\" hint-placeholder-count=\"5\">\n<button onClick=\"{{m.flip}}\" aria-pressed=\"{{m.on}}\" style=\"min-height:40px;padding:0 12px;border-radius:999px;border:1px solid {{m.border}};background:{{m.bg}};color:{{m.fg}};font-weight:600;cursor:pointer\">{{m.label}}<\/button>\n<\/sc-for>\n<\/div>\n<button onClick=\"{{addReq}}\" style=\"min-height:46px;padding:0 20px;border-radius:10px;border:0;background:#0a5cc2;color:#fff;font-weight:700;cursor:pointer\">Add requirement<\/button>\n<div style=\"margin-top:10px;font-size:13px;font-weight:700;color:{{formMsgColor}}\">{{formMsg}}<\/div>\n<\/section>\n\n<section style=\"flex:2 1 460px;min-width:0\">\n<h2 style=\"margin:0 0 8px;font-size:18px;font-weight:800\">Requirements register<\/h2>\n<sc-if value=\"{{noReqs}}\" hint-placeholder-val=\"\">\n<div style=\"background:#fff;border:1px dashed #9aa9ba;border-radius:14px;padding:22px;font-size:14px;color:#4a5a6e\">No requirements entered yet. Add the first one on the left. In the live system you can also import them from a spreadsheet.<\/div>\n<\/sc-if>\n<sc-if value=\"{{hasReqs}}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"overflow-x:auto;background:#fff;border:1px solid #e1e7ee;border-radius:14px\">\n<table style=\"border-collapse:collapse;width:100%;min-width:560px\"><thead><tr><th>REF<\/th><th>REQUIREMENT<\/th><th>PRIORITY<\/th><th>VERIFIED BY<\/th><th>STATUS<\/th><th><\/th><\/tr><\/thead><tbody>\n<sc-for list=\"{{rows}}\" as=\"r\" hint-placeholder-count=\"3\">\n<tr><td style=\"font-weight:700;white-space:nowrap\">{{r.ref}}<\/td><td><div style=\"font-weight:700\">{{r.title}}<\/div><div style=\"color:#4a5a6e;font-size:12.5px\">{{r.sub}}<\/div><\/td><td>{{r.prio}}<\/td><td>{{r.methods}}<\/td>\n<td><span style=\"font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;{{r.pill}}\">{{r.status}}<\/span><\/td>\n<td><button onClick=\"{{r.activate}}\" style=\"display:{{r.showAct}};min-height:36px;padding:0 10px;border-radius:8px;border:1px solid #145c36;background:#fff;color:#145c36;font-weight:700;cursor:pointer\">Activate<\/button><\/td><\/tr>\n<\/sc-for>\n<\/tbody><\/table><\/div>\n<p style=\"font-size:12.5px;color:#4a5a6e;margin:8px 0 0\">An active requirement cannot be edited. A change creates a new version, with a reason, and the old version stays on record.<\/p>\n<\/sc-if>\n<\/section>\n<\/div>\n<\/sc-if>\n\n<sc-if value=\"{{isComp}}\" hint-placeholder-val=\"\">\n<h2 style=\"margin:0 0 4px;font-size:18px;font-weight:800\">Compliance matrix<\/h2>\n<p style=\"margin:0 0 12px;font-size:13.5px;color:#4a5a6e\">\"Compliant\" needs evidence: a document, an inspection or a test record. A waiver needs an approval reference.<\/p>\n<sc-if value=\"{{noActive}}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"background:#fff;border:1px dashed #9aa9ba;border-radius:14px;padding:22px;font-size:14px;color:#4a5a6e\">No active requirements. Activate a requirement in the register first.<\/div>\n<\/sc-if>\n<sc-for list=\"{{compRows}}\" as=\"c\" hint-placeholder-count=\"2\">\n<div style=\"background:#fff;border:1px solid #e1e7ee;border-radius:14px;padding:14px 18px;margin-bottom:10px\">\n<div style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between\"><div style=\"font-weight:700\">{{c.ref}} · {{c.title}}<\/div><span style=\"font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;{{c.pill}}\">{{c.status}}<\/span><\/div>\n<div style=\"display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;align-items:flex-end\">\n<label class=\"f\" style=\"flex:1 1 160px;margin:0\">Result<select value=\"{{c.res}}\" onChange=\"{{c.setRes}}\"><option value=\"compliant\">compliant<\/option><option value=\"partially_compliant\">partially compliant<\/option><option value=\"non_compliant\">non-compliant<\/option><option value=\"waived\">waived<\/option><\/select><\/label>\n<label class=\"f\" style=\"flex:2 1 220px;margin:0\">Evidence reference (document, inspection or test)<input value=\"{{c.ev}}\" onInput=\"{{c.setEv}}\"><\/label>\n<button onClick=\"{{c.save}}\" style=\"min-height:42px;padding:0 16px;border-radius:10px;border:0;background:#145c36;color:#fff;font-weight:700;cursor:pointer\">Record<\/button>\n<\/div>\n<div style=\"margin-top:8px;font-size:13px;font-weight:700;color:#9a3412\">{{c.err}}<\/div>\n<\/div>\n<\/sc-for>\n<\/sc-if>\n\n<sc-if value=\"{{isKpi}}\" hint-placeholder-val=\"\">\n<h2 style=\"margin:0 0 4px;font-size:18px;font-weight:800\">Performance scorecard<\/h2>\n<p style=\"margin:0 0 12px;font-size:13.5px;color:#4a5a6e\">Enter each target and the clause it comes from. Colour appears only when both a target and a measured value exist. Q01, Q02, Q03 and Q04 are calculated from the register. Others are entered or, in the live system, calculated from inspection, NCR and test records.<\/p>\n<div style=\"overflow-x:auto;background:#fff;border:1px solid #e1e7ee;border-radius:14px\">\n<table style=\"border-collapse:collapse;width:100%;min-width:760px\"><thead><tr><th>CODE<\/th><th>METRIC<\/th><th>BETTER<\/th><th>TARGET<\/th><th>ER CLAUSE<\/th><th>ACTUAL<\/th><th>STATUS<\/th><\/tr><\/thead><tbody>\n<sc-for list=\"{{kpiRows}}\" as=\"k\" hint-placeholder-count=\"4\">\n<tr><td style=\"font-weight:700\">{{k.code}}<\/td><td><div style=\"font-weight:700\">{{k.name}}<\/div><div style=\"font-size:12px;color:#4a5a6e\">{{k.desc}}<\/div><\/td><td style=\"white-space:nowrap\">{{k.dir}}<\/td>\n<td style=\"width:110px\"><input value=\"{{k.target}}\" onInput=\"{{k.setTarget}}\" inputmode=\"decimal\" aria-label=\"Target\"><\/td>\n<td style=\"width:110px\"><input value=\"{{k.clause}}\" onInput=\"{{k.setClause}}\" aria-label=\"Clause\"><\/td>\n<td style=\"width:110px\">{{k.actualCell}}<input style=\"display:{{k.showInput}}\" value=\"{{k.actual}}\" onInput=\"{{k.setActual}}\" inputmode=\"decimal\" aria-label=\"Actual\"><\/td>\n<td><span style=\"font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;{{k.pill}}\">{{k.status}}<\/span><\/td><\/tr>\n<\/sc-for>\n<\/tbody><\/table><\/div>\n<p style=\"font-size:12.5px;color:#4a5a6e;margin:8px 0 0\">Amber means within the tolerance you set. Entered values are stored on this device only (prototype).<\/p>\n<\/sc-if>\n\n<button onClick=\"{{resetAll}}\" style=\"margin-top:26px;min-height:44px;padding:0 16px;border:1px solid #6b4600;background:#fff7dd;color:#4a3200;border-radius:10px;font-size:13.5px;font-weight:600;cursor:pointer\">Clear everything entered on this page<\/button>\n<\/main>\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script data-props='{\"$preview\":{\"width\":1360,\"height\":1300}}'>\nclass Component extends DCLogic {\n  load() {\n    if (this._d) return this._d;\n    let d = null;\n    try { d = JSON.parse(localStorage.getItem('beni_qms_v1') || 'null'); } catch (e) {}\n    this._d = d || { ers: [], comp: {}, kpi: {}, tab: 'req', draft: { section: '', title: '', text: '', criteria: '', disc: 'general', prio: 'major', m: [] }, ev: {}, res: {}, err: {}, msg: '', bad: false };\n    return this._d;\n  }\n  save() { try { localStorage.setItem('beni_qms_v1', JSON.stringify(this._d)); } catch (e) {} this.setState({ t: Date.now() }); }\n  renderVals() {\n    const D = this.load();\n    const upd = (fn) => () => { fn(); this.save(); };\n    const set = (k) => (e) => { D.draft[k] = e.target.value; this.save(); };\n    const PILL = {\n      grey: 'background:#eceff2;color:#3f4854;border:1px solid #c3cad2', green: 'background:#e3f3ea;color:#145c36;border:1px solid #9bcdb0',\n      red: 'background:#ffedd5;color:#9a3412;border:1px solid #fdba74', amber: 'background:#fff1cc;color:#6b4600;border:1px solid #e0b84f'\n    };\n    const tabsDef = [['req', \"Employer's Requirements\"], ['comp', 'Compliance matrix'], ['kpi', 'Performance metrics']];\n    const tabs = tabsDef.map(t => ({ label: t[1], pick: upd(() => { D.tab = t[0]; }), pressed: D.tab === t[0] ? 'true' : 'false',\n      bg: D.tab === t[0] ? '#0a5cc2' : '#fff', fg: D.tab === t[0] ? '#fff' : '#0e1a2b', border: D.tab === t[0] ? '#0a5cc2' : '#cfd8e2' }));\n\n    const active = D.ers.filter(r => r.status === 'active');\n    const statusOf = (r) => (D.comp[r.ref] ? D.comp[r.ref].result : 'not_verified');\n    const nCompliant = active.filter(r => statusOf(r) === 'compliant').length;\n    const nWaived = active.filter(r => statusOf(r) === 'waived').length;\n    const nBad = active.filter(r => ['non_compliant', 'partially_compliant'].includes(statusOf(r))).length;\n    const nVer = active.filter(r => statusOf(r) !== 'not_verified').length;\n    const pct = (a, b) => (b > 0 ? Math.round(1000 * a / b) / 10 : null);\n    const crit = active.filter(r => r.prio === 'critical');\n    const calc = {\n      Q01: pct(nCompliant, active.length - nWaived),\n      Q02: pct(nVer, active.length),\n      Q03: pct(crit.filter(r => statusOf(r) === 'compliant').length, crit.filter(r => statusOf(r) !== 'waived').length),\n      Q04: active.length ? nBad : null\n    };\n    const stats = [\n      { label: 'Requirements entered', value: String(D.ers.length), color: '#0a5cc2' },\n      { label: 'Active', value: String(active.length), color: '#145c36' },\n      { label: 'Compliant', value: String(nCompliant), color: '#145c36' },\n      { label: 'Non-compliant or partial', value: String(nBad), color: '#0a5cc2' },\n      { label: 'Not yet verified', value: String(active.length - nVer), color: '#f2c300' }\n    ];\n\n    const METHODS = ['inspection', 'test', 'design_review', 'demonstration', 'certificate', 'analysis', 'document_review'];\n    const methods = METHODS.map(m => { const on = D.draft.m.includes(m); return { label: m.replace('_', ' '), on: on ? 'true' : 'false',\n      bg: on ? '#0e1a2b' : '#fff', fg: on ? '#fff' : '#0e1a2b', border: on ? '#0e1a2b' : '#b9c4d0',\n      flip: upd(() => { D.draft.m = on ? D.draft.m.filter(x => x !== m) : D.draft.m.concat(m); }) }; });\n    const addReq = () => {\n      const dr = D.draft;\n      if (!dr.title.trim() || dr.text.trim().length < 5) { D.msg = 'Enter a title and the requirement text.'; D.bad = true; return this.save(); }\n      const n = D.ers.length + 1;\n      D.ers.push({ ref: 'ER-' + String(n).padStart(3, '0'), version: 1, section: dr.section.trim(), title: dr.title.trim(), text: dr.text.trim(),\n        criteria: dr.criteria.trim(), disc: dr.disc, prio: dr.prio, methods: dr.m.slice(), status: 'draft', at: new Date().toISOString() });\n      D.draft = { section: '', title: '', text: '', criteria: '', disc: 'general', prio: 'major', m: [] };\n      D.msg = 'Saved as a draft. Activate it when it is ready.'; D.bad = false; this.save();\n    };\n    const rows = D.ers.map((r, i) => ({\n      ref: r.ref + ' v' + r.version, title: r.title, sub: (r.section ? 'Clause ' + r.section + ' · ' : '') + r.disc,\n      prio: r.prio, methods: r.methods.length ? r.methods.join(', ').replace(/_/g, ' ') : 'none chosen',\n      status: r.status, pill: r.status === 'active' ? PILL.green : PILL.grey, showAct: r.status === 'draft' ? 'inline-block' : 'none',\n      activate: () => {\n        if (!r.methods.length) { D.msg = r.ref + ' needs at least one verification method before it can be activated.'; D.bad = true; return this.save(); }\n        r.status = 'active'; D.msg = r.ref + ' is active and locked.'; D.bad = false; this.save();\n      }\n    }));\n\n    const compRows = active.map(r => {\n      const cur = D.comp[r.ref];\n      const st = statusOf(r);\n      const res = D.res[r.ref] || 'compliant';\n      return { ref: r.ref, title: r.title, res, ev: D.ev[r.ref] || '',\n        status: st.replace(/_/g, ' '), pill: st === 'compliant' ? PILL.green : st === 'not_verified' ? PILL.grey : st === 'waived' ? PILL.amber : PILL.red,\n        setRes: (e) => { D.res[r.ref] = e.target.value; this.save(); }, setEv: (e) => { D.ev[r.ref] = e.target.value; this.save(); },\n        err: D.err[r.ref] || '',\n        save: () => {\n          const ev = (D.ev[r.ref] || '').trim();\n          if (res === 'compliant' && !ev) { D.err[r.ref] = 'Blocked: \"compliant\" needs an evidence reference.'; return this.save(); }\n          if (res === 'waived' && !ev) { D.err[r.ref] = 'Blocked: a waiver needs its approval reference.'; return this.save(); }\n          D.comp[r.ref] = { result: res, evidence: ev, at: new Date().toISOString() }; D.err[r.ref] = ''; this.save();\n        } };\n    });\n\n    const KP = [\n      ['Q01', \"Employer's Requirements compliance\", 'Compliant share of active requirements (waived excluded)', 'higher', '%'],\n      ['Q02', 'Requirements verified', 'Share with any compliance result', 'higher', '%'],\n      ['Q03', 'Critical requirements compliance', 'Compliance of requirements marked critical', 'higher', '%'],\n      ['Q04', 'Non-compliant requirements', 'Non-compliant or partly compliant now', 'lower', 'count'],\n      ['Q05', 'Inspection first-time pass rate', 'First inspections accepted', 'higher', '%'],\n      ['Q06', 'Inspection rejection rate', 'Inspections rejected in the period', 'lower', '%'],\n      ['Q07', 'Inspection turnaround (days)', 'Request to inspection', 'lower', 'days'],\n      ['Q08', 'Open NCRs', 'Not yet closed', 'lower', 'count'],\n      ['Q09', 'Overdue NCRs', 'Open and past due date', 'lower', 'count'],\n      ['Q10', 'Critical NCRs open', 'Critical severity, not closed', 'lower', 'count'],\n      ['Q11', 'NCR closure time (days)', 'Identification to closure', 'lower', 'days'],\n      ['Q12', 'Repeat non-conformances', 'Reports repeating an earlier one', 'lower', '%'],\n      ['Q13', 'Test pass rate', 'Passed share of recorded results', 'higher', '%'],\n      ['Q14', 'Material first-time approval', 'Approved without resubmission', 'higher', '%'],\n      ['Q15', 'Overdue corrective actions', 'Not verified and past due', 'lower', 'count'],\n      ['Q16', 'Audit completion', 'Planned audits performed', 'higher', '%']\n    ];\n    const num = (s) => { const v = parseFloat(String(s).replace(',', '.')); return isNaN(v) ? null : v; };\n    const kpiRows = KP.map(k => {\n      const e = D.kpi[k[0]] || { target: '', clause: '', actual: '' };\n      const auto = Object.prototype.hasOwnProperty.call(calc, k[0]);\n      const val = auto ? calc[k[0]] : num(e.actual);\n      const tg = num(e.target);\n      let st = 'no data', pill = PILL.grey;\n      if (val !== null && tg === null) st = 'no target';\n      else if (val !== null) {\n        const good = k[3] === 'higher' ? val >= tg : val <= tg;\n        const tol = Math.abs(tg) * 0.05;\n        const near = k[3] === 'higher' ? val >= tg - tol : val <= tg + tol;\n        st = good ? 'on target' : near ? 'within 5%' : 'off target';\n        pill = good ? PILL.green : near ? PILL.amber : PILL.red;\n      }\n      const edit = (f) => (ev) => { D.kpi[k[0]] = Object.assign({ target: '', clause: '', actual: '' }, D.kpi[k[0]], { [f]: ev.target.value }); this.save(); };\n      return { code: k[0], name: k[1], desc: k[2], dir: k[3] === 'higher' ? 'Higher' : 'Lower', target: e.target, clause: e.clause, actual: e.actual,\n        actualCell: auto ? (val === null ? 'No data' : String(val) + (k[4] === '%' ? '%' : '')) : '', showInput: auto ? 'none' : 'block',\n        setTarget: edit('target'), setClause: edit('clause'), setActual: edit('actual'), status: st, pill };\n    });\n\n    return {\n      tabs, stats, isReq: D.tab === 'req' ? 'yes' : '', isComp: D.tab === 'comp' ? 'yes' : '', isKpi: D.tab === 'kpi' ? 'yes' : '',\n      d: D.draft, setSection: set('section'), setTitle: set('title'), setText: set('text'), setCriteria: set('criteria'),\n      setDisc: set('disc'), setPrio: set('prio'),\n      discOpts: ['architectural','structural','civil','mechanical','electrical','fire_life_safety','lifts_vertical_transport','atc_control_tower','communications_it','aviation_icao','environmental','hse','general'].map(v => ({ v })),\n      methods, addReq, rows, noReqs: D.ers.length ? '' : 'yes', hasReqs: D.ers.length ? 'yes' : '',\n      formMsg: D.msg, formMsgColor: D.bad ? '#9a3412' : '#145c36',\n      compRows, noActive: active.length ? '' : 'yes', kpiRows,\n      resetAll: () => { this._d = null; try { localStorage.removeItem('beni_qms_v1'); } catch (e) {} this.setState({ t: Date.now() }); }\n    };\n  }\n}\n<\/script>\n<\/body>\n<\/html>\n", "Quality": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>Inspections and NCRs<\/title>\n<script src=\"./support.js\"><\/script>\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap\" rel=\"stylesheet\">\n<style>\nbody{margin:0;font-family:\"Plus Jakarta Sans\",system-ui,sans-serif;color:#0e1a2b;background:#f3f5f9}\na{color:#0f4c99}\nbutton,input{font-family:inherit}\n\n.gq{display:grid;align-items:stretch}\n.gq>*{box-sizing:border-box;min-width:0;height:100%}\n.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.c4{grid-template-columns:repeat(4,minmax(0,1fr))}\n.c5{grid-template-columns:repeat(5,minmax(0,1fr))}.c6{grid-template-columns:repeat(6,minmax(0,1fr))}\n@media (max-width:1000px){.c5,.c6{grid-template-columns:repeat(3,minmax(0,1fr))}.c4{grid-template-columns:repeat(2,minmax(0,1fr))}}\n@media (max-width:640px){.c3,.c4,.c5,.c6{grid-template-columns:minmax(0,1fr)}}\n<\/style>\n<\/helmet>\n<div style=\"display:flex;flex-wrap:wrap;min-height:100vh\">\n<div style=\"flex:0 0 260px\"><dc-import name=\"Nav\" active=\"quality\" hint-size=\"260px,1000px\"><\/dc-import><\/div>\n<main style=\"flex:999 1 560px;min-width:0;padding:24px 28px 40px;box-sizing:border-box\">\n\n<div style=\"font-size:11px;letter-spacing:.14em;font-weight:700;color:#6d5bd0\">QUALITY<\/div>\n<h1 style=\"margin:4px 0 6px;font-size:28px;font-weight:800\">Inspections and NCRs<\/h1>\n<p style=\"margin:0 0 22px;font-size:14px;color:#4a5a6e;max-width:760px;line-height:1.55\">A rejected inspection leads to a non-conformance report, a corrective action and a reinspection, each linked to the one before.<\/p>\n\n<div class=\"gq c5\" style=\"gap:12px;margin-bottom:26px\">\n<sc-for list=\"{{stats}}\" as=\"s\" hint-placeholder-count=\"5\">\n<div style=\"background:#fff;border-radius:14px;padding:14px 16px;border:1px solid #e1e7ee;border-top:4px solid #6d5bd0\"><div style=\"font-size:12px;font-weight:600;color:#4a5a6e;min-height:30px;line-height:1.35\">{{s.label}}<\/div><div style=\"font-size:24px;font-weight:800;margin-top:2px\">{{s.value}}<\/div><\/div>\n<\/sc-for>\n<\/div>\n\n<h2 style=\"font-size:18px;font-weight:800;margin:0 0 4px\">From failed inspection to closure<\/h2>\n<p style=\"margin:0 0 12px;font-size:13.5px;color:#4a5a6e\">Select a stage.<\/p>\n<div style=\"display:flex;flex-wrap:wrap;gap:0;margin-bottom:12px\">\n<sc-for list= orkflows are configurable per inspection type.<\/p>\n<div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px\">\n<sc-for list=\"{{statuses}}\" as=\"t\" hint-placeholder-count=\"8\"><span style=\"padding:6px 11px;border-radius:999px;font-size:12px;font-weight:700;{{t.style}}\">{{t.label}}<\/span><\/sc-for>\n<\/div>\n<h3 style=\"font-size:15px;font-weight:800;margin:0 0 8px\">Sample record<\/h3>\n<sc-if value=\"{{demo}}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"background:#fff;border-radius:16px;border:1px solid #e1e7ee;padding:16px 18px\">\n<div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px\"><span style=\"font-size:10.5px;font-weight:800;color:#0b4fb3;border:1px solid #0b4fb3;border-radius:5px;padding:1px 6px\">DEMO DATA<\/span><span style=\"font-size:12px;font-weight:600;color:#4a5a6e\">DEMO-INS-011 → DEMO-NCR-004<\/span><\/div>\n<div style=\"font-size:14px;font-weight:700;margin-bottom:6px\">Sample concrete pour inspection<\/div>\n<div style=\"font-size:13px;color:#4a5a6e;line-height:1.6;margin-bottom:10px\">Location: sample level 1 · Result: rejected · NCR raised · Corrective action assigned · Reinspection not yet scheduled<\/div>\n<span style=\"font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:#ffedd5;color:#9a3412;border:1px solid #fdba74\">■ REINSPECTION REQUIRED<\/span>\n<\/div>\n<\/sc-if>\n<button onClick=\"{{toggleDemo}}\" style=\"margin-top:12px;min-height:44px;padding:0 16px;border:1px solid #6b4600;background:#fff7dd;color:#4a3200;border-radius:10px;font-size:13.5px;font-weight:600;cursor:pointer\">{{demoBtn}}<\/button>\n<\/section>\n<\/div>\n\n<h2 style=\"font-size:18px;font-weight:800;margin:0 0 4px\">Quality dashboards<\/h2>\n<div class=\"gq c4\" style=\"gap:12px\">\n<sc-for list=\"{{dash}}\" as=\"d\" hint-placeholder-count=\"4\">\n<div style=\"background:#fff;border:1px dashed #9aa9ba;border-radius:14px;padding:18px;font-size:13.5px\"><div style=\"font-weight:700;margin-bottom:4px\">{{d.label}}<\/div><div style=\"color:#4a5a6e\">No data yet<\/div><\/div>\n<\/sc-for>\n<\/div>\n<\/main>\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script data-props='{\"$preview\":{\"width\":1360,\"height\":1500}}'>\nclass Component extends DCLogic {\n  renderVals() {\n    const demo = this.state.demo !== false;\n    const stats = ['Outstanding inspections','Open NCRs','Ageing NCRs','Inspection rejection rate','Repeat non-conformances'].map((label, i) => ({ label, value: i === 3 ? 'No data' : '0' }));\n    const F = [\n      ['Inspection rejected','The inspector records the result, deficiencies found and photographs.'],\n      ['NCR raised','An NCR is created with location, drawing or specification reference, and the responsible organisation, linked to the inspection.'],\n      ['Corrective action assigned','Root cause, proposed action, owner and due date are recorded.'],\n      ['Reinspection','A new inspection is requested and linked to the original rejection.'],\n      ['Closed with evidence','Closure needs verification of the corrective action, evidence and authorised approval.']\n    ];\n    const sel = this.state.sel || 0;\n    const flow = F.map((f, i) => ({\n      title: (i + 1) + '. ' + f[0], pick: () => this.setState({ sel: i }),\n      pressed: i === sel ? 'true' : 'false',\n      bg: i === sel ? '#6d5bd0' : '#ffffff', fg: i === sel ? '#ffffff' : '#0e1a2b', border: i === sel ? '#6d5bd0' : '#cfd8e2'\n    }));\n    const names = ['Corrective action completed','Closure evidence attached','Verification recorded','Authorised approval'];\n    const on = this.state.on || [false, false, false, false];\n    const checks = names.map((label, i) => ({\n      label, on: on[i],\n      flip: () => { const n = on.slice(); n[i] = !n[i]; this.setState({ on: n }); }\n    }));\n    const done = on.filter(Boolean).length;\n    const ok = done === 4;\n    const S = {\n      grey: 'background:#eceff2;color:#3f4854;border:1px solid #c3cad2',\n      blue: 'background:#e2ecfb;color:#123f86;border:1px solid #9db9e6',\n      green: 'background:#e3f3ea;color:#145c36;border:1px solid #9bcdb0',\n      red: 'background:#ffedd5;color:#9a3412;border:1px solid #fdba74',\n      amber: 'background:#fff1cc;color:#6b4600;border:1px solid #e0b84f'\n    };\n    const statuses = [['○ Planned','grey'],['● Requested','blue'],['● Scheduled','blue'],['● Inspected','blue'],['✓ Accepted','green'],['✓ Accepted with recorded comments','green'],['■ Rejected','red'],['▲ Reinspection Required','amber'],['✓ Closed','green']].map(x => ({ label: x[0], style: S[x[1]] }));\n    return {\n      stats, flow, curFlow: F[sel][1], checks, statuses,\n      dash: ['Outstanding NCRs','Ageing NCRs','Repeat non-conformances','Quality trend'].map(label => ({ label })),\n      blocked: ok ? '' : 'disabled',\n      btnBg: ok ? '#0a5cc2' : '#e1e7ee', btnFg: ok ? '#ffffff' : '#4a5a6e', btnBorder: ok ? '#0a5cc2' : '#c3cad2', btnCursor: ok ? 'pointer' : 'not-allowed',\n      msg: ok ? '✓ Ready to close' : '■ Blocked: ' + (4 - done) + ' item' + (4 - done === 1 ? '' : 's') + ' missing',\n      msgColor: ok ? '#145c36' : '#9a3412',\n      demo: demo ? 'yes' : '',\n      demoBtn: demo ? 'Remove demo data' : 'Restore demo data (prototype only)',\n      toggleDemo: () => this.setState({ demo: !demo })\n    };\n  }\n}\n<\/script>\n<\/body>\n<\/html>\n", "Reports": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>Reports<\/title>\n<script src=\"./support.js\"><\/script>\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap\" rel=\"stylesheet\">\n<style>\nbody{margin:0;font-family:\"Plus Jakarta Sans\",system-ui,sans-serif;color:#0e1a2b;background:#f3f5f9}\nbutton,input,select{font-family:inherit}\n<\/style>\n<\/helmet>\n<div style=\"display:flex;flex-wrap:wrap;min-height:100vh\" ht:800\">{{cur}}<\/h2>\n<label for=\"p1\" style=\"display:block;font-size:13px;font-weight:700;margin-bottom:4px\">From<\/label>\n<input id=\"p1\" type=\"date\" style=\"width:100%;box-sizing:border-box;min-height:44px;padding:0 10px;border:1px solid #9aa9ba;border-radius:8px;font-size:14px;margin-bottom:10px\">\n<label for=\"p2\" style=\"display:block;font-size:13px;font-weight:700;margin-bottom:4px\">To<\/label>\n<input id=\"p2\" type=\"date\" style=\"width:100%;box-sizing:border-box;min-height:44px;padding:0 10px;border:1px solid #9aa9ba;border-radius:8px;font-size:14px;margin-bottom:10px\">\n<label for=\"f1\" style=\"display:block;font-size:13px;font-weight:700;margin-bottom:4px\">Filter by<\/label>\n<select id=\"f1\" style=\"width:100%;box-sizing:border-box;min-height:44px;padding:0 10px;border:1px solid #9aa9ba;border-radius:8px;font-size:14px;background:#fff;margin-bottom:14px\">\n<option>All records<\/option><option>Discipline<\/option><option>Responsible party<\/option><option>Location<\/option><option>Status<\/option><option>Work package<\/option>\n<\/select>\n<div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n<button onClick=\"{{gen}}\" style=\"flex:1 1 120px;min-height:44px;border:1px solid #0a5cc2;background:#0a5cc2;color:#fff;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer\">Generate PDF<\/button>\n<button onClick=\"{{gen}}\" style=\"flex:1 1 120px;min-height:44px;border:1px solid #0a5cc2;background:#fff;color:#0a5cc2;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer\">Excel<\/button>\n<\/div>\n<sc-if value=\"{{msg}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"margin-top:14px;padding:12px 14px;background:#fff7dd;border:1px solid #e8c766;border-radius:12px;font-size:13px;line-height:1.5;color:#4a3200\">Prototype only: nothing is generated. In the real build this report would be created from live records, and it would stay empty until records exist.<\/div>\n<\/sc-if>\n<\/aside>\n<\/div>\n<\/main>\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script data-props='{\"$preview\":{\"width\":1360,\"height\":1300}}'>\nclass Component extends DCLogic {\n  renderVals() {\n    const G = [\n      ['Progress', ['Weekly Project Progress Report', 'Monthly Project Management Report', 'Programme and Critical Path Report', 'Outstanding Actions Report', 'Site Photograph Report']],\n      ['Contract', ['Contract Administration Report', 'Notices and Deadlines Report', 'Claims and Extension of Time Report', 'Variations Report', 'Payment and IPC Report']],\n      ['Technical', ['Design Status Report', 'RFI Report', 'Procurement Status Report', 'Risk Register Report']],\n      ['Quality and HSE', ['Quality and NCR Report', 'Inspection Report', 'HSE Report']],\n      ['Completion', ['Testing and Commissioning Report', 'Taking-Over Readiness Report', 'Final Closeout Report']]\n    ];\n    const g = this.state.g || 0;\n    const sel = this.state.sel || G[g][1][0];\n    const groups = G.map((x, i) => ({ label: x[0], pick: () => this.setState({ g: i, sel: G[i][1][0], msg: false }), pressed: i === g ? 'true' : 'false', bg: i === g ? '#0a5cc2' : '#ffffff', fg: i === g ? '#ffffff' : '#0e1a2b', border: i === g ? '#0a5cc2' : '#cfd8e2' }));\n    let count = 0;\n    G.forEach((x, gi) => x[1].forEach(t => { if (t === sel) count = 0; }));\n    const items = G[g][1].map((title, i) => {\n      let n = 0; for (let a = 0; a < g; a++) n += G[a][1].length;\n      return { n: String(n + i + 1), title, pick: () => this.setState({ sel: title, msg: false }), pressed: title === sel ? 'true' : 'false', bg: title === sel ? '#e6f1ff' : '#ffffff', border: title === sel ? '#7fb9ff' : '#cfd8e2' };\n    });\n    return { groups, items, cur: sel, msg: this.state.msg ? 'yes' : '', gen: () => this.setState({ msg: true }) };\n  }\n}\n<\/script>\n<\/body>\n<\/html>\n", "Rfis": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>RFIs and Technical Queries<\/title>\n<script src=\"./support.js\"><\/script>\n<\/head>\n<body>\n<x-dc>\n<helmet><style>body{margin:0}<\/style><\/helmet>\n<dc-import name=\"DocFolder\" nav-key=\"rfi\" kicker=\"DELIVERY\" title=\"RFIs and Technical Queries\" blurb=\"Requests for information, technical queries and their responses, each timestamped when uploaded.\" folder-no=\"07\" types=\"Request for information,Technical query,Response,Clarification,Other\" prefix=\"RFI\" store-key=\"rfi\" hint-size=\"100%,1100px\"><\/dc-import>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script data-props='{\"$preview\":{\"width\":1360,\"height\":1100}}'>\nclass Component extends DCLogic { renderVals() { return {}; } }\n<\/script>\n<\/body>\n<\/html>\n", "Risk": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>Risk Register<\/title>\n<script src=\"./support.js\"><\/script>\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap\" rel=\"stylesheet\">\n<style>\nbody{margin:0;font-family:\"Plus Jakarta Sans\",system-ui,sans-serif;color:#0e1a2b;background:#f3f5f9}\nbutton{font-family:inherit}\n<\/style>\n<\/helmet>\n<div style=\"display:flex;flex-wrap:wrap;min-height:100vh\">\n<div style=\"flex:0 0 260px\"><dc-import name=\"Nav\" active=\"risk\" hint-size=\"260px,1000px\"><\/dc-import><\/div>\n<main style=\"flex:999 1 560px;min-width:0;padding:24px 28px 40px;box-sizing:border-box\">\n<div style=\"font-size:11px;letter-spacing:.14em;font-weight:700;color:#0067cc\">DELIVERY<\/div>\n<h1 style=\"margin:4px 0 6px;font-size:28px;font-weight:800\">Risk Register and Early Warnings<\/h1>\n<p style=\"margin:0 0 22px;font-size:14px;color:#4a5a6e;max-width:760px;line-height:1.55\">Score risks by probability times impact. A registered risk can start a linked contractual assessment, but it never creates an entitlement by itself.<\/p>\n\n<div style=\"display:flex;flex-wrap:wrap;gap:24px;align-items:stretch;margin-bottom:28px\">\n<section style=\"flex:0 1 460px;min-width:300px\">\n<h2 style=\"font-size:18px;font-weight:800;margin:0 0 10px\">Heat map<\/h2>\n<div style=\"display:flex;gap:8px;align-items:stretch\">\n<div style=\"flex:0 0 22px;display:flex;align-items:center;justify-content:center\"><span style=\"transform:rotate(-90deg);white-space:nowrap;font-size:12px;font-weight:700;color:#4a5a6e\">PROBABILITY<\/span><\/div>\n<div style=\"flex:1 1 auto\">\n<div style=\"display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px\">\n<sc-for list=\"{{cells}}\" as=\"c\" hint-placeholder-count=\"25\">\n<button onClick=\"{{c.pick}}\" aria-label=\"{{c.aria}}\" aria-pressed=\"{{c.pressed}}\" style=\"aspect-ratio:1;min-height:44px;border-radius:8px;border:{{c.border}};background:{{c.bg}};color:{{c.fg}};font-size:13px;font-weight:800;cursor:pointer\">{{c.score}}<\/button>\n<\/sc-for>\n<\/div>\n<div style=\"text-align:center;font-size:12px;font-weight:700;color:#4a5a6e;margin-top:6px\">IMPACT<\/div>\n<\/div>\n<\/div>\n<div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;font-size:12px;font-weight:700\">\n<span style=\"padding:4px 10px;border-radius:999px;background:#e3f3ea;color:#145c36;border:1px solid #9bcdb0\">✓ Low 1 to 4<\/span>\n<span style=\"padding:4px 10px;border-radius:999px;background:#fff1cc;color:#6b4600;border:1px solid #e0b84f\">▲ Medium 5 to 9<\/span>\n<span style=\"padding:4px 10px;border-radius:999px;background:#ffe0b8;color:#7a3a00;border:1px solid #e5a15a\">▲ High 10 to 16<\/span>\n<span style=\"padding:4px 10px;border-radius:999px;background:#ffedd5;color:#9a3412;border:1px solid #fdba74\">■ Critical 17 to 25<\/span>\n<\/div>\n<\/section>\n<section style=\"flex:1 1 300px;min-width:0;background:#fff;border-radius:16px;border:1px solid #e1e7ee;padding:20px 22px\">\n<div style=\"font-size:12px;font-weight:700;color:#4a5a6e\">SELECTED CELL<\/div>\n<div style=\"font-size:22px;font-weight:800;margin:4px 0\">{{sel.title}}<\/div>\n<div style=\"font-size:14px;line-height:1.6;color:#0e1a2b\">{{sel.text}}<\/div>\n<div style=\"margin-top:12px;font-size:13px;color:#4a5a6e\">Risks in this cell: <strong>0<\/strong> (no risks registered).<\/div>\n<div style=\"margin-top:16px;padding:12px 14px;background:#fff7dd;border:1px solid #e8c766;border-radius:12px;font-size:13px;line-height:1.5;color:#4a3200\">Scale labels and score bands are editable defaults for the team to confirm.<\/div>\n<\/section>\n<\/div>\n\n<h2 style=\"font-size:18px;font-weight:800;margin:0 0 4px\">Risk categories<\/h2>\n<p style=\"margin:0 0 12px;font-size:13.5px;color:#4a5a6e\">Configurable. Starting list:<\/p>\n<div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px\">\n<sc-for list=\"{{cats}}\" as=\"k\" hint-placeholder-count=\"17\"><span style=\"padding:7px 13px;border-radius:999px;background:#fff;border:1px solid #cfd8e2;font-size:13px\">{{k.label}}<\/span><\/sc-for>\n<\/div>\n<div style=\"background:#fff;border:1px dashed #9aa9ba;border-radius:16px;padding:26px;text-align:center;font-size:14px;color:#4a5a6e\">No risks registered. High-priority list, mitigation tracking and overdue actions appear here once risks are added.<\/div>\n<\/main>\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script data-props='{\"$preview\":{\"width\":1360,\"height\":1300}}'>\nclass Component extends DCLogic {\n  renderVals() {\n    const sel = this.state.sel || null;\n    const probs = ['Very low', 'Low', 'Medium', 'High', 'Very high'];\n    const imps = ['Minor', 'Moderate', 'Significant', 'Major', 'Severe'];\n    const cells = [];\n    for (let p = 5; p >= 1; p--) {\n      for (let i = 1; i <= 5; i++) {\n        const s = p * i;\n        let bg = '#e3f3ea', fg = '#145c36';\n        if (s >= 17) { bg = '#ffedd5'; fg = '#9a3412'; }\n        else if (s >= 10) { bg = '#ffe0b8'; fg = '#7a3a00'; }\n        else if (s >= 5) { bg = '#fff1cc'; fg = '#6b4600'; }\n        const on = sel && sel[0] === p && sel[1] === i;\n        cells.push({ score: String(s), bg, fg, aria: 'Probability ' + probs[p - 1] + ', impact ' + imps[i - 1] + ', score ' + s, pressed: on ? 'true' : 'false', border: on ? '3px solid #0e1a2b' : '1px solid rgba(14,26,43,.12)', pick: () => this.setState({ sel: [p, i] }) });\n      }\n    }\n    let cur = { title: 'None selected', text: 'Select a cell to see its score and band.' };\n    if (sel) {\n      const s = sel[0] * sel[1];\n      const band = s >= 17 ? 'Critical' : s >= 10 ? 'High' : s >= 5 ? 'Medium' : 'Low';\n      cur = { title: 'Score ' + s + ' · ' + band, text: 'Probability: ' + probs[sel[0] - 1] + ' (' + sel[0] + '). Impact: ' + imps[sel[1] - 1] + ' (' + sel[1] + ').' };\n    }\n    const cats = ['Design coordination','Procurement and long-lead equipment','Airport operational requirements','Specialist systems','Contractor performance','Delays','Unforeseen physical conditions','Weather','Logistics','Customs and border clearance','Local regulatory approvals','Security','Utilities','Testing and commissioning','Quality','Health and safety','Environmental and social'].map(label => ({ label }));\n    return { cells, sel: cur, cats };\n  }\n}\n<\/script>\n<\/body>\n<\/html>\n", "Settings": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>System Settings<\/title>\n<script src=\"./support.js\"><\/script>\n<\/head>\n<body>\n<x-dc>\n<helmet><style>body{margin:0}<\/style><\/helmet>\n<dc-import name=\"DocFolder\" nav-key=\"settings\" kicker=\"ADMINISTRATION\" title=\"System Settings and Project Setup\" blurb=\"Upload the contract documents used to set up the project. A Contract Manager must verify each deadline rule before it can generate live deadlines.\" folder-no=\"01\" types=\"Executed Contract Agreement,General Conditions,Particular Conditions,Contract Data,Employer's Requirements,Contractor's Proposal,Accepted programme,Other\" prefix=\"SET\" store-key=\"settings\" hint-size=\"100%,1100px\"><\/dc-import>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script data-props='{\"$preview\":{\"width\":1360,\"height\":1100}}'>\nclass Component extends DCLogic { renderVals() { return {}; } }\n<\/script>\n<\/body>\n<\/html>\n", "TakingOver": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>Taking-Over and Defects<\/title>\n<script src=\"./support.js\"><\/script>\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap\" rel=\"stylesheet\">\n<style>\nbody{margin:0;font-family:\"Plus Jakarta Sans\",system-ui,sans-serif;color:#0e1a2b;background:#f3f5f9}\nbutton,input{font-family:inherit}\n<\/style>\n<\/helmet>\n<div style=\"display:flex;flex-wrap:wrap;min-height:100vh\">\n<div style=\"flex:0 0 260px\"><dc-import name=\"Nav\" active=\"toc\" hint-size=\"260px,1000px\"><\/dc-import><\/div>\n<main style=\"flex:999 1 560px;min-width:0;padding:24px 28px 40px;box-sizing:border-box\">\n<div style=\"font-size:11px;letter-spacing:.14em;font-weight:700;color:#6d5bd0\">COMPLETION<\/div>\n<h1 style=\"margin:4px 0 6px;font-size:28px;font-weight:800\">Taking-Over and Defects Notification Period<\/h1>\n<p style=\"margin:0 0 22px;font-size:14px;color:#4a5a6e;max-width:760px;line-height:1.55\">Tracks readiness and records. The system never issues a Taking-Over Certificate and never decides that Taking-Over has occurred. Authorised personnel do that under the contract.<\/p>\n\n<h2 style=\"font-size:18px;font-weight:800;margin:0 0 10px\">Taking-Over tracker<\/h2>\n<div style=\"display:flex;flex-wrap:wrap;gap:0;margin-bottom:12px\">\n<sc-for list=\"{{stages}}\" as=\"s\" hint-placeholder-count=\"6\">\n<button onClick=\"{{s.pick}}\" aria-pressed=\"{{s.pressed}}\" style=\"flex:1 1 140px;min-height:60px;padding:8px 12px;border:1px solid {{s.border}};background:{{s.bg}};color:{{s.fg}};font-size:13px;font-weight:700;cursor:pointer;text-align:left\">{{s.title}}<\/button>\n<\/sc-for>\n<\/div>\n<div style=\"background:#fff;border-radius:16px;padding:18px 22px;border:1px solid #e1e7ee;margin-bottom:28px;font-size:14px;line-height:1.6\">{{curStage}}<\/div>\n\n<h2 style=\"font-size:18px;font-weight:800;margin:0 0 4px\">Readiness checklist<\/h2>\n<p style=\"margin:0 0 12px;font-size:13.5px;color:#4a5a6e\">Items are configured for the actual scope. Tick to see the readiness figure. This is a prototype checklist only.<\/p>\n<div style=\"display:flex;flex-wrap:wrap;gap:22px;align-items:stretch;margin-bottom:28px\">\n<div style=\"flex:1 1 360px;min-width:0;background:#fff;border-radius:16px;border:1px solid #e1e7ee;padding:8px 18px\">\n<sc-for list=\"{{checks}}\" as=\"c\" hint-placeholder-count=\"8\">\n<label style=\"display:flex;gap:12px;align-items:center;min-height:44px;font-size:14px;cursor:pointer;border-bottom:1px solid #edf1f5\"><input type=\"checkbox\" checked=\"{{c.on}}\" onChange=\"{{c.flip}}\" style=\"width:20px;height:20px;accent-color:#0a5cc2\"><span>{{c.label}}<\/span><\/label>\n<\/sc-for>\n<\/div>\n<div style=\"flex:0 1 260px;min-width:220px;background:#fff;border-radius:16px;border:1px solid #e1e7ee;padding:20px;text-align:center\">\n<div style=\"font-size:12px;font-weight:700;color:#4a5a6e\">OUTSTANDING ITEMS<\/div>\n<div style=\"font-size:44px;font-weight:800;margin:6px 0\">{{left}}<\/div>\n<div style=\"height:10px;border-radius:999px;background:#eaeff4;overflow:hidden\"><div style=\"height:100%;width:{{pct}};background:#0067cc\"><\/div><\/div>\n<div style=\"font-size:12.5px;color:#4a5a6e;margin-top:8px\">{{done}} of {{total}} recorded as complete<\/div>\n<div style=\"font-size:12px;color:#4a5a6e;margin-top:10px;line-height:1.5\">This does not confirm Taking-Over.<\/div>\n<\/div>\n<\/div>\n\n<h2 style=\"font-size:18px;font-weight:800;margin:0 0 4px\">Defects Notification Period<\/h2>\n<p style=\"margin:0 0 12px;font-size:13.5px;color:#4a5a6e\">The contract sets the start, duration and any extension. Try the end-date calculation with your own values.<\/p>\n<div style=\"display:flex;flex-wrap:wrap;gap:22px;align-items:stretch\">\n<div style=\"flex:1 1 300px;max-width:420px;background:#fff;border-radius:16px;border:1px solid #e1e7ee;padding:16px 18px\">\n<label for=\"ds\" style=\"display:block;font-size:13px;font-weight:700;margin-bottom:4px\">Start date (simulation)<\/label>\n<input id=\"ds\" type=\"date\" value=\"{{start}}\" onInput=\"{{setStart}}\" style=\"width:100%;box-sizing:border-box;min-height:44px;padding:0 10px;border:1px solid #9aa9ba;border-radius:8px;font-size:14px;margin-bottom:12px\">\n<label for=\"dm\" style=\"display:block;font-size:13px;font-weight:700;margin-bottom:4px\">Duration in months (simulation)<\/label>\n<input id=\"dm\" type=\"number\" min=\"1\" value=\"{{months}}\" onInput=\"{{setMonths}}\" placeholder=\"From the contract\" style=\"width:100%;box-sizing:border-box;min-height:44px;padding:0 10px;border:1px solid #9aa9ba;border-radius:8px;font-size:14px\">\n<\/div>\n<div style=\"flex:1 1 300px;min-width:0;background:#fff;border:2px dashed #0b4fb3;border-radius:16px;padding:16px 18px\">\n<div style=\"font-size:12px;font-weight:700;color:#0b4fb3;margin-bottom:6px\">SIMULATION · not a contractual date<\/div>\n<div style=\"font-size:12px;color:#4a5a6e\">Calculated end date<\/div>\n<div style=\"font-size:22px;font-weight:800;margin:2px 0 8px\">{{endDate}}<\/div>\n<div style=\"font-size:13px;color:#4a5a6e;line-height:1.5\">{{endNote}}<\/div>\n<\/div>\n<\/div>\n<\/main>\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script data-props='{\"$preview\":{\"width\":1360,\"height\":1500}}'>\nclass Component extends DCLogic {\n  renderVals() {\n    const G = [\n      [\"Contractor's application\", \"The Contractor's application or request is recorded with date and time.\"],\n      ['Completion requirements', 'The contractual requirements, Tests on Completion and outstanding items are listed.'],\n      [\"Engineer's inspection\", 'The inspection is scheduled and its findings are recorded.'],\n      ['Documentation', 'Required documents, certificates and manuals are tracked.'],\n      [\"Engineer's response\", \"The Engineer's response and any reasons are recorded.\"],\n      ['Certificate (if issued)', 'If an authorised person issues a Taking-Over Certificate, its date and consequences are recorded. The system does not issue it.']\n    ];\n    const sel = this.state.sel || 0;\n    const stages = G.map((g, i) => ({ title: (i + 1) + '. ' + g[0], pick: () => this.setState({ sel: i }), pressed: i === sel ? 'true' : 'false', bg: i === sel ? '#6d5bd0' : '#ffffff', fg: i === sel ? '#ffffff' : '#0e1a2b', border: i === sel ? '#6d5bd0' : '#cfd8e2' }));\n    const names = ['Outstanding works completed','Tests on Completion passed','Fire and life safety systems tested','Electrical systems tested','Mechanical systems tested','Lifts tested','Control tower systems tested','Communications and airport systems tested','Integrated systems testing','Training records complete','Operation and maintenance manuals','As-built drawings','Regulatory and authority documents','Taking-Over submissions'];\n    const on = this.state.on || names.map(() => false);\n    const checks = names.map((label, i) => ({ label, on: on[i], flip: () => { const n = on.slice(); n[i] = !n[i]; this.setState({ on: n }); } }));\n    const done = on.filter(Boolean).length;\n    const start = this.state.start || '';\n    const months = this.state.months === undefined ? '' : this.state.months;\n    let endDate = 'Not calculated', endNote = 'Enter a start date and duration. Real values come from the contract.';\n    const m = parseInt(months, 10);\n    if (start && !isNaN(m) && m > 0) {\n      const d = new Date(start + 'T00:00:00Z');\n      d.setUTCMonth(d.getUTCMonth() + m);\n      endDate = d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });\n      endNote = 'Start date plus ' + m + ' calendar months. Extensions and counting rules from the contract are not applied here.';\n    }\n    return {\n      stages, curStage: G[sel][1], checks, done: String(done), total: String(names.length),\n      left: String(names.length - done), pct: (done / names.length * 100) + '%',\n      start, months, endDate, endNote,\n      setStart: (e) => this.setState({ start: e.target.value }),\n      setMonths: (e) => this.setState({ months: e.target.value })\n    };\n  }\n}\n<\/script>\n<\/body>\n<\/html>\n", "Testing": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>Testing and Commissioning<\/title>\n<script src=\"./support.js\"><\/script>\n<\/head>\n<body>\n<x-dc>\n<helmet><style>body{margin:0}<\/style><\/helmet>\n<dc-import name=\"DocFolder\" nav-key=\"test\" kicker=\"COMPLETION\" title=\"Testing and Commissioning\" blurb=\"Test procedures, results, certificates, training records and manuals for the terminal and control tower systems.\" folder-no=\"21\" types=\"Test procedure,Test result,Pre-commissioning checklist,Certificate,Training record,O&amp;M manual,Retest record,Other\" prefix=\"TST\" store-key=\"test\" hint-size=\"100%,1100px\"><\/dc-import>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script data-props='{\"$preview\":{\"width\":1360,\"height\":1100}}'>\nclass Component extends DCLogic { renderVals() { return {}; } }\n<\/script>\n<\/body>\n<\/html>\n", "Trackers": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>All Trackers<\/title>\n<script src=\"./support.js\"><\/script>\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap\" rel=\"stylesheet\">\n<style>\nbody{margin:0;font-family:\"Plus Jakarta Sans\",system-ui,sans-serif;color:#0e1a2b;background:#f3f5f9}\nbutton,input,select,textarea{font-family:inherit;font-size:14px}\ninput,select,textarea{border:1px solid #b9c4d0;border-radius:8px;padding:9px 10px;box-sizing:border-box;width:100%;background:#fff;color:#0e1a2b}\nlabel.f{display:block;font-size:12px;font-weight:700;color:#4a5a6e;margin-bottom:8px}\nlabel.f>*{margin-top:4px;font-weight:400}\n.gq{display:grid;align-items:stretch}\n.gq>*{box-sizing:border-box;min-width:0;height:100%}\n.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.c4{grid-template-columns:repeat(4,minmax(0,1fr))}\n@media (max-width:1000px){.c4{grid-template-columns:repeat(2,minmax(0,1fr))}.c3{grid-template-columns:repeat(2,minmax(0,1fr))}}\n@media (max-width:640px){.c3,.c4{grid-template-columns:minmax(0,1fr)}}\n<\/style>\n<\/helmet>\n<div style=\"display:flex;flex-wrap:wrap;min-height:100vh\">\n<div style=\"flex:0 0 260px\"><dc-import name=\"Nav\" active=\"trackers\" hint-size=\"260px,1000px\"><\/dc-import><\/div>\n<main style=\"flex:999 1 560px;min-width:0;padding:24px 28px 40px;box-sizing:border-box\">\n<div style=\"font-size:11px;letter-spacing:.14em;font-weight:700;color:#0a5cc2\">{{k.eyebrow}}<\/div>\n<h1 style=\"margin:4px 0 6px;font-size:28px;font-weight:800\">{{k.title}}<\/h1>\n<p style=\"margin:0 0 14px;font-size:14px;color:#4a5a6e;max-width:860px;line-height:1.55\">{{k.intro}}<\/p>\n<div style=\"background:#fff7dd;border:1px solid #e0b84f;border-radius:10px;padding:10px 14px;font-size:13px;color:#4a3200;margin-bottom:18px;max-width:860px;line-height:1.5\"><b>{{k.protoB}}<\/b> {{k.proto}}<\/div>\n\n<div class=\"gq c4\" style=\"gap:14px;margin-bottom:20px\">\n<sc-for list=\"{{tiles}}\" as=\"t\" hint-placeholder-count=\"4\">\n<div style=\"background:#fff;border:1px solid #e1e7ee;border-top:4px solid {{t.color}};border-radius:14px;padding:14px 16px\"><div style=\"font-size:12px;color:#4a5a6e;font-weight:600\">{{t.label}}<\/div><div style=\"font-size:26px;font-weight:800;margin-top:4px\">{{t.value}}<\/div><\/div>\n<\/sc-for>\n<\/div>\n\n<div style=\"display:flex;flex-wrap:wrap;gap:22px;align-items:stretch\">\n<section style=\"flex:2 1 520px;min-width:0\" ce qui a un échéancier au même endroit : réclamations, modifications, demandes de paiement, certificats, demandes d\\'information, soumissions de conception, instructions, déterminations, alertes précoces, garanties, assurances et approvisionnement. Une date est soit votre objectif interne, soit issue d\\'une règle contractuelle approuvée. Elle n\\'est jamais devinée.'),\n      protoB: T('Prototype:', 'Prototype :'), proto: T('Records stay in this browser only. In the live system they are shared, access-controlled and every change is logged.', 'Les enregistrements restent dans ce navigateur uniquement. Dans le système réel, ils sont partagés, protégés par des droits d\\'accès et chaque modification est journalisée.'),\n      empty: T('Nothing is being tracked yet. Add the first item on the right.', 'Rien n\\'est encore suivi. Ajoutez le premier élément à droite.'),\n      also: T('In the live system this timeline also pulls in calculated contractual deadlines, open NCRs, corrective actions, planned quality audits and the monthly report due date, each from its own page.', 'Dans le système réel, cet échéancier inclut aussi les délais contractuels calculés, les NCR ouvertes, les actions correctives, les audits qualité planifiés et la date de remise du rapport mensuel, chacun depuis sa propre page.'),\n      close: T('Close', 'Clore'), addTitle: T('Add to the tracker', 'Ajouter au suivi'), kind: T('Kind', 'Type'), what: T('What is being tracked', 'Ce qui est suivi'), owner: T('Owner (name)', 'Responsable (nom)'),\n      basisL: T('Date', 'Date'), bNone: T('No date', 'Sans date'), bInternal: T('Internal target (my own date)', 'Objectif interne (ma propre date)'),\n      bContract: T('Contract deadline: needs an approved rule (none yet)', 'Délai contractuel : nécessite une règle approuvée (aucune pour l\\'instant)'),\n      date: T('Target date', 'Date cible'), basisNote: T('A contract deadline can only be linked once the deadline rule has been verified and approved. Unti

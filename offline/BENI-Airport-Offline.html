outé pour le moment. Ajoutez le texte du contrat à droite, puis posez votre question.\\\",\\\"Not found in the documents you added. Do not rely on an answer. Check the source or ask the Contract Manager.\\\":\\\"Introuvable dans les documents ajoutés. Ne vous fiez pas à une réponse. Vérifiez la source ou interrogez le Gestionnaire de contrat.\\\",\\\"Or paste the text\\\":\\\"Ou collez le texte\\\",\\\"PDF and Word files are read in the live system. Here, paste text or use a text file. Nothing leaves this device.\\\":\\\"Les fichiers PDF et Word sont lus dans le système en production. Ici, collez du texte ou utilisez un fichier texte. Rien ne quitte cet appareil.\\\",\\\"Prototype:\\\":\\\"Prototype :\\\",\\\"Remove\\\":\\\"Supprimer\\\",\\\"Search the documents\\\":\\\"Rechercher dans les documents\\\",\\\"This device cannot store that much text.\\\":\\\"Cet appareil ne peut pas stocker autant de texte.\\\",\\\"Your question\\\":\\\"Votre question\\\",\\\"this page searches the text you add below, on this device only. It shows the matching passages. In the live system, an AI model writes a short answer from those same passages and cites them. It is a reading aid, not legal advice. The contract documents and the Engineer's decisions prevail.\\\":\\\"cette page recherche dans le texte que vous ajoutez ci-dessous, sur cet appareil uniquement. Elle affiche les passages correspondants. Dans le système en production, un modèle d'IA rédige une courte réponse à partir de ces mêmes passages et les cite. C'est une aide à la lecture, pas un avis juridique. Les documents contractuels et les décisions de l'Ingénieur prévalent.\\\",\\\" offline, alerts queued.\\\":\\\" hors ligne, alertes en file d'attente.\\\",\\\" tagged. \\\":\\\" identifié(s). \\\",\\\"Add a team member\\\":\\\"Ajouter un membre de l'équipe\\\",\\\"Add to directory\\\":\\\"Ajouter à l'annuaire\\\",\\\"Administrator WhatsApp number\\\":\\\"Numéro WhatsApp de l'administrateur\\\",\\\"Alerts queued (not yet sent in this prototype): \\\":\\\"Alertes en file d'attente (pas encore envoyées dans ce prototype) : \\\",\\\"All online.\\\":\\\"Tous en ligne.\\\",\\\"BENI Airport platform: I need help from the administrator.\\\":\\\"Plateforme BENI Airport : j'ai besoin d'aide de la part de l'administrateur.\\\",\\\"Chat with the administrator on WhatsApp\\\":\\\"Discuter avec l'administrateur sur WhatsApp\\\",\\\"Choose a team member\\\":\\\"Choisir un membre de l'équipe\\\",\\\"Choose who is posting.\\\":\\\"Choisissez qui publie.\\\",\\\"Enter a name.\\\":\\\"Saisissez un nom.\\\",\\\"Enter the number the administrator has agreed to use, starting with + and the country code.\\\":\\\"Saisissez le numéro convenu avec l'administrateur, commençant par + et l'indicatif du pays.\\\",\\\"Everyone tagged was online. No alert needed.\\\":\\\"Toutes les personnes identifiées étaient en ligne. Aucune alerte nécessaire.\\\",\\\"Full name\\\":\\\"Nom complet\\\",\\\"Messages cannot be edited or deleted. They are removed automatically after\\\":\\\"Les messages ne peuvent pas être modifiés ni supprimés. Ils sont supprimés automatiquement après\\\",\\\"No email\\\":\\\"Pas d'e-mail\\\",\\\"No messages in this channel yet.\\\":\\\"Aucun message dans ce canal pour le moment.\\\",\\\"No phone\\\":\\\"Pas de téléphone\\\",\\\"No team members yet. Add each person with their official email and phone number.\\\":\\\"Aucun membre d'équipe pour le moment. Ajoutez chaque personne avec son e-mail officiel et son numéro de téléphone.\\\",\\\"Official email\\\":\\\"E-mail officiel\\\",\\\"Offline\\\":\\\"Hors ligne\\\",\\\"Online\\\":\\\"En ligne\\\",\\\"Opens WhatsApp with a ready message.\\\":\\\"Ouvre WhatsApp avec un message prêt à envoyer.\\\",\\\"Phone must start with + and the country code.\\\":\\\"Le téléphone doit commencer par + et l'indicatif du pays.\\\",\\\"Phone, with country code (+243...)\\\":\\\"Téléphone, avec indicatif du pays (+243...)\\\",\\\"Posting as\\\":\\\"Publier en tant que\\\",\\\"Raise a quick query with the team. Tag someone with @name. If they are not online, they are alerted on WhatsApp and by email. Every message is kept for at least 30 days for review.\\\":\\\"Posez rapidement une question à l'équipe. Identifiez quelqu'un avec @nom. Si la personne n'est pas en ligne, elle est alertée sur WhatsApp et par e-mail. Chaque message est conservé au moins 30 jours pour examen.\\\",\\\"Reach the system administrator\\\":\\\"Contacter l'administrateur du système\\\",\\\"Role and organisation\\\":\\\"Rôle et organisation\\\",\\\"Role not entered\\\":\\\"Rôle non renseigné\\\",\\\"Send\\\":\\\"Envoyer\\\",\\\"Sent.\\\":\\\"Envoyé.\\\",\\\"Tag:\\\":\\\"Identifier :\\\",\\\"Team Chat\\\":\\\"Discussion d'équipe\\\",\\\"Team directory\\\":\\\"Annuaire de l'équipe\\\",\\\"That email does not look right.\\\":\\\"Cet e-mail ne semble pas correct.\\\",\\\"This person agrees to receive project alerts on WhatsApp at this number.\\\":\\\"Cette personne accepte de recevoir les alertes du projet sur WhatsApp à ce numéro.\\\",\\\"Type @ and a name to tag someone\\\":\\\"Tapez @ et un nom pour identifier quelqu'un\\\",\\\"Type a message first.\\\":\\\"Saisissez d'abord un message.\\\",\\\"WhatsApp alerts: agreed\\\":\\\"Alertes WhatsApp : acceptées\\\",\\\"WhatsApp alerts: no consent recorded\\\":\\\"Alertes WhatsApp : aucun consentement enregistré\\\",\\\"WhatsApp consent needs a phone number.\\\":\\\"Le consentement WhatsApp nécessite un numéro de téléphone.\\\",\\\"WhatsApp queued\\\":\\\"WhatsApp en file d'attente\\\",\\\"WhatsApp skipped (\\\":\\\"WhatsApp ignoré (\\\",\\\"days (the minimum is 30). A person counts as online if they were active in the last 2 minutes.\\\":\\\"jours (le minimum est de 30). Une personne est considérée en ligne si elle a été active au cours des 2 dernières minutes.\\\",\\\"email queued\\\":\\\"e-mail en file d'attente\\\",\\\"email skipped (no address)\\\":\\\"e-mail ignoré (aucune adresse)\\\",\\\"no consent recorded\\\":\\\"aucun consentement enregistré\\\",\\\"no phone number\\\":\\\"aucun numéro de téléphone\\\",\\\"nothing is sent from this page. It shows what the live system queues. Chat is for simple queries. A contractual notice must still be issued from Notices and Deadlines.\\\":\\\"rien n'est envoyé depuis cette page. Elle montre ce que le système en production met en file d'attente. La discussion sert aux questions simples. Une notification contractuelle doit toujours être émise depuis Notifications et Délais.\\\",\\\"A claim needs a linked Notice of Claim record. The notice deadline comes from an Approved for Use rule, and a passed response date is never treated as acceptance.\\\":\\\"Une réclamation nécessite un enregistrement de Notification de Réclamation lié. Le délai de notification provient d'une règle Approuvé pour utilisation, et une date de réponse dépassée n'est jamais considérée comme une acceptation.\\\",\\\"A claimed sum is not an assessed sum, a determined sum, or money certified and paid.\\\":\\\"Un montant réclamé n'est pas un montant évalué, un montant déterminé, ni une somme certifiée et payée.\\\",\\\"A draft Notice of Claim is prepared and linked to the event.\\\":\\\"Un projet de Notification de Réclamation est préparé et lié à l'événement.\\\",\\\"A draft is not a formally issued notice.\\\":\\\"Un brouillon n'est pas une notification formellement émise.\\\",\\\"A late submission shows the actual timeline and is flagged for assessment, not silently adjusted.\\\":\\\"Une soumission tardive affiche le calendrier réel et est signalée pour évaluation, sans ajustement silencieux.\\\",\\\"A passed response date does not mean the claim is accepted.\\\":\\\"Une date de réponse dépassée ne signifie pas que la réclamation est acceptée.\\\",\\\"A reviewer comments or clears the draft.\\\":\\\"Un relecteur commente ou valide le brouillon.\\\",\\\"Amicable settlement and proceedings\\\":\\\"Règlement amiable et procédures\\\",\\\"Amount assessed\\\":\\\"Montant évalué\\\",\\\"Amount claimed\\\":\\\"Montant réclamé\\\",\\\"Amount determined\\\":\\\"Montant déterminé\\\",\\\"An authorised approver signs off for issue.\\\":\\\"Un approbateur autorisé valide l'émission.\\\",\\\"An email being prepared is not an issue event.\\\":\\\"Un e-mail en cours de préparation n'est pas un événement d'émission.\\\",\\\"Approved and revised drawings\\\":\\\"Plans approuvés et révisés\\\",\\\"Awaiting Detailed Particulars\\\":\\\"En attente des Détails Particuliers\\\",\\\"Awaiting Engineer action\\\":\\\"En attente d'une action de l'Ingénieur\\\",\\\"Awaiting notices\\\":\\\"En attente de notifications\\\",\\\"CONTRACT · SUB-CLAUSE 20.2 AND RELATED PROCEDURES\\\":\\\"CONTRAT · SOUS-CLAUSE 20.2 ET PROCÉDURES CONNEXES\\\",\\\"Certified or paid\\\":\\\"Certifié ou payé\\\",\\\"Claim closed with outcome\\\":\\\"Réclamation clôturée avec résultat\\\",\\\"Claim substantiated\\\":\\\"Réclamation étayée\\\",\\\"Claim workflow\\\":\\\"Flux de travail des réclamations\\\",\\\"Claims and Extensions of Time\\\":\\\"Réclamations et Prorogations du délai\\\",\\\"Claims register\\\":\\\"Registre des réclamations\\\",\\\"Claims with approaching deadlines\\\":\\\"Réclamations aux échéances proches\\\",\\\"Closing needs a recorded outcome and authorisation.\\\":\\\"La clôture nécessite un résultat enregistré et une autorisation.\\\",\\\"Contractor and Employer claims, tracked from event to outcome. Not every claim follows the same path, so steps can be skipped or repeated for continuing claims when the contract procedure differs.\\\":\\\"Réclamations de l'Entrepreneur et du Maître de l'Ouvrage, suivies de l'événement au résultat. Toutes les réclamations ne suivent pas le même parcours ; des étapes peuvent donc être ignorées ou répétées pour les réclamations continues lorsque la procédure contractuelle diffère.\\\",\\\"Contractual entitlement reviewed\\\":\\\"Droit contractuel examiné\\\",\\\"Correspondence\\\":\\\"Correspondance\\\",\\\"Cost records\\\":\\\"Relevés de coûts\\\",\\\"Counts show live records only. No claims are registered yet.\\\":\\\"Les compteurs n'affichent que les enregistrements actifs. Aucune réclamation n'est encore enregistrée.\\\",\\\"Courier receipt, signed copy or other delivery evidence is attached.\\\":\\\"Le récépissé de coursier, la copie signée ou une autre preuve de remise est joint.\\\",\\\"DAAB referral tracked\\\":\\\"Renvoi au DAAB suivi\\\",\\\"Daily site reports\\\":\\\"Rapports journaliers du chantier\\\",\\\"Deadlines never reset when a document is uploaded.\\\":\\\"Les délais ne sont jamais réinitialisés lorsqu'un document est téléversé.\\\",\\\"Delivery evidenced\\\":\\\"Remise justifiée\\\",\\\"Delivery records\\\":\\\"Relevés de remise\\\",\\\"Detailed Particulars submitted\\\":\\\"Détails Particuliers soumis\\\",\\\"Determined\\\":\\\"Déterminé\\\",\\\"Determined amounts are kept apart from claimed amounts.\\\":\\\"Les montants déterminés sont distincts des montants réclamés.\\\",\\\"Each stage keeps its own evidence and history.\\\":\\\"Chaque étape conserve ses propres preuves et son historique.\\\",\\\"Engineer acknowledgment and response tracked\\\":\\\"Accusé de réception et réponse de l'Ingénieur suivis\\\",\\\"Engineer’s determination tracked\\\":\\\"Détermination de l'Ingénieur suivie\\\",\\\"Event date and awareness date are stored separately.\\\":\\\"La date de l'événement et la date de prise de connaissance sont enregistrées séparément.\\\",\\\"Event identified\\\":\\\"Événement identifié\\\",\\\"Event registered\\\":\\\"Événement enregistré\\\",\\\"Every attachment keeps its link to the claim and its own audit history.\\\":\\\"Chaque pièce jointe conserve son lien avec la réclamation et son propre historique d'audit.\\\",\\\"Evidence that links back to a claim\\\":\\\"Preuves liées à une réclamation\\\",\\\"Four amounts, never merged\\\":\\\"Quatre montants, jamais fusionnés\\\",\\\"Go to Notices and Deadlines\\\":\\\"Aller à Notifications et Délais\\\",\\\"Guardrail:\\\":\\\"Garde-fou :\\\",\\\"Identifying an event is not a finding of entitlement.\\\":\\\"Identifier un événement ne constitue pas une conclusion de droit.\\\",\\\"Inspection records\\\":\\\"Relevés d'inspection\\\",\\\"Issue date, time, sender, recipient and method are recorded.\\\":\\\"La date, l'heure, l'expéditeur, le destinataire et le mode d'émission sont enregistrés.\\\",\\\"Its period comes from the approved rule library.\\\":\\\"Sa période provient de la bibliothèque de règles approuvées.\\\",\\\"Labour and equipment records\\\":\\\"Relevés de main-d'œuvre et de matériel\\\",\\\"Meeting minutes\\\":\\\"Procès-verbaux de réunion\\\",\\\"Next step\\\":\\\"Étape suivante\\\",\\\"No claims registered\\\":\\\"Aucune réclamation enregistrée\\\",\\\"No extension is granted merely because a delay was registered.\\\":\\\"Aucune prorogation n'est accordée du seul fait qu'un retard a été enregistré.\\\",\\\"Notice approved\\\":\\\"Notification approuvée\\\",\\\"Notice formally issued\\\":\\\"Notification formellement émise\\\",\\\"Notice internally reviewed\\\":\\\"Notification examinée en interne\\\",\\\"Notice of Dissatisfaction recorded\\\":\\\"Notification de Mécontentement enregistrée\\\",\\\"Notice prepared\\\":\\\"Notification préparée\\\",\\\"Notice requirement assessed\\\":\\\"Exigence de notification évaluée\\\",\\\"Only an Approved for Use rule can generate a live deadline.\\\":\\\"Seule une règle Approuvé pour utilisation peut générer un délai actif.\\\",\\\"Other evidence\\\":\\\"Autres preuves\\\",\\\"Overdue claim actions\\\":\\\"Actions de réclamation en retard\\\",\\\"Particulars are prepared and submitted as the procedure requires, including interim and final submissions for continuing events.\\\":\\\"Les détails sont préparés et soumis selon la procédure, y compris les soumissions intermédiaires et finales pour les événements continus.\\\",\\\"Periods are configured, never hard-coded.\\\":\\\"Les périodes sont configurées, jamais codées en dur.\\\",\\\"Photograph upload time is shown separately from capture time.\\\":\\\"L'heure de téléversement de la photographie est affichée séparément de l'heure de prise de vue.\\\",\\\"Previous\\\":\\\"Précédent\\\",\\\"Programme updates\\\":\\\"Mises à jour du programme\\\",\\\"Receipt confirmation is a separate, later event.\\\":\\\"L'accusé de réception est un événement distinct et ultérieur.\\\",\\\"Records are attached: reports, photographs, programmes, cost records.\\\":\\\"Les documents sont joints : rapports, photographies, programmes, relevés de coûts.\\\",\\\"Referral, decision and any follow-up notices are recorded.\\\":\\\"Le renvoi, la décision et les éventuelles notifications de suivi sont enregistrés.\\\",\\\"Relevant deadline calculated\\\":\\\"Délai pertinent calculé\\\",\\\"Review is recorded with name and timestamp.\\\":\\\"La revue est enregistrée avec le nom et l'horodatage.\\\",\\\"STEP\\\":\\\"ÉTAPE\\\",\\\"Select a step to see what is recorded and what the system will not do for you.\\\":\\\"Sélectionnez une étape pour voir ce qui est enregistré et ce que le système ne fera pas à votre place.\\\",\\\"Settlement discussions and later proceedings are logged.\\\":\\\"Les discussions de règlement et les procédures ultérieures sont consignées.\\\",\\\"Site photographs\\\":\\\"Photographies du chantier\\\",\\\"Someone on site or in the office spots an event that may give rise to a claim.\\\":\\\"Une personne sur le chantier ou au bureau repère un événement pouvant donner lieu à une réclamation.\\\",\\\"Subject to disagreement\\\":\\\"Sujet à désaccord\\\",\\\"The Contract Manager reviews the clause basis, including Particular Conditions.\\\":\\\"Le Gestionnaire de contrat examine la base contractuelle, y compris les Conditions Particulières.\\\",\\\"The Engineer’s acknowledgment and response are logged with dates.\\\":\\\"L'accusé de réception et la réponse de l'Ingénieur sont consignés avec leurs dates.\\\",\\\"The determination, its date and the amount are recorded.\\\":\\\"La détermination, sa date et le montant sont enregistrés.\\\",\\\"The engine shows the rule used, the calculation and a countdown.\\\":\\\"Le moteur affiche la règle utilisée, le calcul et un compte à rebours.\\\",\\\"The event is entered with its date, date of awareness, cause and a unique reference.\\\":\\\"L'événement est saisi avec sa date, sa date de prise de connaissance, sa cause et une référence unique.\\\",\\\"The final outcome is documented and the claim is closed.\\\":\\\"Le résultat final est documenté et la réclamation est clôturée.\\\",\\\"The system never issues a notice without human approval.\\\":\\\"Le système n'émet jamais de notification sans approbation humaine.\\\",\\\"Time and cost impact are assessed against the approved programme.\\\":\\\"L'impact sur le délai et le coût est évalué par rapport au programme approuvé.\\\",\\\"Time and cost impacts assessed\\\":\\\"Impacts sur le délai et le coût évalués\\\",\\\"Total open claims\\\":\\\"Total des réclamations ouvertes\\\",\\\"Uncertain interpretation is flagged for review, not guessed.\\\":\\\"Une interprétation incertaine est signalée pour revue, et non devinée.\\\",\\\"Under assessment\\\":\\\"En cours d'évaluation\\\",\\\"Value in a recorded determination\\\":\\\"Valeur dans une détermination enregistrée\\\",\\\"Value in an IPC or payment record\\\":\\\"Valeur dans un IPC ou un relevé de paiement\\\",\\\"Value in the Engineer’s assessment\\\":\\\"Valeur dans l'évaluation de l'Ingénieur\\\",\\\"Value in the claimant’s submission\\\":\\\"Valeur dans la soumission du demandeur\\\",\\\"Weather records\\\":\\\"Relevés météorologiques\\\",\\\"Where applicable, a Notice of Dissatisfaction and its dates are recorded.\\\":\\\"Le cas échéant, une Notification de Mécontentement et ses dates sont enregistrées.\\\",\\\"Whether a notice is required, and which rule applies, is recorded.\\\":\\\"La nécessité d'une notification, et la règle applicable, sont enregistrées.\\\",\\\"A registered risk does not create entitlement.\\\":\\\"Un risque enregistré ne crée pas de droit.\\\",\\\"Accepted programme\\\":\\\"Programme accepté\\\",\\\"Administrative status never decides contractual validity.\\\":\\\"Le statut administratif ne décide jamais de la validité contractuelle.\\\",\\\"Advance Payment and Recovery\\\":\\\"Paiement d'avance et recouvrement\\\",\\\"Advance payment amount, security and recovery schedule.\\\":\\\"Montant du paiement d'avance, garantie et échéancier de recouvrement.\\\",\\\"An email being prepared is not proof of delivery.\\\":\\\"Un e-mail en cours de préparation n'est pas une preuve de remise.\\\",\\\"Application, assessment, certification, payment due date and actual payment as separate events.\\\":\\\"Demande, évaluation, certification, date d'échéance du paiement et paiement effectif en tant qu'événements distincts.\\\",\\\"Authorised parties and roles\\\":\\\"Parties et rôles autorisés\\\",\\\"CONTRACT ADMINISTRATION\\\":\\\"ADMINISTRATION DU CONTRAT\\\",\\\"Certification and payment periods are never assumed equal.\\\":\\\"Les périodes de certification et de paiement ne sont jamais supposées égales.\\\",\\\"Change workflow from identification to instruction, quotation, assessment and recorded approval.\\\":\\\"Flux de travail des modifications, de l'identification à l'instruction, au devis, à l'évaluation et à l'approbation enregistrée.\\\",\\\"Changing a deadline needs an authorised user and a documented reason. The original is preserved.\\\":\\\"Modifier un délai nécessite un utilisateur autorisé et un motif documenté. L'original est conservé.\\\",\\\"Claimed, assessed and determined extensions linked to delay events and programme versions.\\\":\\\"Prorogations réclamées, évaluées et déterminées, liées aux événements de retard et aux versions du programme.\\\",\\\"Claimed, assessed, determined and paid amounts are held separately. A passed response date never means acceptance.\\\":\\\"Les montants réclamés, évalués, déterminés et payés sont tenus séparément. Une date de réponse dépassée ne signifie jamais acceptation.\\\",\\\"Claims Register\\\":\\\"Registre des réclamations\\\",\\\"Claims and EOT\\\":\\\"Réclamations et EOT\\\",\\\"Closeout is blocked while obligations remain outstanding.\\\":\\\"La clôture est bloquée tant que des obligations restent en suspens.\\\",\\\"Commencement Date\\\":\\\"Date de commencement\\\",\\\"Communication procedures\\\":\\\"Procédures de communication\\\",\\\"Contemporaneous records are kept alongside each event.\\\":\\\"Des relevés contemporains sont conservés avec chaque événement.\\\",\\\"Contract Administration\\\":\\\"Administration du contrat\\\",\\\"Contract Data\\\":\\\"Données du Contrat\\\",\\\"Contract Particulars and Administration Setup\\\":\\\"Particularités du contrat et paramétrage de l'administration\\\",\\\"Contract Price and Time for Completion change only after the contractual action is recorded.\\\":\\\"Le Prix du Contrat et le Délai d'achèvement ne changent qu'après l'enregistrement de l'action contractuelle.\\\",\\\"Contract Price and payment terms\\\":\\\"Prix du Contrat et conditions de paiement\\\",\\\"Contractor application, Engineer inspection, outstanding items and certificate record.\\\":\\\"Demande de l'Entrepreneur, inspection de l'Ingénieur, points en suspens et registre des certificats.\\\",\\\"Contractor's Proposal\\\":\\\"Proposition de l'Entrepreneur\\\",\\\"Contractual Correspondence Register\\\":\\\"Registre de la correspondance contractuelle\\\",\\\"Contractual Deadline Tracker\\\":\\\"Suivi des délais contractuels\\\",\\\"Contractual Obligations and Compliance Matrix\\\":\\\"Matrice des obligations contractuelles et de conformité\\\",\\\"Dashboard values and deadlines stay blank until the authorised team completes these.\\\":\\\"Les valeurs et délais du tableau de bord restent vides tant que l'équipe autorisée ne les a pas complétés.\\\",\\\"Deadlines are calculated only from an Approved for Use rule. Uncertain triggers are flagged for review.\\\":\\\"Les délais sont calculés uniquement à partir d'une règle Approuvé pour utilisation. Les déclencheurs incertains sont signalés pour revue.\\\",\\\"Defects Notification Period\\\":\\\"Période de notification des défauts\\\",\\\"Delay and Disruption Records\\\":\\\"Registres des retards et perturbations\\\",\\\"Delay events linked to activities, the approved programme, critical path, mitigation and evidence.\\\":\\\"Événements de retard liés aux activités, au programme approuvé, au chemin critique, à l'atténuation et aux preuves.\\\",\\\"Design Management\\\":\\\"Gestion de la conception\\\",\\\"Disputes, DAAB and Amicable Settlement\\\":\\\"Litiges, DAAB et règlement amiable\\\",\\\"Document numbering\\\":\\\"Numérotation des documents\\\",\\\"Drawings and Documents\\\":\\\"Plans et documents\\\",\\\"Duration and any extension are set by the contract.\\\":\\\"La durée et toute prorogation sont fixées par le contrat.\\\",\\\"Each stage is a separate recorded event. A draft is not an issued notice, and a prepared email is not delivery evidence.\\\":\\\"Chaque étape est un événement enregistré distinct. Un brouillon n'est pas une notification émise, et un e-mail préparé n'est pas une preuve de remise.\\\",\\\"Employer's Requirements\\\":\\\"Exigences du Maître de l'Ouvrage\\\",\\\"Engineer's Communications\\\":\\\"Communications de l'Ingénieur\\\",\\\"Engineer's Communications and Determinations\\\":\\\"Communications et déterminations de l'Ingénieur\\\",\\\"Every notice follows the draft, approved, issued, delivered sequence.\\\":\\\"Chaque notification suit la séquence brouillon, approuvée, émise, remise.\\\",\\\"Every record carries a unique reference, clause link, responsible person, evidence and history.\\\":\\\"Chaque enregistrement porte une référence unique, un lien vers la clause, une personne responsable, des preuves et un historique.\\\",\\\"Executed Contract Agreement\\\":\\\"Contrat d'exécution signé\\\" ion is granted merely because a delay event was registered.\\\":\\\"Aucune prorogation n'est accordée du seul fait qu'un événement de retard a été enregistré.\\\",\\\"No figure or date is pre-filled. Values come only from the executed contract.\\\":\\\"Aucun chiffre ni aucune date n'est prérempli. Les valeurs proviennent uniquement du contrat signé.\\\",\\\"Notice Register\\\":\\\"Registre des Notifications\\\",\\\"Notice and response periods\\\":\\\"Délais de notification et de réponse\\\",\\\"Notices and Deadlines\\\":\\\"Notifications et Échéances\\\",\\\"Notices of Dissatisfaction, DAAB referrals and decisions, amicable settlement periods.\\\":\\\"Notifications de Désaccord, saisines de la DAAB et décisions, périodes de règlement amiable.\\\",\\\"Notices, claims, variations, payments, securities and obligations, each with its clause, evidence and deadline.\\\":\\\"Notifications, réclamations, modifications, paiements, garanties et obligations, chacun avec sa clause, ses preuves et son échéance.\\\",\\\"Obligations of each party mapped to clause, owner, due date and evidence.\\\":\\\"Obligations de chaque partie rattachées à la clause, au responsable, à l'échéance et aux preuves.\\\",\\\"Open Notices and Deadlines\\\":\\\"Notifications et Échéances en cours\\\",\\\"Particular Conditions\\\":\\\"Conditions Particulières\\\",\\\"Payment Applications and Interim Payment Certificates\\\":\\\"Demandes de paiement et Certificats de paiement intermédiaires\\\",\\\"Payments and IPCs\\\":\\\"Paiements et IPC\\\",\\\"Performance Security and Other Securities\\\":\\\"Garantie de bonne exécution et autres garanties\\\",\\\"Periods are taken from the approved rule library.\\\":\\\"Les délais sont tirés de la bibliothèque de règles approuvée.\\\",\\\"Procurement\\\":\\\"Approvisionnement\\\",\\\"Programme and Progress\\\":\\\"Programme et Avancement\\\",\\\"Project Overview\\\":\\\"Aperçu du projet\\\",\\\"Project setup checklist\\\":\\\"Liste de contrôle de configuration du p in-height:44px;padding:0 14px;border-radius:8px;font-size:14px;border:1px solid #0b4fb3;background:{{ruleBg}};color:{{ruleFg}};cursor:pointer\">Use a library rule<\/button>\n<button onClick=\"{{modeSim}}\" aria-pressed=\"{{simOn}}\" style=\"min-height:44px;padding:0 14px;border-radius:8px;font-size:14px;border:1px solid #0b4fb3;background:{{simBg}};color:{{simFg}};cursor:pointer\">Simulation (what-if)<\/button>\n<\/div>\n\n<div style=\"display:flex;flex-wrap:wrap;gap:20px;margin-bottom:28px;align-items:stretch\">\n<div style=\"flex:1 1 300px;max-width:460px;background:#fff;border:1px solid #d5dce4;border-radius:8px;padding:16px\">\n<sc-if value=\"{{isRule}}\" hint-placeholder-val=\"{{ true }}\">\n<label for=\"rule\" style=\"display:block;font-size:13px;font-weight:700;margin-bottom:4px\">Rule<\/label>\n<select id=\"rule\" onChange=\"{{setRule}}\" style=\"width:100%;box-sizing:border-box;min-height:44px;padding:0 10px;border:1px solid #9aa7b5;border-radius:8px;font-size:14px;background:#fff;margin-bottom:12px\">\n<sc-for list=\"{{ruleOptions}}\" as=\"o\" hint-placeholder-count=\"3\"><option value=\"{{o.v}}\">{{o.t}}<\/option><\/sc-for>\n<\/select>\n<\/sc-if>\n<sc-if value=\"{{isSim}}\" hint-placeholder-val=\"{{ false }}\">\n<label for=\"days\" style=\"display:block;font-size:13px;font-weight:700;margin-bottom:4px\">Period (days, for simulation only)<\/label>\n<input id=\"days\" type=\"number\" min=\"0\" value=\"{{days}}\" onInput=\"{{setDays}}\" style=\"width:100%;box-sizing:border-box;min-height:44px;padding:0 10px;border:1px solid #9aa7b5;border-radius:8px;font-size:14px;margin-bottom:12px\">\n<label for=\"conv\" style=\"display:block;font-size:13px;font-weight:700;margin-bottom:4px\">Counting convention<\/label>\n<select id=\"conv\" onChange=\"{{setConv}}\" style=\"width:100%;box-sizing:border-box;min-height:44px;padding:0 10px;border:1px solid #9aa7b5;border-radius:8px;font-size:14px;background:#fff;margin-bottom:12px\">\n<option value=\"excl\">Trigger day excluded<\/option>\n<option value=\"incl\">Trigger day included<\/option>\n<\/select>\n<\/sc-if>\n<label for=\"trig\" style=\"display:block;font-size:13px;font-weight:700;margin-bottom:4px\">Triggering event date<\/label>\n<input id=\"trig\" type=\"date\" value=\"{{trigger}}\" onInput=\"{{setTrigger}}\" style=\"width:100%;box-sizing:border-box;min-height:44px;padding:0 10px;border:1px solid #9aa7b5;border-radius:8px;font-size:14px;margin-bottom:4px\">\n<div style=\"font-size:12px;color:#3f4854\">Event date, awareness date and delivery date are recorded separately in the real notice record.<\/div>\n<\/div>\n\n<div style=\"flex:999 1 320px;min-width:0\">\n<sc-if value=\"{{blocked}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"background:#fff1cc;border:1px solid #e0b84f;border-radius:8px;padding:16px\">\n<div style=\"font-weight:700;font-size:15px;color:#4a3200;margin-bottom:6px\">▲ No deadline calculated<\/div>\n<div style=\"font-size:14px;line-height:1.55;color:#4a3200\">{{blockMsg}}<\/div>\n<div style=\"font-size:13px;color:#4a3200;margin-top:8px\">The record would be flagged for Contract Manager review instead of showing an invented date.<\/div>\n<\/div>\n<\/sc-if>\n<sc-if value=\"{{showResult}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"background:#fff;border:2px dashed #0b4fb3;border-radius:8px;padding:16px\">\n<div style=\"font-size:12px;font-weight:700;color:#0b4fb3;margin-bottom:8px\">SIMULATION · not a contractual deadline<\/div>\n<div class=\"gq c3\" style=\"gap:12px;margin-bottom:12px\">\n<div><div style=\"font-size:12px;color:#3f4854\">Trigger date<\/div><div style=\"font-size:16px;font-weight:700\">{{res.trigger}}<\/div><\/div>\n<div><div style=\"font-size:12px;color:#3f4854\">Period<\/div><div style=\"font-size:16px;font-weight:700\">{{res.period}}<\/div><\/div>\n<div><div style=\"font-size:12px;color:#3f4854\">Calculated date<\/div><div style=\"font-size:16px;font-weight:700\">{{res.deadline}}<\/div><\/div>\n<\/div>\n<div style=\"display:inline-block;font-size:14px;font-weight:700;padding:6px 12px;border-radius:999px;{{res.badge}}\">{{res.countdown}}<\/div>\n<div style=\"font-size:13px;margin-top:12px;color:#3f4854\">Calculation: {{res.calc}}<\/div>\n<div style=\"font-size:13px;font-weight:700;margin:14px 0 6px\">Reminder schedule<\/div>\n<div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n<sc-for list=\"{{reminders}}\" as=\"r\" hint-placeholder-count=\"5\">\n<span style=\"font-size:12px;padding:4px 8px;border:1px solid #c3cad2;border-radius:6px;background:#f7f9fb\">{{r.label}} · {{r.date}}<\/span>\n<\/sc-for>\n<\/div>\n<\/div>\n<\/sc-if>\n<\/div>\n<\/div>\n\n<h2 style=\"font-size:18px;margin:0 0 4px\">Deadline rule library<\/h2>\n<p style=\"margin:0 0 12px;font-size:13px;color:#3f4854\">Clause and period shown for 17 matters are proposals read from the FIDIC Plant and Design-Build 2017 General Conditions (2nd edition). They are not approved: the Particular Conditions and Contract Data can change any period. Six matters have no fixed period in the General Conditions and stay Not Configured. A Contract Manager or Project Manager must enter the period from the executed contract, verify it and approve it before it can generate live deadlines.<\/p>\n\n<div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;font-size:12px;font-weight:700\">\n<sc-for list=\"{{states}}\" as=\"s\" hint-placeholder-count=\"6\"><span style=\"padding:4px 10px;border-radius:999px;{{s.style}}\">{{s.label}}<\/span><\/sc-for>\n<\/div>\n\n<div style=\"background:#fff;border:1px solid #d5dce4;border-radius:8px;overflow-x:auto;margin-bottom:24px\">\n<table style=\"width:100%;border-collapse:collapse;font-size:14px;min-width:620px\">\n<thead><tr style=\"background:#eef2f6;text-align:left\">\n<th style=\"padding:10px 12px\">Rule ID<\/th><th style=\"padding:10px 12px\">Matter<\/th><th style=\"padding:10px 12px\">Clause<\/th><th style=\"padding:10px 12px\">Period<\/th><th style=\"padding:10px 12px\">Status<\/th>\n<\/tr><\/thead>\n<tbody>\n<sc-for list=\"{{rules}}\" as=\"r\" hint-placeholder-count=\"6\">\n<tr style=\"border-top:1px solid #e6ebf0\">\n<td style=\"padding:10px 12px;white-space:nowrap\">{{r.id}}<\/td>\n<td style=\"padding:10px 12px\">{{r.name}}<\/td>\n<td style=\"padding:10px 12px;color:#3f4854\">{{r.clause}}<\/td>\n<td style=\"padding:10px 12px;color:#3f4854\">{{r.period}}<\/td>\n<td style=\"padding:10px 12px;white-space:nowrap\"><sc-if value=\"{{r.prop}}\" hint-placeholder-val=\"\"><span style=\"font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:#fff1cc;color:#6b4600;border:1px solid #e0b84f\">▲ Extracted but Unverified<\/span><\/sc-if><sc-if value=\"{{r.nop}}\" hint-placeholder-val=\"{{ true }}\"><span style=\"font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:#eceff2;color:#3f4854;border:1px solid #c3cad2\">○ Not Configured<\/span><\/sc-if><\/td>\n<\/tr>\n<\/sc-for>\n<\/tbody>\n<\/table>\n<\/div>\n\n<h2 style=\"font-size:16px;margin:0 0 8px\">Deadline types kept separate<\/h2>\n<div class=\"gq c4\" style=\"gap:10px;margin-bottom:24px\">\n<div style=\"background:#fff;border:1px solid #d5dce4;border-radius:8px;padding:12px 14px;font-size:14px\"><strong>Contractual<\/strong><br>From the executed contract.<\/div>\n<div style=\"background:#fff;border:1px solid #d5dce4;border-radius:8px;padding:12px 14px;font-size:14px\"><strong>Statutory<\/strong><br>From applicable law.<\/div>\n<div style=\"background:#fff;border:1px solid #d5dce4;border-radius:8px;padding:12px 14px;font-size:14px\"><strong>Internal target<\/strong><br>Team aim, never a contract date.<\/div>\n<div style=\"background:#fff;border:1px solid #d5dce4;border-radius:8px;padding:12px 14px;font-size:14px\"><strong>Administrative target<\/strong><br>Project housekeeping.<\/div>\n<\/div>\n<\/main>\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script data-props='{\"$preview\":{\"width\":1360,\"height\":1700}}'>\nclass Component extends DCLogic {\n  fmt(d) {\n    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });\n  }\n  renderVals() {\n    const names = ['Project Overview','Contract Administration','Notices and Deadlines','Claims and EOT',\"Engineer's Communications\",'Variations and Change Control','Payments and IPCs','Programme and Progress','Design Management','Drawings and Documents','RFIs and Technical Queries','Quality Management','Inspections and NCRs','Field Management','Site Photos and Evidence','Procurement','Risk Register','HSE','Meetings and Actions','Testing and Commissioning','Taking-Over and Handover','Defects Notification Period','Reports','Notifications','Users and Permissions','System Settings'];\n    const hrefs = { 0: 'Main.dc.html', 1: 'Contract.dc.html', 2: 'Notices.dc.html' };\n    const nav = names.map((label, i) => ({ label: (i + 1) + '. ' + label, href: hrefs[i] || '', off: hrefs[i] ? '' : 'yes', bg: i === 2 ? '#2a5a8c' : 'transparent', weight: i === 2 ? '700' : '500' }));\n\n    const matters = [\"Contractor's Notice of Claim\",\"Employer's Notice of Claim\",\"Engineer's acknowledgment of a Notice of Claim\",'Detailed Particulars of Claim','Responses to claims','Interim and final particulars for continuing claims',\"Engineer's determination\",'Notice of Dissatisfaction','DAAB referral','DAAB decision','Amicable settlement period',\"Contractor's programme submission and updates\",\"Engineer's response to programme submissions\",'Design submission and review periods','Requests for information','Variation quotations','Payment applications','Interim Payment Certificates','Payment deadlines','Tests on Completion','Taking-Over procedures','Defects Notification Period obligations','Final Statement and Final Payment Certificate'];\n    const P = {1:['20.2.1','28 days'],2:['20.2.1','28 days'],3:['20.2.2','14 days'],4:['20.2.4','84 days'],6:['20.2.6','28 days (final); monthly interim'],7:['3.7.3','42 days'],8:['3.7.5','28 days'],9:['21.4.1','42 days'],10:['21.4.3','84 days'],11:['21.5','28 days'],12:['8.3','28 days'],13:['8.3','21 days (initial); 14 (revised)'],16:['13.3.2','7 days'],18:['14.6','28 days'],19:['14.7','56 days'],21:['10.1','28 days'],23:['14.11.1','56 days']};\n    const rules = matters.map((m, i) => { const q = P[i + 1]; return { id: 'R-' + String(i + 1).padStart(3, '0'), name: m, clause: q ? q[0] : 'Not entered', period: q ? q[1] : 'Not entered', prop: q ? 'yes' : '', nop: q ? '' : 'yes' }; });\n\n    const mode = this.state.mode || 'rule';\n    const today = new Date();\n    const todayStr = today.toISOString().slice(0, 10);\n    const trigger = this.state.trigger || todayStr;\n    const days = this.state.days === undefined ? '' : this.state.days;\n    const conv = this.state.conv || 'excl';\n    const ruleIdx = this.state.ruleIdx || 0;\n\n    let blocked = '', blockMsg = '', showResult = '', res = {}, reminders = [];\n    if (mode === 'rule') {\n      blocked = 'yes';\n      blockMsg = rules[ruleIdx].prop ? rules[ruleIdx].id + ' (' + rules[ruleIdx].name + ') has a proposed period of ' + rules[ruleIdx].period + ' (clause ' + rules[ruleIdx].clause + ', FIDIC 2017 General Conditions) but it is not Verified or Approved for Use, so no deadline can be calculated.' : rules[ruleIdx].id + ' (' + rules[ruleIdx].name + ') is Not Configured. It has no clause, period or counting convention, so no deadline can be calculated.';\n    } else {\n      const n = parseInt(days, 10);\n      if (isNaN(n) || n < 0 || !trigger) {\n        blocked = 'yes';\n        blockMsg = 'Enter a trigger date and a period in days to run the simulation.';\n      } else {\n        showResult = 'yes';\n        const t = new Date(trigger + 'T00:00:00Z');\n        const off = conv === 'incl' ? n - 1 : n;\n        const dl = new Date(t.getTime() + off * 86400000);\n        const t0 = new Date(todayStr + 'T00:00:00Z');\n        const diff = Math.round((dl.getTime() - t0.getTime()) / 86400000);\n        let countdown, badge;\n        if (diff > 14) { countdown = '● ' + diff + ' days remaining'; badge = 'background:#e2ecfb;color:#123f86;border:1px solid #9db9e6'; }\n        else if (diff > 0) { countdown = '▲ ' + diff + (diff === 1 ? ' day remaining' : ' days remaining'); badge = 'background:#fff1cc;color:#6b4600;border:1px solid #e0b84f'; }\n        else if (diff === 0) { countdown = '▲ Due today'; badge = 'background:#fff1cc;color:#6b4600;border:1px solid #e0b84f'; }\n        else { countdown = '■ ' + Math.abs(diff) + (Math.abs(diff) === 1 ? ' day overdue' : ' days overdue'); badge = 'background:#ffedd5;color:#9a3412;border:1px solid #fdba74'; }\n        res = {\n          trigger: this.fmt(t), period: n + ' calendar days', deadline: this.fmt(dl), countdown, badge,\n          calc: this.fmt(t) + ' + ' + off + ' days (' + (conv === 'incl' ? 'trigger day counted as day 1' : 'trigger day excluded') + ') = ' + this.fmt(dl) + '. Weekends and holidays are not adjusted here.'\n        };\n        reminders = [14, 7, 3, 1, 0].map(k => ({ label: k === 0 ? 'On the day' : k + (k === 1 ? ' day before' : ' days before'), date: this.fmt(new Date(dl.getTime() - k * 86400000)) }));\n        reminders.push({ label: 'Daily after', date: 'until closed' });\n      }\n    }\n\n    const st = {\n      grey: 'background:#eceff2;color:#3f4854;border:1px solid #c3cad2',\n      amber: 'background:#fff1cc;color:#6b4600;border:1px solid #e0b84f',\n      blue: 'background:#e2ecfb;color:#123f86;border:1px solid #9db9e6',\n      green: 'background:#e3f3ea;color:#145c36;border:1px solid #9bcdb0'\n    };\n    const states = [['○ Not Configured','grey'],['▲ Extracted but Unverified','amber'],['● Under Review','blue'],['● Verified','blue'],['✓ Approved for Use','green'],['○ Superseded','grey']].map(x => ({ label: x[0], style: st[x[1]] }));\n\n    return {\n      nav, rules, states, reminders, res, blocked, blockMsg, showResult,\n      ruleOptions: rules.map((r, i) => ({ v: String(i), t: r.id + ' · ' + r.name + (r.prop ? ' (Unverified proposal)' : ' (Not Configured)') })),\n      isRule: mode === 'rule' ? 'yes' : '', isSim: mode === 'sim' ? 'yes' : '',\n      ruleOn: mode === 'rule' ? 'true' : 'false', simOn: mode === 'sim' ? 'true' : 'false',\n      ruleBg: mode === 'rule' ? '#0b4fb3' : '#ffffff', ruleFg: mode === 'rule' ? '#ffffff' : '#0b4fb3',\n      simBg: mode === 'sim' ? '#0b4fb3' : '#ffffff', simFg: mode === 'sim' ? '#ffffff' : '#0b4fb3',\n      trigger, days,\n      modeRule: () => this.setState({ mode: 'rule' }),\n      modeSim: () => this.setState({ mode: 'sim' }),\n      setRule: (e) => this.setState({ ruleIdx: parseInt(e.target.value, 10) || 0 }),\n      setTrigger: (e) => this.setState({ trigger: e.target.value }),\n      setDays: (e) => this.setState({ days: e.target.value }),\n      setConv: (e) => this.setState({ conv: e.target.value })\n    };\n  }\n}\n<\/script>\n<\/body>\n<\/html>\n", "Notifications": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>Notifications<\/title>\n<script src=\"./support.js\"><\/script>\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap\" rel=\"stylesheet\">\n<style>\nbody{margin:0;font-family:\"Plus Jakarta Sans\",system-ui,sans-serif;color:#0e1a2b;background:#f3f5f9}\nbutton,input{font-family:inherit}\n<\/style>\n<\/helmet>\n<div style=\"display:flex;flex-wrap:wrap;min-height:100vh\">\n<div style=\"flex:0 0 260px\"><dc-import name=\"Nav\" active=\"notif\" hint-size=\"260px,1000px\"><\/dc-import><\/div>\n<main style=\"flex:999 1 560px;min-width:0;padding:24px 28px 40px;box-sizing:border-box\">\n<div style=\"font-size:11px;letter-spacing:.14em;font-weight:700;color:#0067cc\">ADMINISTRATION<\/div>\n<h1 style=\"margin:4px 0 6px;font-size:28px;font-weight:800\">Notifications and Escalation<\/h1>\n<p style=\"margin:0 0 22px;font-size:14px;color:#4a5a6e;max-width:760px;line-height:1.55\">In-app and email alerts. Notifications remind people to act. They never issue a contractual notice or make a contractual decision.<\/p>\n\n<h2 style=\"font-size:18px;font-weight:800;margin:0 0 4px\">Reminder schedule<\/h2>\n<p style=\"margin:0 0 12px;font-size:13.5px;color:#4a5a6e\">Toggle the intervals the administrator wants. Suggested defaults are on.<\/p>\n<div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px\">\n<sc-for list=\"{{intervals}}\" as=\"i\" hint-placeholder-count=\"6\">\n<button onClick=\"{{i.flip}}\" aria-pressed=\"{{i.pressed}}\" style=\"min-height:44px;padding:0 16px;border-radius:999px;border:1px solid {{i.border}};background:{{i.bg}};color:{{i.fg}};font-size:13.5px;font-weight:700;cursor:pointer\">{{i.mark}} {{i.label}}<\/button>\n<\/sc-for>\n<\/div>\n\n<h2 style=\"font-size:18px;font-weight:800;margin:0 0 4px\">Escalation matrix<\/h2>\n<p style=\"margin:0 0 12px;font-size:13.5px;color:#4a5a6e\">If a critical deadline is close and no action is recorded, notify the assigned person, then the designated manager. Set the timing and the manager below.<\/p>\n<div style=\"background:#fff;border-radius:16px;border:1px solid #e1e7ee;padding:8px 18px;margin-bottom:28px\">\n<sc-for list=\"{{levels}}\" as=\"l\" hint-placeholder-count=\"3\">\n<div style=\"display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #edf1f5\">\n<span style=\"flex:0 0 28px;height:28px;border-radius:50%;background:#0a5cc2;color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center\">{{l.n}}<\/span>\n<span style=\"flex:1 1 200px;font-size:14px;font-weight:600\">{{l.who}}<\/span>\n<span style=\"flex:1 1 200px;font-size:13px;color:#4a5a6e\">{{l.when}}<\/span>\n<\/div>\n<\/sc-for>\n<\/div>\n\n<h2 style=\"font-size:18px;font-weight:800;margin:0 0 4px\">Alert types<\/h2>\n<div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px\">\n<sc-for list=\"{{types}}\" as=\"t\" hint-placeholder-count=\"18\"><span style=\"padding:6px 12px;border-radius:999px;background:#fff;border:1px solid #cfd8e2;font-size:12.5px\">{{t.label}}<\/span><\/sc-for>\n<\/div>\n\n<h2 style=\"font-size:18px;font-weight:800;margin:0 0 10px\">Notification centre<\/h2>\n<div style=\"background:#fff;border:1px dashed #9aa9ba;border-radius:16px;padding:28px;text-align:center;font-size:14px;color:#4a5a6e;line-height:1.6\">No notifications. Each one will show its record reference, description, responsible person, due date, time remaining, required action and a link.<\/div>\n<\/main>\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script data-props='{\"$preview\":{\"width\":1360,\"height\":1300}}'>\nclass Component extends DCLogic {\n  renderVals() {\n    const base = [['14 days before', true], ['7 days before', true], ['3 days before', true], ['1 day before', true], ['On the deadline date', true], ['Daily after, until closed', true]];\n    const on = this.state.on || base.map(b => b[1]);\n    const intervals = base.map((b, i) => ({\n      label: b[0], flip: () => { const n = on.slice(); n[i] = !n[i]; this.setState({ on: n }); },\n      pressed: on[i] ? 'true' : 'false', mark: on[i] ? '✓' : '○',\n      bg: on[i] ? '#0a5cc2' : '#ffffff', fg: on[i] ? '#ffffff' : '#0e1a2b', border: on[i] ? '#0a5cc2' : '#cfd8e2'\n    }));\n    const levels = [\n      { n: '1', who: 'Assigned person', when: 'At each reminder interval' },\n      { n: '2', who: 'Designated manager (to be set)', when: 'When no action is recorded as the deadline nears (timing to be set)' },\n      { n: '3', who: 'Project Manager', when: 'When a critical deadline passes unresolved (timing to be set)' }\n    ];\n    const types = ['Approaching contractual deadlines','Overdue notices','Claims requiring action','Pending Engineer responses','Outstanding determinations','Programme submission deadlines','Design submission deadlines','RFI response deadlines','Payment certification deadlines','Payment due dates','Expiring securities','Pending inspections','Overdue NCRs','Incomplete corrective actions','Critical procurement delays','Outstanding meeting actions','Testing and commissioning deadlines','Handover requirements'].map(label => ({ label }));\n    return { intervals, levels, types };\n  }\n}\n<\/script>\n<\/body>\n<\/html>\n", "Payments": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>Payments and IPCs<\/title>\n<script src=\"./support.js\"><\/script>\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap\" rel=\"stylesheet\">\n<style>\nbody{margin:0;font-family:\"Plus Jakarta Sans\",system-ui,sans-serif;color:#0e1a2b;background:#f3f5f9}\na{color:#0f4c99}\nbutton{font-family:inherit}\n\n.gq{display:grid;align-items:stretch}\n.gq>*{box-sizing:border-box;min-width:0;height:100%}\n.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.c4{grid-template-columns:repeat(4,minmax(0,1fr))}\n.c5{grid-template-columns:repeat(5,minmax(0,1fr))}.c6{grid-template-columns:repeat(6,minmax(0,1fr))}\n@media (max-width:1000px){.c5,.c6{grid-template-columns:repeat(3,minmax(0,1fr))}.c4{grid-template-columns:repeat(2,minmax(0,1fr))}}\n@media (max-width:640px){.c3,.c4,.c5,.c6{grid-template-columns:minmax(0,1fr)}}\n<\/style>\n<\/helmet>\n<div style=\"display:flex;flex-wrap:wrap;min-height:100vh\">\n<div style=\"flex:0 0 260px\"><dc-import name=\"Nav\" active=\"payments\" hint-size=\"260px,1000px\"><\/dc-import><\/div>\n<main style=\"flex:999 1 560px;min-width:0;padding:24px 28px 40px;box-sizing:border-box\">\n\n<div style=\"font-size:11px;letter-spacing:.14em;font-weight:700;color:#0067cc\">COMMERCIAL<\/div>\n<h1 style=\"margin:4px 0 6px;font-size:28px;font-weight:800\">Payments and IPCs<\/h1>\n<p style=\"margin:0 0 22px;font-size:14px;color:#4a5a6e;max-width:760px;line-height:1.55\">From measurement and valuation through certification to payment. Certification, payment due date and actual payment are separate events with separate dates.<\/p>\n\n<h2 style=\"font-size:18px;font-weight:800;margin:0 0 10px\">Contract sums<\/h2>\n<div class=\"gq c3\" style=\"gap:12px;margin-bottom:26px\">\n<sc-for list=\"{{sums}}\" as=\"s\" hint-placeholder-count=\"8\">\n<div style=\"background:#fff;border-radius:14px;padding:14px 16px;border:1px solid #e1e7ee;border-top:4px solid #0a5cc2\">\n<div style=\"font-size:12px;font-weight:600;color:#4a5a6e;min-height:30px;line-height:1.35\">{{s.label}}<\/div>\n<div style=\"font-size:18px;font-weight:800;margin-top:4px;color:#4a5a6e\">Not configured<\/div>\n<\/div>\n<\/sc-for>\n<\/div>\n\n<h2 style=\"font-size:18px;font-weight:800;margin:0 0 4px\">Payment timeline<\/h2>\n<p style=\"margin:0 0 12px;font-size:13.5px;color:#4a5a6e\">Select a stage. Each one records its own date, and the gaps between them come from the approved rules.<\/p>\n<div style=\"display:flex;flex-wrap:wrap;gap:0;margin-bottom:14px\">\n<sc-for list=\"{{stages}}\" as=\"g\" hint-placeholder-count=\"5\">\n<button onClick=\"{{g.pick}}\" aria-pressed=\"{{g.pressed}}\" style=\"flex:1 1 150px;min-height:64px;padding:10px 14px;border:1px solid {{g.border}};background:{{g.bg}};color:{{g.fg}};font-size:13.5px;font-weight:700;cursor:pointer;text-align:left\">\n<span style=\"display:block;font-size:11px;font-weight:600;opacity:.85\">Stage {{g.n}}<\/span>{{g.title}}\n<\/button>\n<\/sc-for>\n<\/div>\n<div style=\"background:#fff;border-radius:16px;padding:20px 22px;border:1px solid #e1e7ee;margin-bottom:28px\">\n<h3 style=\"margin:0 0 8px;font-size:17px;font-weight:800\">{{cur.title}}<\/h3>\n<p style=\"margin:0 0 12px;font-size:14px;line-height:1.6\">{{cur.what}}<\/p>\n<div style=\"font-size:13px;color:#4a5a6e\"><strong>Recorded:<\/strong> {{cur.fields}}<\/div>\n<\/div>\n\n<div style=\"display:flex;flex-wrap:wrap;gap:22px;align-items:stretch;margin-bottom:28px\">\n<section style=\"flex:1 1 360px;min-width:0\">\n<h2 style=\"font-size:18px;font-weight:800;margin:0 0 10px\">Amounts, kept separate<\/h2>\n<div style=\"background:#fff;border-radius:16px;border:1px solid #e1e7ee;overflow:hidden\">\n<sc-for list=\"{{amts}}\" as=\"a\" hint-placeholder-count=\"5\">\n<div style=\"display:flex;justify-content:space-between;gap:12px;padding:13px 18px;border-bottom:1px solid #edf1f5;font-size:14px\"><span style=\"font-weight:600\">{{a.label}}<\/span><span style=\"color:#4a5a6e;font-weight:700\">—<\/span><\/div>\n<\/sc-for>\n<\/div>\n<\/section>\n<section style=\"flex:1 1 360px;min-width:0\">\n<h2 style=\"font-size:18px;font-weight:800;margin:0 0 10px\">Cumulative certified value<\/h2>\n<div style=\"background:#fff;border-radius:16px;border:1px solid #e1e7ee;padding:16px\">\n<svg viewBox=\"0 0 360 180\" width=\"100%\" role=\"img\" aria-label=\"Empty chart: no certified payments yet\" style=\"display:block\">\n<g stroke=\"#e1e7ee\" stroke-width=\"1\"><path d=\"M40 20H350M40 60H350M40 100H350M40 140H350\"><\/path><\/g>\n<path d=\"M40 20V140H350\" stroke=\"#9aa9ba\" stroke-width=\"1.5\" fill=\"none\"><\/path>\n<path d=\"M40 140 350 140\" stroke=\"#007FFF\" stroke-width=\"2\" stroke-dasharray=\"5 5\"><\/path>\n<text x=\"195\" y=\"88\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"600\" fill=\"#4a5a6e\">No certified payments yet<\/text>\n<text x=\"40\" y=\"162\" font-size=\"11\" fill=\"#4a5a6e\">First IPC<\/text><text x=\"350\" y=\"162\" text-anchor=\"end\" font-size=\"11\" fill=\"#4a5a6e\">Latest IPC<\/text>\n<\/svg>\n<div style=\"font-size:12px;color:#4a5a6e;margin-top:6px\">Charts fill from actual payment records. Other charts: applied, paid, outstanding, delays, forecast cash flow, approved versus pending variations.<\/div>\n<\/div>\n<\/section>\n<\/div>\n\n<h2 style=\"font-size:18px;font-weight:800;margin:0 0 4px\">Recorded for every payment cycle<\/h2>\n<div class=\"gq c4\" style=\"gap:8px;margin-bottom:26px\">\n<sc-for list=\"{{fields}}\" as=\"f\" hint-placeholder-count=\"10\">\n<div style=\"background:#fff;border:1px solid #e1e7ee;border-radius:10px;padding:9px 12px;font-size:13px;display:flex;gap:8px\"><span style=\"color:#0067cc;font-weight:800\">{{f.n}}<\/span><span>{{f.label}}<\/span><\/div>\n<\/sc-for>\n<\/div>\n<div style=\"background:#fff;border:1px dashed #9aa9ba;border-radius:16px;padding:26px;text-align:center;font-size:14px;color:#4a5a6e\">No payment applications registered. Payment deadlines will be calculated only from Approved for Use rules.<\/div>\n<\/main>\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script data-props='{\"$preview\":{\"width\":1360,\"height\":1500}}'>\nclass Component extends DCLogic {\n  renderVals() {\n    const sums = ['Original Contract Price','Current adjusted Contract Price','Approved Variations','Pending Variations','Claims affecting the Price','Advance Payment','Advance Payment recovery','Retention','Performance Security'].map(label => ({ label }));\n    const G = [\n      ['Payment Application Submitted','The Contractor submits an application with valuation and supporting records.','Reference, date and time, claimed amount, measurement and valuation records, variations included, Materials and Plant where applicable.'],\n      ['Assessment','The Engineer assesses the application against measured work and contract terms.','Engineer’s assessment, deductions, Advance Payment recovery, retention, disputed or excluded amounts.'],\n      ['IPC Issued','The Interim Payment Certificate is issued for the certified amount.','Certified amount and certification date, tracked against its own certification rule.'],\n      ['Payment Due','The due date is calculated from the approved payment rule.','Contractual payment deadline. This is not assumed equal to the certification period.'],\n      ['Payment Received','The Employer’s actual payment is recorded.','Payment date, amount paid and outstanding balance, plus any related notices.']\n    ];\n    const sel = this.state.sel || 0;\n    const stages = G.map((g, i) => ({\n      n: String(i + 1), title: g[0],\n      pick: () => this.setState({ sel: i }),\n      pressed: i === sel ? 'true' : 'false',\n      bg: i === sel ? '#0a5cc2' : '#ffffff',\n      fg: i === sel ? '#ffffff' : '#0e1a2b',\n      border: i === sel ? '#0a5cc2' : '#cfd8e2'\n    }));\n    const cur = { title: G[sel][0], what: G[sel][1], fields: G[sel][2] };\n    const amts = ['Applied for','Certified','Paid','Outstanding balance','Disputed or excluded'].map(label => ({ label }));\n    const names = ['Payment application reference','Submission date and time','Claimed amount','Measurement and valuation records','Supporting documents','Variations included','Materials and Plant','Advance Payment recovery','Retention','Other contractual deductions','Engineer’s assessment','Certified amount','Certification date','Contractual payment deadline','Employer’s payment date','Amount paid','Outstanding balance','Disputed or excluded amounts','Relevant correspondence','Status'];\n    const fields = names.map((label, i) => ({ n: String(i + 1), label }));\n    return { sums, stages, cur, amts, fields };\n  }\n}\n<\/script>\n<\/body>\n<\/html>\n", "Photos": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>Site Photos and Evidence<\/title>\n<script src=\"./support.js\"><\/script>\n<\/head>\n<body>\n<x-dc>\n<helmet><style>body{margin:0}<\/style><\/helmet>\n<dc-import name=\"DocFolder\" nav-key=\"photos\" kicker=\"SITE AND QUALITY\" title=\"Site Photos and Evidence\" blurb=\"Photographs and video kept as evidence. The upload time is recorded by the system. It is not proof of when a photo was taken, so the file's own date is shown separately and marked unverified.\" folder-no=\"16\" types=\"Site photograph,Video evidence,Before and after set,Claim evidence,NCR evidence,Delay evidence,Other\" prefix=\"PHO\" store-key=\"photos\" hint-size=\"100%,1100px\"><\/dc-import>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script data-props='{\"$preview\":{\"width\":1360,\"height\":1100}}'>\nclass Component extends DCLogic { renderVals() { return {}; } }\n<\/script>\n<\/body>\n<\/html>\n", "Procurement": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>Procurement<\/title>\n<script src=\"./support.js\"><\/script>\n<\/head>\n<body>\n<x-dc>\n<helmet><style>body{margin:0}<\/style><\/helmet>\n<dc-import name=\"DocFolder\" nav-key=\"proc\" kicker=\"DELIVERY\" title=\"Procurement\" blurb=\"Subcontracts, purchase orders, delivery records and long-lead equipment documents.\" folder-no=\"09\" types=\"Subcontract,Purchase order,Delivery record,Material approval request,Long-lead item tracker,Supplier certificate,Other\" prefix=\"PRO\" store-key=\"proc\" hint-size=\"100%,1100px\"><\/dc-import>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script data-props='{\"$preview\":{\"width\":1360,\"height\":1100}}'>\nclass Component extends DCLogic { renderVals() { return {}; } }\n<\/script>\n<\/body>\n<\/html>\n", "Programme": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>Programme and Progress<\/title>\n<script src=\"./support.js\"><\/script>\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap\" rel=\"stylesheet\">\n<style>\nbody{margin:0;font-family:\"Plus Jakarta Sans\",system-ui,sans-serif;color:#0e1a2b;background:#f3f5f9}\na{color:#0f4c99}\nbutton{font-family:inherit}\n\n.gq{display:grid;align-items:stretch}\n.gq>*{box-sizing:border-box;min-width:0;height:100%}\n.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.c4{grid-template-columns:repeat(4,minmax(0,1fr))}\n.c5{grid-template-columns:repeat(5,minmax(0,1fr))}.c6{grid-template-columns:repeat(6,minmax(0,1fr))}\n@media (max-width:1000px){.c5,.c6{grid-template-columns:repeat(3,minmax(0,1fr))}.c4{grid-template-columns:repeat(2,minmax(0,1fr))}}\n@media (max-width:640px){.c3,.c4,.c5,.c6{grid-template-columns:minmax(0,1fr)}}\n<\/style>\n<\/helmet>\n<div style=\"display:flex;flex-wrap:wrap;min-height:100vh\">\n<div style=\"flex:0 0 260px\"><dc-import name=\"Nav\" active=\"programme\" hint-size=\"260px,1000px\"><\/dc-import><\/div>\n<main style=\"flex:999 1 560px;min-width:0;padding:24px 28px 40px;box-sizing:border-box\">\n\n<div style=\"font-size:11px;letter-spacing:.14em;font-weight:700;color:#0067cc\">TIME MANAGEMENT<\/div>\n<h1 style=\"margin:4px 0 6px;font-size:28px;font-weight:800\">Programme and Progress<\/h1>\n<p style=\"margin:0 0 22px;font-size:14px;color:#4a5a6e;max-width:760px;line-height:1.55\">Baseline and approved programmes, submissions, critical path and delay records in one place. Registering a delay event never grants an extension of time.<\/p>\n\n<div class=\"gq c3\" style=\"gap:14px;margin-bottom:24px\">\n<div style=\"background:#fff;border-radius:16px;padding:16px 18px;border:1px solid #e1e7ee\"><div style=\"font-size:12px;font-weight:600;color:#4a5a6e\">Contractual Time for Completion<\/div><div style=\"font-size:19px;font-weight:800;margin-top:6px;color:#4a5a6e\">Not set<\/div><\/div>\n<div style=\"background:#fff;border-radius:16px;padding:16px 18px;border:1px solid #e1e7ee\"><div style=\"font-size:12px;font-weight:600;color:#4a5a6e\">Current forecast completion<\/div><div style=\"font-size:19px;font-weight:800;margin-top:6px;color:#4a5a6e\">Not set<\/div><\/div>\n<div style=\"background:#fff;border-radius:16px;padding:16px 18px;border:1px solid #e1e7ee\"><div style=\"font-size:12px;font-weight:600;color:#4a5a6e\">Difference<\/div><div style=\"font-size:19px;font-weight:800;margin-top:6px;color:#4a5a6e\">Needs both dates<\/div><\/div>\n<\/div>\n\n<div style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px\">\n<h2 style=\"margin:0;font-size:18px;font-weight:800\">Gantt view<\/h2>\n<div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n<button style=\"min-height:44px;padding:0 14px;border:1px solid #b8c3cf;background:#fff;border-radius:10px;font-size:13.5px;font-weight:600;cursor:pointer\">Import P6 XML or spreadsheet<\/button>\n<button style=\"min-height:44px;padding:0 14px;border:1px solid #b8c3cf;background:#fff;border-radius:10px;font-size:13.5px;font-weight:600;cursor:pointer\">Export<\/button>\n<button onClick=\"{{toggleDemo}}\" style=\"min-height:44px;padding:0 14px;border:1px solid #6b4600;background:#fff7dd;color:#4a3200;border-radius:10px;font-size:13.5px;font-weight:600;cursor:pointer\">{{demoBtn}}<\/button>\n<\/div>\n<\/div>\n\n<div style=\"background:#fff;border-radius:16px;border:1px solid #e1e7ee;padding:16px 18px;margin-bottom:12px;overflow-x:auto\">\n<div style=\"min-width:640px\">\n<sc-if value=\"{{empty}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"padding:40px 0;text-align:center;color:#4a5a6e;font-size:14px;line-height:1.6\">No programme loaded. Import the accepted baseline or enter activities after the Commencement Date is set.<\/div>\n<\/sc-if>\n<sc-if value=\"{{hasDemo}}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display:flex;gap:10px;align-items:center;margin-bottom:10px\"><span style=\"font-size:10.5px;font-weight:800;color:#0b4fb3;border:1px solid #0b4fb3;border-radius:5px;padding:1px 6px;letter-spacing:.05em\">DEMO DATA<\/span><span style=\"font-size:12.5px;color:#4a5a6e\">Sample activities on a relative week scale. Not a project programme.<\/span><\/div>\n<div style=\"display:flex;margin-left:190px;margin-bottom:4px;font-size:11px;color:#4a5a6e\"><span style=\"flex:1 1 0\">Wk 1<\/span><span style=\"flex:1 1 0\">Wk 14<\/span><span style=\"flex:1 1 0\">Wk 27<\/span><span style=\"flex:1 1 0;text-align:right\">Wk 52<\/span><\/div>\n<sc-for list=\"{{bars}}\" as=\"b\" hint-placeholder-count=\"6\">\n<div style=\"display:flex;align-items:center;gap:0;min-height:44px;border-top:1px solid #edf1f5\">\n<div style=\"flex:0 0 190px;font-size:13px;font-weight:600;padding-right:10px\">{{b.name}}<div style=\"font-size:11px;font-weight:700;color:{{b.tagColor}}\">{{b.tag}}<\/div><\/div>\n<div style=\"flex:1 1 auto;position:relative;height:22px;background:repeating-linear-gradient(90deg,#f1f4f8 0,#f1f4f8 1px,transparent 1px,transparent 25%)\">\n<div style=\"position:absolute;top:2px;bottom:2px;border-radius:6px;left:{{b.left}};width:{{b.width}};background:{{b.fill}};border:{{b.border}}\"><\/div>\n<\/div>\n<\/div>\n<\/sc-for>\n<\/sc-if>\n<\/div>\n<\/div>\n<div style=\"display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:#4a5a6e;margin-bottom:28px\">\n<span><span style=\"display:inline-block;width:18px;height:10px;background:#0a5cc2;border-radius:3px;margin-right:6px\"><\/span>Activity<\/span>\n<span><span style=\"display:inline-block;width:18px;height:10px;background:#0a5cc2;border:2px solid #c2410c;border-radius:3px;margin-right:6px\"><\/span>Critical path (red outline and label)<\/span>\n<span>▲ At risk<\/span>\n<\/div>\n\n<h2 style=\"font-size:18px;font-weight:800;margin:0 0 10px\">Programme records<\/h2>\n<div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px\">\n<sc-for list=\"{{tabs}}\" as=\"t\" hint-placeholder-count=\"4\">\n<button onClick=\"{{t.pick}}\" aria-pressed=\"{{t.pressed}}\" style=\"min-height:44px;padding:0 16px;border-radius:999px;border:1px solid {{t.border}};background:{{t.bg}};color:{{t.fg}};font-size:13.5px;font-weight:700;cursor:pointer\">{{t.title}}<\/button>\n<\/sc-for>\n<\/div>\n<div style=\"background:#fff;border-radius:16px;border:1px solid #e1e7ee;padding:20px 22px;margin-bottom:28px\">\n<p style=\"margin:0 0 10px;font-size:14px;line-height:1.6\">{{cur.what}}<\/p>\n<div style=\"font-size:13px;color:#4a5a6e\"><strong>Rule:<\/strong> {{cur.rule}}<\/div>\n<\/div>\n\n<h2 style=\"font-size:18px;font-weight:800;margin:0 0 4px\">Delay events link to<\/h2>\n<div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px\">\n<sc-for list=\"{{links}}\" as=\"l\" hint-placeholder-count=\"9\"><span style=\"padding:7px 13px;border-radius:999px;background:#fff;border:1px solid #cfd8e2;font-size:13px\">{{l.label}}<\/span><\/sc-for>\n<\/div>\n<div style=\"font-size:12.5px;color:#4a5a6e\">Claimed, assessed and determined extensions are held as three separate values.<\/div>\n<\/main>\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script data-props='{\"$preview\":{\"width\":1360,\"height\":1500}}'>\nclass Component extends DCLogic {\n  renderVals() {\n    const demo = this.state.demo !== false;\n    const raw = [\n      ['Design development', 1, 14, false, false],\n      ['Long-lead procurement', 8, 26, false, true],\n      ['Substructure', 12, 24, true, false],\n      ['Superstructure', 22, 40, true, false],\n      ['Systems installation', 34, 48, false, true],\n      ['Testing and commissioning', 46, 52, true, false]\n    ];\n    const bars = demo ? raw.map(r => {\n      const crit = r[3], risk = r[4];\n      return {\n        name: r[0],\n        tag: crit ? 'Critical path' : risk ? '▲ At risk' : '',\n        tagColor: crit ? '#c2410c' : '#8a5a00',\n        left: ((r[1] - 1) / 52 * 100) + '%',\n        width: ((r[2] - r[1] + 1) / 52 * 100) + '%',\n        fill: '#0a5cc2',\n        border: crit ? '2px solid #c2410c' : risk ? '2px dashed #b07a00' : '2px solid #0a5cc2'\n      };\n    }) : [];\n    const T = [\n      ['Baseline','The programme accepted at the start, kept unchanged as the comparison point.','Replaced only through a recorded, authorised version, never overwritten.'],\n      ['Current approved','The latest programme accepted under the contract, with float and critical path.','Each version keeps its approval date and approver.'],\n      ['Contractor submissions','Programme submissions and updates, with the review period tracked.','The review period comes from an Approved for Use rule.'],\n      ['Recovery and mitigation','Recovery programmes and mitigation measures recorded against delay events.','Mitigation records are kept as evidence for delay analysis.']\n    ];\n    const sel = this.state.sel || 0;\n    const tabs = T.map((t, i) => ({\n      title: t[0], pick: () => this.setState({ sel: i }),\n      pressed: i === sel ? 'true' : 'false',\n      bg: i === sel ? '#0a5cc2' : '#ffffff', fg: i === sel ? '#ffffff' : '#0e1a2b', border: i === sel ? '#0a5cc2' : '#cfd8e2'\n    }));\n    const links = ['Affected activities','Approved programme version','Contemporaneous update','Critical path implications','Instructions and notices','Mitigation records','Claimed EOT','Assessed EOT','Determined EOT'].map(label => ({ label }));\n    return {\n      bars, tabs, links,\n      cur: { what: T[sel][1], rule: T[sel][2] },\n      hasDemo: demo ? 'yes' : '', empty: demo ? '' : 'yes',\n      demoBtn: demo ? 'Remove demo data' : 'Restore demo data (prototype only)',\n      toggleDemo: () => this.setState({ demo: !demo })\n    };\n  }\n}\n<\/script>\n<\/body>\n<\/html>\n", "Progress": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>Project Progress<\/title>\n<script src=\"./support.js\"><\/script>\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;display=swap\" rel=\"stylesheet\">\n<style>\nbody{margin:0;font-family:\"Plus Jakarta Sans\",system-ui,sans-serif;color:#0e1a2b;background:#e9edf2}\nbutton{font-family:inherit}\n@keyframes pulse{0%{opacity:1}50%{opacity:.35}100%{opacity:1}}\n\n.gq{display:grid;align-items:stretch}\n.gq>*{box-sizing:border-box;min-width:0;height:100%}\n.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.c4{grid-template-columns:repeat(4,minmax(0,1fr))}\n.c5{grid-template-columns:repeat(5,minmax(0,1fr))}.c6{grid-template-columns:repeat(6,minmax(0,1fr))}\n@media (max-width:1000px){.c5,.c6{grid-template-columns:repeat(3,minmax(0,1fr))}.c4{grid-template-columns:repeat(2,minmax(0,1fr))}}\n@media (max-width:640px){.c3,.c4,.c5,.c6{grid-template-columns:minmax(0,1fr)}}\n.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:stretch;margin-bottom:14px}.g2>*{min-width:0;box-sizing:border-box}.g21{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:14px;align-items:stretch;margin-bottom:14px}.g21>*{min-width:0;box-sizing:border-box}\n.col{display:flex;flex-direction:column}.col>.fill{flex:1 1 0}\n@media (max-width:900px){.g2,.g21{grid-template-columns:minmax(0,1fr)}}\n<\/style>\n<\/helmet>\n<div style=\"display:flex;flex-wrap:wrap;min-height:100vh\">\n<div style=\"flex:0 0 260px\"><dc-import name=\"Nav\" active=\"progress\" tone=\"sky\" hint-size=\"260px,1000px\"><\/dc-import><\/div>\n<main style=\"flex:999 1 560px;min-width:0;padding:20px 24px 40px;box-sizing:border-box\">\n\n<div style=\"position:relative;overflow:hidden;border-radius:18px;background:#0a5cc2;color:#fff;padding:54px 26px 20px;margin-bottom:16px\">\n<img src=\"/_blob/46171ba6995dc37df5b45594d674ab24\" alt=\"\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 55%\">\n<div style=\"position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,100,220,.05) 0%,rgba(0,90,200,.9) 100%)\"><\/div>\n<div style=\"position:relative;font-family:Fraunces,Georgia,serif;font-size:30px;font-weight:700;line-height:1.15;text-shadow:0 2px 16px rgba(0,0,0,.45)\">Where the project stands<\/div>\n<div style=\"position:relative;font-size:13px;color:#d3e2ef;margin-top:4px\">Beni Airport · Terminal and Control Tower<\/div>\n<\/div>\n\n<div style=\"display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end;margin-bottom:14px\">\n<div style=\"min-width:0\">\n<div style=\"font-size:11px;letter-spacing:.14em;font-weight:700;color:#0067cc\">PROGRESS REPORT<\/div>\n<h1 style=\"margin:2px 0 0;font-size:26px;font-weight:800\">Beni Airport · Terminal and Control Tower<\/h1>\n<\/div>\n<div style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center\">\n<span style=\"display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:#145c36;background:#e3f3ea;border:1px solid #9bcdb0;border-radius:999px;padding:6px 12px\"><span style=\"width:8px;height:8px;border-radius:50%;background:#1f9d5b;animation:pulse 1.6s infinite\"><\/span>{{liveLabel}}<\/span>\n<button onClick=\"{{simulate}}\" style=\"min-height:44px;padding:0 16px;border:1px solid #0a5cc2;background:#0a5cc2;color:#fff;border-radius:10px;font-size:13.5px;font-weight:700;cursor:pointer\">Simulate site update<\/button>\n<button onClick=\"{{toggleDemo}}\" style=\"min-height:44px;padding:0 16px;border:1px solid #6b4600;background:#fff7dd;color:#4a3200;border-radius:10px;font-size:13.5px;font-weight:600;cursor:pointer\">{{demoBtn}}<\/button>\n<\/div>\n<\/div>\n\n<div style=\"background:#fff7dd;border:1px solid #e8c766;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:13px;line-height:1.5;color:#4a3200\"><strong>{{bannerTitle}}<\/strong> {{bannerText}}<\/div>\n\n<div style=\"display:flex;flex-wrap:wrap;gap:16px;align-items:center;background:#fff;border-radius:14px;padding:10px 16px;margin-bottom:14px;border:1px solid #d3dbe5\">\n<div style=\"font-size:12px;font-weight:800;color:#4a5a6e;letter-spacing:.08em\">SLICER<\/div>\n<div style=\"display:flex;flex-wrap:wrap;gap:6px\" role=\"group\" aria-label=\"Scope\">\n<sc-for list=\"{{scopes}}\" as=\"s\" hint-placeholder-count=\"3\">\n<button onClick=\"{{s.pick}}\" aria-pressed=\"{{s.pressed}}\" style=\"min-height:44px;padding:0 16px;border-radius:8px;border:1px solid {{s.border}};background:{{s.bg}};color:{{s.fg}};font-size:13.5px;font-weight:700;cursor:pointer\">{{s.label}}<\/button>\n<\/sc-for>\n<\/div>\n<div style=\"font-size:12.5px;color:#4a5a6e\">Click a workstream bar to highlight it everywhere. <button onClick=\"{{clearWs}}\" style=\"min-height:44px;padding:0 10px;border:none;background:transparent;color:#0f4c99;font-size:12.5px;font-weight:700;cursor:pointer;text-decoration:underline\">{{clearLabel}}<\/button><\/div>\n<\/div>\n\n<sc-if value=\"{{empty}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"background:#fff;border:1px dashed #9aa9ba;border-radius:16px;padding:44px 24px;text-align:center;font-size:14.5px;line-height:1.7;color:#4a5a6e\">No progress data yet.<br>Import the accepted baseline programme and record progress updates, and this report fills from those records.<\/div>\n<\/sc-if>\n\n<sc-if value=\"{{hasData}}\" hint-placeholder-val=\"{{ true }}\">\n<div class=\"gq c6\" style=\"gap:12px;margin-bottom:14px\">\n<sc-for list=\"{{kpis}}\" as=\"k\" hint-placeholder-count=\"6\">\n<div style=\"background:#fff;border-radius:14px;padding:14px 16px;border:1px solid #d3dbe5;border-top:4px solid {{k.color}}\">\n<div style=\"font-size:12px;font-weight:700;color:#4a5a6e\">{{k.label}}<\/div>\n<div style=\"font-size:28px;font-weight:800;margin-top:4px;line-height:1.1\">{{k.value}}<\/div>\n<div style=\"font-size:12px;font-weight:700;margin-top:4px;color:{{k.noteColor}}\">{{k.note}}<\/div>\n<\/div>\n<\/sc-for>\n<\/div>\n\n<div class=\"g21\">\n<section style=\"min-width:0;background:#fff;border-radius:16px;padding:16px 18px;border:1px solid #d3dbe5\" aria-labelledby=\"sch\">\n<h2 id=\"sch\" style=\"margin:0 0 2px;font-size:16px;font-weight:800\">Cumulative progress (S-curve)<\/h2>\n<div style=\"font-size:12px;color:#4a5a6e;margin-bottom:6px\">Planned versus actual, as a percentage of the whole project.<\/div>\n<svg viewBox=\"0 0 520 260\" width=\"100%\" role=\"img\" aria-label=\"{{curveAria}}\" style=\"display:block\">\n<g stroke=\"#e3e9f0\" stroke-width=\"1\"><path d=\"M44 220H500M44 170H500M44 120H500M44 70H500M44 20H500\"><\/path><\/g>\n<g font-size=\"11\" fill=\"#4a5a6e\"><text x=\"36\" y=\"224\" text-anchor=\"end\">0<\/text><text x=\"36\" y=\"174\" text-anchor=\"end\">25<\/text><text x=\"36\" y=\"124\" text-anchor=\"end\">50<\/text><text x=\"36\" y=\"74\" text-anchor=\"end\">75<\/text><text x=\"36\" y=\"24\" text-anchor=\"end\">100%<\/text>\n<text x=\"44\" y=\"240\" text-anchor=\"middle\">M0<\/text><text x=\"120\" y=\"240\" text-anchor=\"middle\">M2<\/text><text x=\"196\" y=\"240\" text-anchor=\"middle\">M4<\/text><text x=\"272\" y=\"240\" text-anchor=\"middle\">M6<\/text><text x=\"348\" y=\"240\" text-anchor=\"middle\">M8<\/text><text x=\"424\" y=\"240\" text-anchor=\"middle\">M10<\/text><text x=\"500\" y=\"240\" text-anchor=\"middle\">M12<\/text><\/g>\n<path d=\"{{curve.areaActual}}\" fill=\"#007FFF\" fill-opacity=\".14\"><\/path>\n<path d=\"{{curve.planned}}\" fill=\"none\" stroke=\"#6d7f94\" stroke-width=\"2.5\" stroke-dasharray=\"6 5\"><\/path>\n<path d=\"{{curve.actual}}\" fill=\"none\" stroke=\"#0067cc\" stroke-width=\"3.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path>\n<line x1=\"{{curve.tx}}\" x2=\"{{curve.tx}}\" y1=\"20\" y2=\"220\" stroke=\"#c2410c\" stroke-width=\"2\" stroke-dasharray=\"3 4\"><\/line>\n<circle cx=\"{{curve.tx}}\" cy=\"{{curve.ay}}\" r=\"6\" fill=\"#0067cc\" stroke=\"#fff\" stroke-width=\"2.5\"><\/circle>\n<text x=\"{{curve.tlx}}\" y=\"34\" font-size=\"11.5\" font-weight=\"700\" fill=\"#c2410c\" text-anchor=\"{{curve.anchor}}\">Today · month {{curve.tm}}<\/text>\n<\/svg>\n<div style=\"display:flex;flex-wrap:wrap;gap:16px;font-size:12px;color:#4a5a6e;margin-top:4px\">\n<span><span style=\"display:inline-block;width:22px;border-top:3px dashed #6d7f94;vertical-align:middle;margin-right:6px\"><\/span>Planned<\/span>\n<span><span style=\"display:inline-block;width:22px;border-top:4px solid #0067cc;vertical-align:middle;margin-right:6px\"><\/span>Actual<\/span>\n<span style=\"color:#c2410c;font-weight:700\">¦ Today marker<\/span>\n<\/div>\n<\/section>\n\n<section style=\"min-width:0;background:#fff;border-radius:16px;padding:16px 18px;border:1px solid #d3dbe5;display:flex;flex-direction:column;align-items:center\" aria-labelledby=\"dnh\">\n<h2 id=\"dnh\" style=\"margin:0 0 8px;font-size:16px;font-weight:800;align-self:flex-start\">Overall completion<\/h2>\n<svg viewBox=\"0 0 160 160\" width=\"200\" height=\"200\" role=\"img\" aria-label=\"Overall progress {{kpiActual}} percent, planned {{kpiPlanned}} percent\">\n<circle cx=\"80\" cy=\"80\" r=\"70\" fill=\"none\" stroke=\"#e3e9f0\" stroke-width=\"7\"><\/circle>\n<circle cx=\"80\" cy=\"80\" r=\"70\" fill=\"none\" stroke=\"#6d7f94\" stroke-width=\"7\" stroke-linecap=\"round\" stroke-dasharray=\"{{ring.pDash}}\" transform=\"rotate(-90 80 80)\"><\/circle>\n<circle cx=\"80\" cy=\"80\" r=\"54\" fill=\"none\" stroke=\"#e3e9f0\" stroke-width=\"16\"><\/circle>\n<circle cx=\"80\" cy=\"80\" r=\"54\" fill=\"none\" stroke=\"#007FFF\" stroke-width=\"16\" stroke-linecap=\"round\" stroke-dasharray=\"{{ring.aDash}}\" transform=\"rotate(-90 80 80)\"><\/circle>\n<text x=\"80\" y=\"82\" text-anchor=\"middle\" font-size=\"26\" font-weight=\"800\" fill=\"#0e1a2b\">{{kpiActual}}%<\/text>\n<text x=\"80\" y=\"100\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"600\" fill=\"#4a5a6e\">actual<\/text>\n<\/svg>\n<div style=\"display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:#4a5a6e;margin-top:6px;justify-content:center\">\n<span><span style=\"display:inline-block;width:10px;height:10px;border-radius:3px;background:#007FFF;margin-right:6px\"><\/span>Actual {{kpiActual}}%<\/span>\n<span><span style=\"display:inline-block;width:10px;height:10px;border-radius:3px;background:#6d7f94;margin-right:6px\"><\/span>Planned {{kpiPlanned}}%<\/span>\n<\/div>\n<\/section>\n<\/div>\n\n<div class=\"g2\">\n<section class=\"col\" style=\"min-width:0;background:#fff;border-radius:16px;padding:16px 18px;border:1px solid #d3dbe5\" aria-labelledby=\"wsh\">\n<h2 id=\"wsh\" style=\"margin:0 0 2px;font-size:16px;font-weight:800\">Progress by workstream<\/h2>\n<div style=\"font-size:12px;color:#4a5a6e;margin-bottom:10px\">Bar is actual. The dark tick is planned.<\/div>\n<sc-for list=\"{{rows}}\" as=\"r\" hint-placeholder-count=\"6\">\n<button class=\"fill\" onClick=\"{{r.pick}}\" aria-pressed=\"{{r.pressed}}\" style=\"display:flex;flex-direction:column;justify-content:center;min-height:56px;width:100%;text-align:left;border:1px solid {{r.border}};background:{{r.bg}};border-radius:10px;padding:8px 10px;margin-bottom:6px;cursor:pointer;opacity:{{r.op}}\">\n<div style=\"display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:700\"><span>{{r.name}}<\/span><span style=\"color:{{r.color}}\">{{r.icon}} {{r.actual}}% <span style=\"font-weight:600;color:#4a5a6e\">of {{r.planned}}% planned<\/span><\/span><\/div>\n<div style=\"position:relative;height:12px;border-radius:999px;background:#e3e9f0;margin-top:6px;overflow:visible\">\n<div style=\"position:absolute;left:0;top:0;bottom:0;border-radius:999px;width:{{r.aw}};background:{{r.fill}}\"><\/div>\n<div style=\"position:absolute;top:-3px;bottom:-3px;width:3px;border-radius:2px;background:#0e1a2b;left:{{r.pw}}\"><\/div>\n<\/div>\n<\/button>\n<\/sc-for>\n<\/section>\n\n<section class=\"col\" style=\"min-width:0;background:#fff;border-radius:16px;padding:16px 18px;border:1px solid #d3dbe5\" aria-labelledby=\"gnh\">\n<h2 id=\"gnh\" style=\"margin:0 0 2px;font-size:16px;font-weight:800\">Where we are in the programme<\/h2>\n<div style=\"font-size:12px;color:#4a5a6e;margin-bottom:10px\">Light bar is the planned window. Dark fill is progress achieved. Red line is today.<\/div>\n<div style=\"display:flex;margin-left:112px;font-size:11px;color:#4a5a6e;margin-bottom:4px\"><span style=\"flex:1 1 0\">M1<\/span><span style=\"flex:1 1 0\">M4<\/span><span style=\"flex:1 1 0\">M7<\/span><span style=\"flex:1 1 0;text-align:right\">M12<\/span><\/div>\n<sc-for list=\"{{gantt}}\" as=\"g\" hint-placeholder-count=\"6\">\n<div class=\"fill\" style=\"display:flex;align-items:center;min-height:56px;border-top:1px solid #edf1f5;opacity:{{g.op}}\">\n<div style=\"flex:0 0 112px;font-size:12.5px;font-weight:600;padding-right:8px\">{{g.name}}<\/div

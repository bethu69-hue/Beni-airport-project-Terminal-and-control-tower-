5a6e;max-width:820px;line-height:1.55\">Ask a question about the contract documents on this project. The answer is built only from passages found in those documents, and each one shows its source. If nothing is found, it says so.<\/p>\n<div style=\"background:#fff7dd;border:1px solid #e0b84f;border-radius:10px;padding:10px 14px;font-size:13px;color:#4a3200;margin-bottom:20px;max-width:820px;line-height:1.5\"><b>Prototype:<\/b> this page searches the text you add below, on this device only. It shows the matching passages. In the live system, an AI model writes a short answer from those same passages and cites them. It is a reading aid, not legal advice. The contract documents and the Engineer's decisions prevail.<\/div>\n\n<div style=\"display:flex;flex-wrap:wrap;gap:22px;align-items:stretch\">\n<section style=\"flex:2 1 460px;min-width:0\">\n<div style=\"background:#fff;border:1px solid #e1e7ee;border-radius:16px;padding:16px 18px;margin-bottom:16px\">\n<label class=\"f\">Your question<input value=\"{{q}}\" onInput=\"{{setQ}}\" onKeyDown=\"{{keyQ}}\" placeholder=\"For example: how many days to give notice of a claim?\"><\/label>\n<button onClick=\"{{ask}}\" style=\"min-height:46px;padding:0 22px;border-radius:10px;border:0;background:#0a5cc2;color:#fff;font-weight:700;cursor:pointer\">Search the documents<\/button>\n<\/div>\n\n<sc-if value=\"{{noDocs}}\" hint-placeholder-val=\"\"><div style=\"background:#fff;border:1px dashed #9aa9ba;border-radius:14px;padding:18px;font-size:14px;color:#4a5a6e\">No documents added yet. Add the contract text on the right, then ask your question.<\/div><\/sc-if>\n\n<sc-if value=\"{{asked}}\" hint-placeholder-val=\"\">\n<div style=\"font-size:15px;font-weight:800;margin-bottom:8px;color:{{resColor}}\">{{resHead}}<\/div>\n<sc-for list=\"{{hits}}\" as=\"h\" hint-placeholder-count=\"2\">\n<div style=\"background:#fff;border:1px solid #e1e7ee;border-left:5px solid #F7D618;border-radius:12px;padding:12px 16px;margin-bottom:10px\">\n<div style=\"font-size:12px;font-weight:700;color:#0a5cc2;margin-bottom:4px\">{{h.src}}<\/div>\n<div style=\"font-size:14px;line-height:1.6;white-space:pre-wrap\">{{h.text}}<\/div>\n<\/div>\n<\/sc-for>\n<\/sc-if>\n<\/section>\n\n<section style=\"flex:1 1 340px;min-width:0\">\n<h2 style=\"margin:0 0 8px;font-size:18px;font-weight:800\">Documents the assistant can read<\/h2>\n<sc-for list=\"{{docs}}\" as=\"d\" hint-placeholder-count=\"2\">\n<div style=\"background:#fff;border:1px solid #e1e7ee;border-radius:12px;padding:10px 14px;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px;align-items:center\">\n<div><b style=\"font-size:14px\">{{d.name}}<\/b><div style=\"font-size:12px;color:#4a5a6e\">{{d.info}}<\/div><\/div>\n<button onClick=\"{{d.remove}}\" style=\"min-height:36px;padding:0 10px;border-radius:8px;border:1px solid #b9c4d0;background:#fff;cursor:pointer;font-weight:600\">Remove<\/button>\n<\/div>\n<\/sc-for>\n<div style=\"background:#fff;border:1px solid #e1e7ee;border-radius:12px;padding:12px 14px\">\n<label class=\"f\">Document name<input value=\"{{nn}}\" onInput=\"{{setNN}}\" placeholder=\"For example: Particular Conditions\"><\/label>\n<label class=\"f\">Choose a text file (.txt or .md)<input type=\"file\" accept=\".txt,.md,text/plain\" onChange=\"{{pickFile}}\"><\/label>\n<label class=\"f\">Or paste the text<textarea rows=\"7\" value=\"{{nt}}\" onInput=\"{{setNT}}\"><\/textarea><\/label>\n<button onClick=\"{{addDoc}}\" style=\"min-height:44px;padding:0 18px;border-radius:10px;border:0;background:#0a5cc2;color:#fff;font-weight:700;cursor:pointer\">Add document<\/button>\n<div style=\"margin-top:8px;font-size:13px;font-weight:700;color:{{addColor}}\">{{addMsg}}<\/div>\n<div style=\"font-size:12.5px;color:#4a5a6e;margin-top:8px;line-height:1.5\">PDF and Word files are read in the live system. Here, paste text or use a text file. Nothing leaves this device.<\/div>\n<\/div>\n<\/section>\n<\/div>\n<\/main>\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script data-props='{\"$preview\":{\"width\":1360,\"height\":1100}}'>\nclass Component extends DCLogic {\n  load() {\n    if (this._d) return this._d;\n    let d = null;\n    try { d = JSON.parse(localStorage.getItem('beni_assist_v1') || 'null'); } catch (e) {}\n    this._d = d || { docs: [], q: '', asked: false, res: [], nn: '', nt: '', msg: '', bad: false };\n    return this._d;\n  }\n  save() { try { localStorage.setItem('beni_assist_v1', JSON.stringify(this._d)); } catch (e) { this._d.msg = 'This device cannot store that much text.'; this._d.bad = true; } this.setState({ k: Date.now() }); }\n  chunks(doc) {\n    const paras = doc.text.split(/\\n\\s*\\n/).map(s => s.trim()).filter(Boolean);\n    const out = []; let head = '';\n    paras.forEach(p => {\n      const first = p.split('\\n')[0];\n      if (first.length < 90 && /^(clause|article|section|sub-clause|\\d+(\\.\\d+)*[\\s.)])/i.test(first)) head = first;\n      for (let i = 0; i < p.length; i += 1100) out.push({ head, text: p.slice(i, i + 1100) });\n    });\n    return out;\n  }\n  renderVals() {\n    const D = this.load();\n    const STOP = new Set('a an and are as at be by can do does for from how i in is it many much of on or shall should the their there this to what when where which who will with within you we our'.split(' '));\n    const ask = () => {\n      D.asked = true; D.res = [];\n      const terms = D.q.toLowerCase().replace(/[^a-z0-9\\s.]/g, ' ').split(/\\s+/).filter(t => t.length > 1 && !STOP.has(t));\n      if (terms.length) {\n        const scored = [];\n        D.docs.forEach(doc => this.chunks(doc).forEach((c, i) => {\n          const low = (c.head + ' ' + c.text).toLowerCase();\n          let s = 0; terms.forEach(t => { const m = low.split(t).length - 1; if (m) s += 1 + Math.min(m, 4) * 0.25; });\n          if (s > 0) scored.push({ s, src: doc.name + (c.head ? ' · ' + c.head : '') + ' · passage ' + (i + 1), text: c.text });\n        }));\n        scored.sort((a, b) => b.s - a.s);\n        D.res = scored.slice(0, 5);\n      }\n      this.save();\n    };\n    const hits = D.res.map(r => ({ src: r.src, text: r.text }));\n    return {\n      q: D.q, setQ: (e) => { D.q = e.target.value; this.save(); }, keyQ: (e) => { if (e.key === 'Enter') ask(); }, ask,\n      noDocs: D.docs.length ? '' : 'yes', asked: D.asked && D.docs.length ? 'yes' : '', hits,\n      resHead: hits.length ? 'Found in the documents (' + hits.length + ' passage' + (hits.length === 1 ? '' : 's') + ')' : 'Not found in the documents you added. Do not rely on an answer. Check the source or ask the Contract Manager.',\n      resColor: hits.length ? '#145c36' : '#9a3412',\n      docs: D.docs.map((d, i) => ({ name: d.name, info: d.text.length.toLocaleString() + ' characters · added ' + new Date(d.at).toLocaleDateString(), remove: () => { D.docs.splice(i, 1); D.res = []; this.save(); } })),\n      nn: D.nn, setNN: (e) => { D.nn = e.target.value; this.save(); }, nt: D.nt, setNT: (e) => { D.nt = e.target.value; this.save(); },\n      pickFile: (e) => { const f = e.target.files && e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { D.nt = String(r.result).slice(0, 1500000); if (!D.nn) D.nn = f.name.replace(/\\.[^.]+$/, ''); this.save(); }; r.readAsText(f); },\n      addDoc: () => {\n        if (!D.nn.trim() || D.nt.trim().length < 20) { D.msg = 'Enter a name and some text.'; D.bad = true; return this.save(); }\n        D.docs.push({ name: D.nn.trim(), text: D.nt, at: Date.now() }); D.nn = ''; D.nt = ''; D.msg = 'Added.'; D.bad = false; this.save();\n      },\n      addMsg: D.msg, addColor: D.bad ? '#9a3412' : '#145c36'\n    };\n  }\n}\n<\/script>\n<\/body>\n<\/html>\n", "Chat": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>Team Chat<\/title>\n<script src=\"./support.js\"><\/script>\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap\" rel=\"stylesheet\">\n<style>\nbody{margin:0;font-family:\"Plus Jakarta Sans\",system-ui,sans-serif;color:#0e1a2b;background:#f3f5f9}\nbutton,input,select,textarea{font-family:inherit;font-size:14px}\ninput,select,textarea{border:1px solid #b9c4d0;border-radius:8px;padding:9px 10px;box-sizing:border-box;width:100%;background:#fff;color:#0e1a2b}\nlabel.f{display:block;font-size:12px;font-weight:700;color:#4a5a6e;margin-bottom:8px}\nlabel.f>*{margin-top:4px;font-weight:400}\n<\/style>\n<\/helmet>\n<div style=\"display:flex;flex-wrap:wrap;min-height:100vh\">\n<div style=\"flex:0 0 260px\"><dc-import name=\"Nav\" active=\"chat\" hint-size=\"260px,1000px\"><\/dc-import><\/div>\n<main style=\"flex:999 1 560px;min-width:0;padding:24px 28px 40px;box-sizing:border-box\">\n<div style=\"font-size:11px;letter-spacing:.14em;font-weight:700;color:#0a5cc2\">COLLABORATE<\/div>\n<h1 style=\"margin:4px 0 6px;font-size:28px;font-weight:800\">Team Chat<\/h1>\n<p style=\"margin:0 0 6px;font-size:14px;color:#4a5a6e;max-width:820px;line-height:1.55\">Raise a quick query with the team. Tag someone with @name. If they are not online, they are alerted on WhatsApp and by email. Every message is kept for at least 30 days for review.<\/p>\n<div style=\"background:#fff7dd;border:1px solid #e0b84f;border-radius:10px;padding:10px 14px;font-size:13px;color:#4a3200;margin-bottom:20px;max-width:820px;line-height:1.5\"><b>Prototype:<\/b> nothing is sent from this page. It shows what the live system queues. Chat is for simple queries. A contractual notice must still be issued from Notices and Deadlines.<\/div>\n\n<div style=\"display:flex;flex-wrap:wrap;gap:22px;align-items:stretch\">\n\n<section style=\"flex:2 1 460px;min-width:0\">\n<div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px\">\n<sc-for list=\"{{channels}}\" as=\"c\" hint-placeholder-count=\"3\"><button onClick=\"{{c.pick}}\" aria-pressed=\"{{c.on}}\" style=\"min-height:40px;padding:0 14px;border-radius:999px;border:1px solid {{c.border}};background:{{c.bg}};color:{{c.fg}};font-weight:700;cursor:pointer\">#{{c.name}}<\/button><\/sc-for>\n<\/div>\n<div style=\"background:#fff;border:1px solid #e1e7ee;border-radius:16px;padding:14px 16px;min-height:260px;max-height:420px;overflow-y:auto\">\n<sc-if value=\"{{noMsgs}}\" hint-placeholder-val=\"\"><div style=\"color:#4a5a6e;font-size:14px;padding:18px 0\">No messages in this channel yet.<\/div><\/sc-if>\n<sc-for list=\"{{msgs}}\" as=\"m\" hint-placeholder-count=\"3\">\n<div style=\"border-bottom:1px solid #edf1f5;padding:9px 0\">\n<div style=\"font-size:12.5px;color:#4a5a6e\"><b style=\"color:#0e1a2b\">{{m.who}}<\/b> · {{m.when}} <span style=\"color:#9a3412;font-weight:700\">{{m.urgent}}<\/span><\/div>\n<div style=\"font-size:14px;line-height:1.5;margin-top:2px;white-space:pre-wrap\">{{m.body}}<\/div>\n<div style=\"font-size:12px;margin-top:4px;color:#4a5a6e\">{{m.alerts}}<\/div>\n<\/div>\n<\/sc-for>\n<\/div>\n\n<div style=\"background:#fff;border:1px solid #e1e7ee;border-radius:16px;padding:14px 16px;margin-top:12px\">\n<label class=\"f\">Posting as<select value=\"{{asId}}\" onChange=\"{{setAs}}\"><option value=\"\">Choose a team member<\/option><sc-for list=\"{{people}}\" as=\"p\"><option value=\"{{p.id}}\">{{p.name}}<\/option><\/sc-for><\/select><\/label>\n<label class=\"f\">Message<textarea rows=\"3\" value=\"{{draft}}\" onInput=\"{{setDraft}}\" placeholder=\"Type @ and a name to tag someone\"><\/textarea><\/label>\n<div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px\">\n<span style=\"font-size:12px;font-weight:700;color:#4a5a6e\">Tag:<\/span>\n<sc-for list=\"{{tagBtns}}\" as=\"t\" hint-placeholder-count=\"3\"><button onClick=\"{{t.tag}}\" style=\"min-height:34px;padding:0 10px;border-radius:999px;border:1px solid #0a5cc2;background:#fff;color:#0a5cc2;font-weight:600;cursor:pointer\">@{{t.name}}<\/button><\/sc-for>\n<label style=\"display:flex;gap:6px;align-items:center;font-size:13px;margin-left:auto\"><input type=\"checkbox\" checked=\"{{urgent}}\" onChange=\"{{flipUrgent}}\" style=\"width:18px;height:18px\"> Urgent<\/label>\n<\/div>\n<div style=\"display:flex;flex-wrap:wrap;gap:12px;align-items:center\">\n<button onClick=\"{{send}}\" style=\"min-height:46px;padding:0 22px;border-radius:10px;border:0;background:#0a5cc2;color:#fff;font-weight:700;cursor:pointer\">Send<\/button>\n<span style=\"font-size:13px;font-weight:700;color:{{msgColor}}\">{{msg}}<\/span>\n<\/div>\n<\/div>\n<p style=\"font-size:12.5px;color:#4a5a6e;margin:8px 0 0\">Messages cannot be edited or deleted. They are removed automatically after {{retention}} days (the minimum is 30). A person counts as online if they were active in the last 2 minutes.<\/p>\n<\/section>\n\n<section style=\"flex:1 1 340px;min-width:0\">\n<h2 style=\"margin:0 0 8px;font-size:18px;font-weight:800\">Team directory<\/h2>\n<sc-if value=\"{{noPeople}}\" hint-placeholder-val=\"\"><div style=\"background:#fff;border:1px dashed #9aa9ba;border-radius:14px;padding:16px;font-size:13.5px;color:#4a5a6e;margin-bottom:12px\">No team members yet. Add each person with their official email and phone number.<\/div><\/sc-if>\n<sc-for list=\"{{people}}\" as=\"p\" hint-placeholder-count=\"2\">\n<div style=\"background:#fff;border:1px solid #e1e7ee;border-radius:12px;padding:11px 14px;margin-bottom:8px\">\n<div style=\"display:flex;justify-content:space-between;gap:8px;align-items:center\"><b>{{p.name}}<\/b>\n<button onClick=\"{{p.toggleOnline}}\" aria-pressed=\"{{p.onlineA11y}}\" style=\"min-height:32px;padding:0 10px;border-radius:999px;border:1px solid {{p.dotBorder}};background:{{p.dotBg}};font-size:12px;font-weight:700;cursor:pointer;color:#0e1a2b\">{{p.online}}<\/button><\/div>\n<div style=\"font-size:12.5px;color:#4a5a6e;line-height:1.55\">{{p.role}}<br>{{p.email}}<br>{{p.phone}}<br>{{p.wa}}<\/div>\n<\/div>\n<\/sc-for>\n<details style=\"background:#fff;border:1px solid #e1e7ee;border-radius:12px;padding:10px 14px;margin-bottom:16px\" open=\"\">\n<summary style=\"font-weight:700;cursor:pointer;min-height:32px\">Add a team member<\/summary>\n<div style=\"margin-top:8px\">\n<label class=\"f\">Full name<input value=\"{{n.name}}\" onInput=\"{{setNName}}\"><\/label>\n<label class=\"f\">Role and organisation<input value=\"{{n.role}}\" onInput=\"{{setNRole}}\"><\/label>\n<label class=\"f\">Official email<input value=\"{{n.email}}\" onInput=\"{{setNEmail}}\" inputmode=\"email\"><\/label>\n<label class=\"f\">Phone, with country code (+243...)<input value=\"{{n.phone}}\" onInput=\"{{setNPhone}}\" inputmode=\"tel\"><\/label>\n<label style=\"display:flex;gap:8px;align-items:flex-start;font-size:13px;margin-bottom:10px\"><input type=\"checkbox\" checked=\"{{n.consent}}\" onChange=\"{{flipConsent}}\" style=\"width:18px;height:18px;margin-top:2px;flex:0 0 18px\"><span>This person agrees to receive project alerts on WhatsApp at this number.<\/span><\/label>\n<button onClick=\"{{addPerson}}\" style=\"min-height:42px;padding:0 16px;border-radius:10px;border:0;background:#0a5cc2;color:#fff;font-weight:700;cursor:pointer\">Add to directory<\/button>\n<div style=\"margin-top:8px;font-size:13px;font-weight:700;color:#9a3412\">{{addErr}}<\/div>\n<\/div>\n<\/details>\n\n<h2 style=\"margin:0 0 8px;font-size:18px;font-weight:800\">Reach the system administrator<\/h2>\n<div style=\"background:#fff;border:1px solid #e1e7ee;border-radius:12px;padding:12px 14px\">\n<label class=\"f\">Administrator WhatsApp number<input value=\"{{adminNo}}\" onInput=\"{{setAdmin}}\" inputmode=\"tel\" placeholder=\"+243...\"><\/label>\n<a href=\"{{adminLink}}\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:10px;background:{{adminBg}};color:{{adminFg}};font-weight:700;text-decoration:none;pointer-events:{{adminPE}}\">Chat with the administrator on WhatsApp<\/a>\n<div style=\"font-size:12.5px;color:#4a5a6e;margin-top:8px\">{{adminNote}}<\/div>\n<\/div>\n<\/section>\n<\/div>\n<\/main>\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script data-props='{\"$preview\":{\"width\":1360,\"height\":1300}}'>\nclass Component extends DCLogic {\n  load() {\n    if (this._d) return this._d;\n    let d = null;\n    try { d = JSON.parse(localStorage.getItem('beni_chat_v1') || 'null'); } catch (e) {}\n    this._d = d || { people: [], msgs: [], channel: 'general', as: '', draft: '', urgent: false, admin: '', n: { name: '', role: '', email: '', phone: '', consent: false }, msg: '', bad: false, addErr: '', online: {} };\n    if (!this._d.admin) this._d.admin = '+254725309557';\n    const cut = Date.now() - 30 * 86400000;\n    this._d.msgs = this._d.msgs.filter(m => m.t >= cut);\n    return this._d;\n  }\n  save() { try { localStorage.setItem('beni_chat_v1', JSON.stringify(this._d)); } catch (e) {} this.setState({ k: Date.now() }); }\n  renderVals() {\n    const D = this.load();\n    const CH = ['general', 'site-queries', 'design-and-rfis', 'quality'];\n    const channels = CH.map(c => ({ name: c, pick: () => { D.channel = c; this.save(); }, on: D.channel === c ? 'true' : 'false',\n      bg: D.channel === c ? '#0a5cc2' : '#fff', fg: D.channel === c ? '#fff' : '#0e1a2b', border: D.channel === c ? '#0a5cc2' : '#b9c4d0' }));\n    const byId = Object.fromEntries(D.people.map(p => [p.id, p]));\n    const first = (p) => p.name.trim().split(/\\s+/)[0];\n    const people = D.people.map(p => {\n      const on = !!D.online[p.id];\n      return { id: p.id, name: p.name, role: p.role || 'Role not entered', email: p.email || 'No email', phone: p.phone || 'No phone',\n        wa: p.consent && p.phone ? 'WhatsApp alerts: agreed' : 'WhatsApp alerts: no consent recorded',\n        online: on ? 'Online' : 'Offline', onlineA11y: on ? 'true' : 'false', dotBg: on ? '#e3f3ea' : '#eceff2', dotBorder: on ? '#9bcdb0' : '#c3cad2',\n        toggleOnline: () => { D.online[p.id] = !on; this.save(); } };\n    });\n    const alertText = (m) => (m.alerts || []).map(a => a.name + ': ' + a.lines.join(', ')).join('  |  ');\n    const fmt = (t) => new Date(t).toLocaleString([], { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });\n    const msgs = D.msgs.filter(m => m.ch === D.channel).map(m => ({ who: m.who, when: fmt(m.t), body: m.body, urgent: m.urgent ? 'URGENT' : '',\n      alerts: m.alerts && m.alerts.length ? 'Alerts queued (not yet sent in this prototype): ' + alertText(m) : (m.tagged ? 'Everyone tagged was online. No alert needed.' : '') }));\n    const send = () => {\n      if (!D.as) { D.msg = 'Choose who is posting.'; D.bad = true; return this.save(); }\n      if (!D.draft.trim()) { D.msg = 'Type a message first.'; D.bad = true; return this.save(); }\n      const body = D.draft.trim();\n      const low = body.toLowerCase();\n      const tagged = D.people.filter(p => p.id !== D.as && (low.includes('@' + p.name.toLowerCase()) || low.includes('@' + first(p).toLowerCase())));\n      const alerts = [];\n      tagged.forEach(p => {\n        if (D.online[p.id]) return;\n        const lines = [];\n        lines.push(p.consent && p.phone ? 'WhatsApp queued' : 'WhatsApp skipped (' + (p.phone ? 'no consent recorded' : 'no phone number') + ')');\n        lines.push(p.email ? 'email queued' : 'email skipped (no address)');\n        alerts.push({ name: p.name, lines });\n      });\n      D.msgs.push({ id: Date.now(), t: Date.now(), ch: D.channel, who: byId[D.as].name, body, urgent: D.urgent, tagged: tagged.length > 0, alerts });\n      D.draft = ''; D.urgent = false; D.bad = false;\n      D.msg = tagged.length ? tagged.length + ' tagged. ' + (alerts.length ? alerts.length + ' offline, alerts queued.' : 'All online.') : 'Sent.';\n      this.save();\n    };\n    const wa = (D.admin || '').replace(/[^\\d]/g, '');\n    const okNo = /^\\+[1-9]\\d{7,14}$/.test((D.admin || '').replace(/\\s/g, ''));\n    return {\n      channels, msgs, noMsgs: msgs.length ? '' : 'yes', people, noPeople: people.length ? '' : 'yes', asId: D.as,\n      setAs: (e) => { D.as = e.target.value; this.save(); }, draft: D.draft, setDraft: (e) => { D.draft = e.target.value; this.save(); },\n      tagBtns: D.people.map(p => ({ name: first(p), tag: () => { D.draft = (D.draft + (D.draft && !D.draft.endsWith(' ') ? ' ' : '') + '@' + first(p) + ' '); this.save(); } })),\n      urgent: D.urgent, flipUrgent: () => { D.urgent = !D.urgent; this.save(); }, send, msg: D.msg, msgColor: D.bad ? '#9a3412' : '#145c36', retention: 30,\n      n: D.n, setNName: (e) => { D.n.name = e.target.value; this.save(); }, setNRole: (e) => { D.n.role = e.target.value; this.save(); }, setNEmail: (e) => { D.n.email = e.target.value; this.save(); }, setNPhone: (e) => { D.n.phone = e.target.value; this.save(); }, flipConsent: () => { D.n.consent = !D.n.consent; this.save(); },\n      addErr: D.addErr,\n      addPerson: () => {\n        const n = D.n;\n        if (!n.name.trim()) { D.addErr = 'Enter a name.'; return this.save(); }\n        if (n.email && !/^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$/.test(n.email)) { D.addErr = 'That email does not look right.'; return this.save(); }\n        if (n.phone && !/^\\+[1-9]\\d{7,14}$/.test(n.phone.replace(/\\s/g, ''))) { D.addErr = 'Phone must start with + and the country code.'; return this.save(); }\n        if (n.consent && !n.phone) { D.addErr = 'WhatsApp consent needs a phone number.'; return this.save(); }\n        D.people.push({ id: 'p' + Date.now(), name: n.name.trim(), role: n.role.trim(), email: n.email.trim(), phone: n.phone.replace(/\\s/g, ''), consent: !!n.consent });\n        D.n = { name: '', role: '', email: '', phone: '', consent: false }; D.addErr = ''; this.save();\n      },\n      adminNo: D.admin, setAdmin: (e) => { D.admin = e.target.value; this.save(); },\n      adminLink: okNo ? 'https://wa.me/' + wa + '?text=' + encodeURIComponent('BENI Airport platform: I need help from the administrator.') : '#',\n      adminBg: okNo ? '#25D366' : '#e1e7ee', adminFg: okNo ? '#0b2d14' : '#4a5a6e', adminPE: okNo ? 'auto' : 'none',\n      adminNote: okNo ? 'Opens WhatsApp with a ready message.' : 'Enter the number the administrator has agreed to use, starting with + and the country code.'\n    };\n  }\n}\n<\/script>\n<\/body>\n<\/html>\n", "Claims": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>Claims and EOT<\/title>\n<script src=\"./support.js\"><\/script>\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap\" rel=\"stylesheet\">\n<style>\nbody{margin:0;font-family:\"Plus Jakarta Sans\",system-ui,sans-serif;color:#0e1a2b;background:#f3f5f9}\na{color:#0f4c99}\nbutton{font-family:inherit}\n\n.gq{display:grid;align-items:stretch}\n.gq>*{box-sizing:border-box;min-width:0;height:100%}\n.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.c4{grid-template-columns:repeat(4,minmax(0,1fr))}\n.c5{grid-template-columns:repeat(5,minmax(0,1fr))}.c6{grid-template-columns:repeat(6,minmax(0,1fr))}\n@media (max-width:1000px){.c5,.c6{grid-template-columns:repeat(3,minmax(0,1fr))}.c4{grid-template-columns:repeat(2,minmax(0,1fr))}}\n@media (max-width:640px){.c3,.c4,.c5,.c6{grid-template-columns:minmax(0,1fr)}}\n<\/style>\n<\/helmet>\n<div style=\"display:flex;flex-wrap:wrap;min-height:100vh\">\n<div style=\"flex:0 0 260px\"><dc-import name=\"Nav\" active=\"claims\" hint-size=\"260px,1000px\"><\/dc-import><\/div>\n<main style=\"flex:999 1 560px;min-width:0;padding:24px 28px 40px;box-sizing:border-box\">\n\n<div style=\"font-size:11px;letter-spacing:.14em;font-weight:700;color:#0067cc\">CONTRACT · SUB-CLAUSE 20.2 AND RELATED PROCEDURES<\/div>\n<h1 style=\"margin:4px 0 6px;font-size:28px;font-weight:800\">Claims and Extensions of Time<\/h1>\n<p style=\"margin:0 0 22px;font-size:14px;color:#4a5a6e;max-width:760px;line-height:1.55\">Contractor and Employer claims, tracked from event to outcome. Not every claim follows the same path, so steps can be skipped or repeated for continuing claims when the contract procedure differs.<\/p>\n\n<div class=\"gq c3\" style=\"gap:12px;margin-bottom:12px\">\n<sc-for list=\"{{stats}}\" as=\"s\" hint-placeholder-count=\"6\">\n<div style=\"background:#fff;border-radius:14px;padding:14px 16px;border:1px solid #e1e7ee\"><div style=\"font-size:12px;font-weight:600;color:#4a5a6e;min-height:30px;line-height:1.35\">{{s.label}}<\/div><div style=\"font-size:24px;font-weight:800;margin-top:2px\">{{s.value}}<\/div><\/div>\n<\/sc-for>\n<\/div>\n<div style=\"font-size:12.5px;color:#4a5a6e;margin-bottom:26px\">Counts show live records only. No claims are registered yet.<\/div>\n\n<h2 style=\"font-size:18px;font-weight:800;margin:0 0 4px\">Four amounts, never merged<\/h2>\n<p style=\"margin:0 0 12px;font-size:13.5px;color:#4a5a6e\">A claimed sum is not an assessed sum, a determined sum, or money certified and paid.<\/p>\n<div class=\"gq c4\" style=\"gap:0;margin-bottom:28px;background:#fff;border-radius:16px;overflow:hidden;border:1px solid #e1e7ee\">\n<sc-for list=\"{{amounts}}\" as=\"m\" hint-placeholder-count=\"4\">\n<div style=\"padding:16px 18px;border-left:4px solid {{m.color}}\">\n<div style=\"font-size:12px;font-weight:700;color:#4a5a6e\">{{m.label}}<\/div>\n<div style=\"font-size:20px;font-weight:800;margin-top:6px;color:#4a5a6e\">—<\/div>\n<div style=\"font-size:12px;color:#4a5a6e;margin-top:2px\">{{m.note}}<\/div>\n<\/div>\n<\/sc-for>\n<\/div>\n\n<h2 style=\"font-size:18px;font-weight:800;margin:0 0 4px\">Claim workflow<\/h2>\n<p style=\"margin:0 0 12px;font-size:13.5px;color:#4a5a6e\">Select a step to see what is recorded and what the system will not do for you.<\/p>\n<div style=\"display:flex;flex-wrap:wrap;gap:20px;align-items:stretch;margin-bottom:28px\">\n<div style=\"flex:1 1 300px;max-width:440px;background:#fff;border-radius:16px;padding:10px;border:1px solid #e1e7ee\">\n<sc-for list=\"{{steps}}\" as=\"p\" hint-placeholder-count=\"8\">\n<button onClick=\"{{p.pick}}\" aria-pressed=\"{{p.pressed}}\" style=\"display:flex;width:100%;gap:10px;align-items:center;text-align:left;min-height:44px;padding:4px 10px;border:1px solid {{p.border}};background:{{p.bg}};border-radius:10px;font-size:13.5px;color:#0e1a2b;cursor:pointer;margin-bottom:2px\">\n<span style=\"flex:0 0 26px;height:26px;border-radius:50%;background:{{p.dot}};color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center\">{{p.n}}<\/span>\n<span style=\"flex:1 1 auto\">{{p.title}}<\/span>\n<\/button>\n<\/sc-for>\n<\/div>\n<div style=\"flex:999 1 320px;min-width:0;background:#fff;border-radius:16px;padding:22px;border:1px solid #e1e7ee\">\n<div style=\"font-size:12px;font-weight:700;color:#0067cc\">STEP {{cur.n}} OF 19<\/div>\n<h3 style=\"margin:4px 0 10px;font-size:20px;font-weight:800\">{{cur.title}}<\/h3>\n<p style=\"margin:0 0 14px;font-size:14px;line-height:1.6\">{{cur.what}}<\/p>\n<div style=\"background:#fff7dd;border:1px solid #e8c766;border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.55;color:#4a3200\"><strong>Guardrail:<\/strong> {{cur.guard}}<\/div>\n<div style=\"display:flex;gap:8px;margin-top:16px;flex-wrap:wrap\">\n<button onClick=\"{{prev}}\" style=\"min-height:44px;padding:0 16px;border:1px solid #b8c3cf;background:#fff;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer\">Previous<\/button>\n<button onClick=\"{{next}}\" style=\"min-height:44px;padding:0 16px;border:1px solid #0a5cc2;background:#0a5cc2;color:#fff;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer\">Next step<\/button>\n<\/div>\n<\/div>\n<\/div>\n\n<h2 style=\"font-size:18px;font-weight:800;margin:0 0 4px\">Evidence that links back to a claim<\/h2>\n<p style=\"margin:0 0 12px;font-size:13.5px;color:#4a5a6e\">Every attachment keeps its link to the claim and its own audit history.<\/p>\n<div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px\">\n<sc-for list=\"{{evidence}}\" as=\"v\" hint-placeholder-count=\"8\"><span style=\"padding:7px 13px;border-radius:999px;background:#fff;border:1px solid #cfd8e2;font-size:13px\">{{v.label}}<\/span><\/sc-for>\n<\/div>\n\n<h2 style=\"font-size:18px;font-weight:800;margin:0 0 10px\">Claims register<\/h2>\n<div style=\"background:#fff;border:1px dashed #9aa9ba;border-radius:16px;padding:30px;text-align:center;margin-bottom:10px\">\n<div style=\"font-size:15px;font-weight:700;margin-bottom:6px\">No claims registered<\/div>\n<div style=\"font-size:13.5px;color:#4a5a6e;max-width:520px;margin:0 auto 14px;line-height:1.55\">A claim needs a linked Notice of Claim record. The notice deadline comes from an Approved for Use rule, and a passed response date is never treated as acceptance.<\/div>\n<a href=\"Notices.dc.html\" style=\"display:inline-flex;align-items:center;min-height:44px;padding:0 18px;background:#0a5cc2;color:#fff;border-radius:10px;font-size:14px;font-weight:600;text-decoration:none\">Go to Notices and Deadlines<\/a>\n<\/div>\n<\/main>\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script data-props='{\"$preview\":{\"width\":1360,\"height\":1500}}'>\nclass Component extends DCLogic {\n  renderVals() {\n    const stats = ['Total open claims','Awaiting notices','Awaiting Detailed Particulars','Awaiting Engineer action','Under assessment','Determined','Subject to disagreement','Claims with approaching deadlines','Overdue claim actions'].map(label => ({ label, value: '0' }));\n    const amounts = [\n      { label: 'Amount claimed', note: 'Value in the claimant’s submission', color: '#0a5cc2' },\n      { label: 'Amount assessed', note: 'Value in the Engineer’s assessment', color: '#007FFF' },\n      { label: 'Amount determined', note: 'Value in a recorded determination', color: '#6d5bd0' },\n      { label: 'Certified or paid', note: 'Value in an IPC or payment record', color: '#b07a00' }\n    ];\n    const S = [\n      ['Event identified','Someone on site or in the office spots an event that may give rise to a claim.','Identifying an event is not a finding of entitlement.'],\n      ['Event registered','The event is entered with its date, date of awareness, cause and a unique reference.','Event date and awareness date are stored separately.'],\n      ['Contractual entitlement reviewed','The Contract Manager reviews the clause basis, including Particular Conditions.','Uncertain interpretation is flagged for review, not guessed.'],\n      ['Notice requirement assessed','Whether a notice is required, and which rule applies, is recorded.','Only an Approved for Use rule can generate a live deadline.'],\n      ['Notice prepared','A draft Notice of Claim is prepared and linked to the event.','A draft is not a formally issued notice.'],\n      ['Notice internally reviewed','A reviewer comments or clears the draft.','Review is recorded with name and timestamp.'],\n      ['Notice approved','An authorised approver signs off for issue.','The system never issues a notice without human approval.'],\n      ['Notice formally issued','Issue date, time, sender, recipient and method are recorded.','An email being prepared is not an issue event.'],\n      ['Delivery evidenced','Courier receipt, signed copy or other delivery evidence is attached.','Receipt confirmation is a separate, later event.'],\n      ['Relevant deadline calculated','The engine shows the rule used, the calculation and a countdown.','Deadlines never reset when a document is uploaded.'],\n      ['Detailed Particulars submitted','Particulars are prepared and submitted as the procedure requires, including interim and final submissions for continuing events.','A late submission shows the actual timeline and is flagged for assessment, not silently adjusted.'],\n      ['Engineer acknowledgment and response tracked','The Engineer’s acknowledgment and response are logged with dates.','A passed response date does not mean the claim is accepted.'],\n      ['Claim substantiated','Records are attached: reports, photographs, programmes, cost records.','Photograph upload time is shown separately from capture time.'],\n      ['Time and cost impacts assessed','Time and cost impact are assessed against the approved programme.','No extension is granted merely because a delay was registered.'],\n      ['Engineer’s determination tracked','The determination, its date and the amount are recorded.','Determined amounts are kept apart from claimed amounts.'],\n      ['Notice of Dissatisfaction recorded','Where applicable, a Notice of Dissatisfaction and its dates are recorded.','Its period comes from the approved rule library.'],\n      ['DAAB referral tracked','Referral, decision and any follow-up notices are recorded.','Periods are configured, never hard-coded.'],\n      ['Amicable settlement and proceedings','Settlement discussions and later proceedings are logged.','Each stage keeps its own evidence and history.'],\n      ['Claim closed with outcome','The final outcome is documented and the claim is closed.','Closing needs a recorded outcome and authorisation.']\n    ];\n    const sel = this.state.sel || 0;\n    const steps = S.map((s, i) => ({\n      n: String(i + 1), title: s[0],\n      pick: () => this.setState({ sel: i }),\n      pressed: i === sel ? 'true' : 'false',\n      bg: i === sel ? '#e6f1ff' : '#ffffff',\n      border: i === sel ? '#7fb9ff' : 'transparent',\n      dot: i === sel ? '#0067cc' : '#7a8ba0'\n    }));\n    const cur = { n: String(sel + 1), title: S[sel][0], what: S[sel][1], guard: S[sel][2] };\n    const ev = ['Daily site reports','Weather records','Site photographs','Instructions','Approved and revised drawings','Programme updates','Labour and equipment records','Cost records','Delivery records','Meeting minutes','Correspondence','Inspection records','Other evidence'].map(label => ({ label }));\n    return {\n      stats, amounts, steps, cur, evidence: ev,\n      prev: () => this.setState({ sel: Math.max(0, sel - 1) }),\n      next: () => this.setState({ sel: Math.min(S.length - 1, sel + 1) })\n    };\n  }\n}\n<\/script>\n<\/body>\n<\/html>\n", "Contract": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>Contract Administration<\/title>\n<script src=\"./support.js\"><\/script>\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap\" rel=\"stylesheet\">\n<style>\nbody{margin:0;font-family:\"Plus Jakarta Sans\",system-ui,sans-serif;color:#1b2430;background:#f2f5f8}\na{color:#0f4c99}a:hover{color:#0a3166}\nbutton{font-family:inherit}\n\n.gq{display:grid;align-items:stretch}\n.gq>*{box-sizing:border-box;min-width:0;height:100%}\n.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.c4{grid-template-columns:repeat(4,minmax(0,1fr))}\n.c5{grid-template-columns:repeat(5,minmax(0,1fr))}.c6{grid-template-columns:repeat(6,minmax(0,1fr))}\n@media (max-width:1000px){.c5,.c6{grid-template-columns:repeat(3,minmax(0,1fr))}.c4{grid-template-columns:repeat(2,minmax(0,1fr))}}\n@media (max-width:640px){.c3,.c4,.c5,.c6{grid-template-columns:minmax(0,1fr)}}\n<\/style>\n<\/helmet>\n<div style=\"display:flex;flex-wrap:wrap;min-height:100vh\">\n\n<div style=\"flex:0 0 260px\"><dc-import name=\"Nav\" active=\"contract\" hint-size=\"260px,1000px\"><\/dc-import><\/div>\n\n<main style=\"flex:999 1 560px;min-width:0;padding:24px;box-sizing:border-box\">\n<h1 style=\"margin:0 0 4px;font-size:26px\">CONTRACT ADMINISTRATION<\/h1>\n<p style=\"margin:0 0 20px;color:#3f4854;font-size:14px\">Notices, claims, variations, payments, securities and obligations, each with its clause, evidence and deadline.<\/p>\n\n<div style=\"display:flex;flex-wrap:wrap;gap:20px;align-items:stretch;margin-bottom:28px\">\n\n<div style=\"flex:1 1 280px;max-width:420px;background:#fff;border:1px solid #d5dce4;border-radius:8px;padding:8px\">\n<div style=\"font-size:13px;font-weight:700;color:#3f4854;padding:8px 8px 4px\">Sections A to S<\/div>\n<sc-for list=\"{{sections}}\" as=\"s\" hint-placeholder-count=\"6\">\n<button onClick=\"{{s.pick}}\" aria-pressed=\"{{s.pressed}}\" style=\"display:flex;width:100%;gap:10px;text-align:left;align-items:center;min-height:44px;padding:6px 10px;border:1px solid {{s.border}};background:{{s.bg}};border-radius:6px;font-size:14px;color:#1b2430;cursor:pointer;margin-bottom:2px\">\n<span style=\"flex:0 0 22px;font-weight:700;color:#0b4fb3\">{{s.letter}}<\/span>\n<span style=\"flex:1 1 auto\">{{s.title}}<\/span>\n<\/button>\n<\/sc-for>\n<\/div>\n\n<div style=\"flex:999 1 340px;min-width:0;background:#fff;border:1px solid #d5dce4;border-radius:8px;padding:20px\">\n<div style=\"font-size:13px;color:#3f4854\">Section {{cur.letter}}<\/div>\n<h2 style=\"margin:2px 0 8px;font-size:20px\">{{cur.title}}<\/h2>\n<p style=\"margin:0 0 16px;font-size:14px;line-height:1.55\">{{cur.purpose}}<\/p>\n<div style=\"display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px\">\n<div style=\"flex:1 1 140px;border:1px solid #d5dce4;border-radius:8px;padding:10px 12px\"><div style=\"font-size:12px;color:#3f4854\">Live records<\/div><div style=\"font-size:22px;font-weight:700;color:#4b5563\">0<\/div><\/div>\n<div style=\"flex:1 1 140px;border:1px solid #d5dce4;border-radius:8px;padding:10px 12px\"><div style=\"font-size:12px;color:#3f4854\">Rules Approved for Use<\/div><div style=\"font-size:22px;font-weight:700;color:#4b5563\">0<\/div><\/div>\n<div style=\"flex:1 1 140px;border:1px solid #d5dce4;border-radius:8px;padding:10px 12px\"><div style=\"font-size:12px;color:#3f4854\">Status<\/div><div style=\"font-size:14px;font-weight:700;margin-top:6px;color:#3f4854\">○ Not configured<\/div><\/div>\n<\/div>\n<div style=\"font-size:13px;font-weight:700;margin-bottom:6px\">Safeguards in this section<\/div>\n<ul style=\"margin:0 0 16px;padding-left:20px;font-size:14px;line-height:1.6\">\n<li>{{cur.guard}}<\/li>\n<li>Every record carries a unique reference, clause link, responsible person, evidence and history.<\/li>\n<li>Issued records are versioned, never overwritten or deleted.<\/li>\n<\/ul>\n<sc-if value=\"{{cur.link}}\" hint-placeholder-val=\"{{ false }}\">\n<a href=\"Notices.dc.html\" style=\"display:inline-flex;align-items:center;min-height:44px;padding:0 16px;background:#0b4fb3;color:#fff;border-radius:8px;text-decoration:none;font-size:14px\">Open Notices and Deadlines<\/a>\n<\/sc-if>\n<\/div>\n<\/div>\n\n<h2 style=\"font-size:16px;margin:0 0 4px\">Record lifecycle<\/h2>\n<p style=\"margin:0 0 10px;font-size:13px;color:#3f4854\">Each stage is a separate recorded event. A draft is not an issued notice, and a prepared email is not delivery evidence.<\/p>\n<div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px\">\n<sc-for list=\"{{lifecycle}}\" as=\"l\" hint-placeholder-count=\"6\">\n<span style=\"padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700;{{l.style}}\">{{l.label}}<\/span>\n<\/sc-for>\n<\/div>\n\n<h2 style=\"font-size:16px;margin:0 0 4px\">Project setup checklist<\/h2>\n<p style=\"margin:0 0 10px;font-size:13px;color:#3f4854\">Dashboard values and deadlines stay blank until the authorised team completes these.<\/p>\n<div class=\"gq c4\" style=\"gap:8px;margin-bottom:24px\">\n<sc-for list=\"{{setup}}\" as=\"x\" hint-placeholder-count=\"6\">\n<div style=\"background:#fff;border:1px solid #d5dce4;border-radius:8px;padding:10px 12px;font-size:14px;display:flex;justify-content:space-between;gap:8px\"><span>{{x.name}}<\/span><span style=\"font-size:12px;font-weight:700;color:#3f4854;white-space:nowrap\">○ Not configured<\/span><\/div>\n<\/sc-for>\n<\/div>\n<\/main>\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script data-props='{\"$preview\":{\"width\":1360,\"height\":1300}}'>\nclass Component extends DCLogic {\n  renderVals() {\n    const names = ['Project Overview','Contract Administration','Notices and Deadlines','Claims and EOT',\"Engineer's Communications\",'Variations and Change Control','Payments and IPCs','Programme and Progress','Design Management','Drawings and Documents','RFIs and Technical Queries','Quality Management','Inspections and NCRs','Field Management','Site Photos and Evidence','Procurement','Risk Register','HSE','Meetings and Actions','Testing and Commissioning','Taking-Over and Handover','Defects Notification Period','Reports','Notifications','Users and Permissions','System Settings'];\n    const hrefs = { 0: 'Main.dc.html', 1: 'Contract.dc.html', 2: 'Notices.dc.html' };\n    const nav = names.map((label, i) => ({ label: (i + 1) + '. ' + label, href: hrefs[i] || '', off: hrefs[i] ? '' : 'yes', bg: i === 1 ? '#2a5a8c' : 'transparent', weight: i === 1 ? '700' : '500' }));\n    const secs = [\n      ['Contract Particulars and Administration Setup','Holds the executed contract documents, Particular Conditions, Contract Data, Contract Price, Commencement Date, Time for Completion and the authorised parties.','No figure or date is pre-filled. Values come only from the executed contract.',false],\n      ['Notice Register','Records each notice from event to delivery to response, with separate timestamps for event, awareness, preparation, approval, issue, delivery and receipt.','Deadlines are calculated only from an Approved for Use rule. Uncertain triggers are flagged for review.',true],\n      ['Claims Register','Tracks Contractor and Employer claims from event identification through notice, particulars, Engineer response, determination and any DAAB referral.','Claimed, assessed, determined and paid amounts are held separately. A passed response date never means acceptance.',false],\n      ['Contractual Deadline Tracker','Single view of every active deadline with its rule, trigger, calculation and countdown, kept apart from internal targets and statutory dates.','Changing a deadline needs an authorised user and a documented reason. The original is preserved.',true],\n      [\"Engineer's Communications and Determinations\",'Instructions, determinations, approvals and responses with sender, recipient, issue and receipt evidence.','Administrative status never decides contractual validity.',false],\n      ['Variations and Change Management','Change workflow from identification to instruction, quotation, assessment and recorded approval.','Contract Price and Time for Completion change only after the contractual action is recorded.',false],\n      ['Extensions of Time','Claimed, assessed and determined extensions linked to delay events and programme versions.','No extension is granted merely because a delay event was registered.',false],\n      ['Delay and Disruption Records','Delay events linked to activities, the approved programme, critical path, mitigation and evidence.','Contemporaneous records are kept alongside each event.',false],\n      ['Payment Applications and Interim Payment Certificates','Application, assessment, certification, payment due date and actual payment as separate events.','Certification and payment periods are never assumed equal.',false],\n      ['Advance Payment and Recovery','Advance payment amount, security and recovery schedule.','Terms come from the executed contract only.',false],\n      ['Performance Security and Other Securities','Securities, validity dates and expiry alerts.','Expiry reminders follow configured intervals.',false],\n      ['Risk and Early Warning Register','Risks and early warnings with option to start a linked contractual assessment.','A registered risk does not create entitlement.',false],\n      ['Suspension and Termination Records','Suspension and termination events, notices and consequences.','Every notice follows the draft, approved, issued, delivered sequence.',false],\n      ['Disputes, DAAB and Amicable Settlement','Notices of Dissatisfaction, DAAB referrals and decisions, amicable settlement periods.','Periods are taken from the approved rule library.',false],\n      ['Taking-Over and Completion','Contractor application, Engineer inspection, outstanding items and certificate record.','The system never issues a Taking-Over Certificate or decides that Taking-Over occurred.',false],\n      ['Defects Notification Period','Start date, duration, calculated end date, defect notifications and rectification.','Duration and any extension are set by the contract.',false],\n      ['Final Statement and Final Payment Certificate','Final account reconciliation, statement, certificate and release of securities.','Closeout is blocked while obligations remain outstanding.',false],\n      ['Contractual Correspondence Register','Formal communications with authorised sender, recipient, delivery method and evidence.','An email being prepared is not proof of delivery.',false],\n      ['Contractual Obligations and Compliance Matrix','Obligations of each party mapped to clause, owner, due date and evidence.','Items from AI extraction stay unverified until a Contract Manager approves them.',false]\n    ];\n    const sel = this.state.sel || 0;\n    const sections = secs.map((s, i) => ({\n      letter: String.fromCharCode(65 + i), title: s[0],\n      pick: () => this.setState({ sel: i }),\n      pressed: i === sel ? 'true' : 'false',\n      bg: i === sel ? '#e2ecfb' : '#ffffff',\n      border: i === sel ? '#9db9e6' : 'transparent'\n    }));\n    const c = secs[sel];\n    const cur = { letter: String.fromCharCode(65 + sel), title: c[0], purpose: c[1], guard: c[2], link: c[3] ? 'yes' : '' };\n    const st = {\n      grey: 'background:#eceff2;color:#3f4854;border:1px solid #c3cad2',\n      blue: 'background:#e2ecfb;color:#123f86;border:1px solid #9db9e6',\n      amber: 'background:#fff1cc;color:#6b4600;border:1px solid #e0b84f',\n      green: 'background:#e3f3ea;color:#145c36;border:1px solid #9bcdb0',\n      red: 'background:#ffedd5;color:#9a3412;border:1px solid #fdba74'\n    };\n    const lc = [['○ Draft','grey'],['○ Internally reviewed','grey'],['▲ Approved for issue','amber'],['● Formally issued','blue'],['▲ Delivery pending','amber'],['✓ Delivered','green'],['✓ Receipt confirmed','green'],['● Response pending','blue'],['● Response received','blue'],['● Under assessment','blue'],['✓ Determined','green'],['✓ Closed','green'],['■ Overdue','red']];\n    const lifecycle = lc.map(x => ({ label: x[0], style: st[x[1]] }));\n    const setupNames = ['Executed Contract Agreement','General Conditions of Contract','Particular Conditions','Contract Data',\"Employer's Requirements\",\"Contractor's Proposal\",'Accepted programme','Contract Price and payment terms','Time for Completion','Commencement Date','Key milestones','Notice and response periods','Communication procedures','Authorised parties and roles','Document numbering','Reporting requirements'];\n    return { nav, sections, cur, lifecycle, setup: setupNames.map(n => ({ name: n })) };\n  }\n}\n<\/script>\n<\/body>\n<\/html>\n", "Design": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>Design Management<\/title>\n<script src=\"./support.js\"><\/script>\n<\/head>\n<body>\n<x-dc>\n<helmet><style>body{margin:0}<\/style><\/helmet>\n<dc-import name=\"DocFolder\" nav-key=\"design\" kicker=\"DELIVERY\" title=\"Design Management\" blurb=\"Design submissions, Contractor's Documents, review comments and resubmissions for the terminal and control tower.\" folder-no=\"05\" types=\"Design submission,Contractor's Document,Review comments,Resubmission,Design interface record,Construction drawing release,As-built documentation,Other\" prefix=\"DES\" store-key=\"design\" hint-size=\"100%,1100px\"><\/dc-import>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script data-props='{\"$preview\":{\"width\":1360,\"height\":1100}}'>\nclass Component extends DCLogic { renderVals() { return {}; } }\n<\/script>\n<\/body>\n<\/html>\n", "DocFolder": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>Document folder<\/title>\n<script src=\"./support.js\"><\/script>\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;display=swap\" rel=\"stylesheet\">\n<style>\nbody{margin:0;font-family:\"Plus Jakarta Sans\",system-ui,sans-serif;color:#0e1a2b;background:#f3f5f9}\nbutton,input,select{font-family:inherit}\n<\/style>\n<\/helmet>\n<div style=\"display:flex;flex-wrap:wrap;min-height:100vh\">\n<div style=\"flex:0 0 260px\"><dc-import name=\"Nav\" active=\"{{navKey}}\" hint-size=\"260px,1000px\"><\/dc-import><\/div>\n<main style=\"flex:999 1 560px;min-width:0;padding:24px 28px 40px;box-sizing:border-box\">\n\n<header style=\"position:relative;overflow:hidden;border-radius:20px;background:linear-gradient(120deg,#0a3d8f 0%,#0a5cc2 68%,#007FFF 100%);color:#fff;padding:26px 30px;margin-bottom:20px\">\n<svg width=\"100%\" height=\"100%\" viewBox=\"0 0 800 200\" preserveAspectRatio=\"xMaxYMid slice\" aria-hidden=\"true\" style=\"position:absolute;right:0;top:0;opacity:.14\"><path d=\"M560 200 650 0M730 200 710 0M900 200 770 0\" stroke=\"#fff\" stroke-width=\"3\" fill=\"none\"><\/path><path d=\"M710 200V0\" stroke=\"#fff\" stroke-width=\"4\" stroke-dasharray=\"14 12\" fill=\"none\"><\/path><\/svg>\n<div style=\"position:relative;display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:flex-end\">\n<div style=\"flex:1 1 340px;min-width:0\">\n<div style=\"font-size:11px;letter-spacing:.16em;font-weight:700;color:#F7D618\">{{kicker}} · FOLDER {{folderNo}}<\/div>\n<h1 style=\"margin:6px 0 8px;font-family:Fraunces,Georgia,serif;font-size:34px;line-height:1.15;font-weight:700\">{{title}}<\/h1>\n<p style=\"margin:0;font-size:14px;line-height:1.55;color:#d3e2ef;max-width:640px\">{{blurb}}<\/p>\n<\/div>\n<div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n<div style=\"background:rgba(6,30,74,.45);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:10px 16px;min-width:110px\"><div style=\"font-size:11px;color:#b9d2e6;font-weight:600\">Documents<\/div><div style=\"font-size:24px;font-weight:800\">{{count}}<\/div><\/div>\n<div style=\"background:rgba(6,30,74,.45);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:10px 16px;min-width:150px\"><div style=\"font-size:11px;color:#b9d2e6;font-weight:600\">Last upload<\/div><div style=\"font-size:13px;font-weight:700;margin-top:6px\">{{lastUpload}}<\/div><\/div>\n<\/div>\n<\/div>\n<\/header>\n\n<div style=\"background:#fff7dd;border:1px solid #e8c766;border-radius:12px;padding:10px 14px;margin-bottom:18px;font-size:13px;line-height:1.55;color:#4a3200\"><strong>Prototype behaviour.<\/strong> The list below records each upload with its time, but the files themselves are not stored anywhere, and the time comes from this device's clock. In the real build, files go to secure storage and the timestamp is set by the server.<\/div>\n\n<section aria-labelledby=\"uph\" style=\"background:#fff;border-radius:16px;border:1px solid #e1e7ee;padding:18px 20px;margin-bottom:20px\">\n<h2 id=\"uph\" style=\"margin:0 0 12px;font-size:18px;font-weight:800\">Upload documents<\/h2>\n<div style=\"display:flex;flex-wrap:wrap;gap:16px;align-items:stretch\">\n<div onDragOver=\"{{dragOver}}\" onDragLeave=\"{{dragLeave}}\" onDrop=\"{{drop}}\" style=\"flex:2 1 320px;min-width:0;border:2px dashed {{dropBorder}};background:{{dropBg}};border-radius:14px;padding:22px;text-align:center\">\n<div style=\"font-size:15px;font-weight:700;margin-bottom:4px\">Drop files here<\/div>\n<div style=\"font-size:13px;color:#4a5a6e;margin-bottom:12px\">or choose them from your device. You can select several at once.<\/div>\n<label for=\"upl\" style=\"position:absolute;left:-9999px\">Choose files to upload<\/label>\n<input id=\"upl\" type=\"file\" multiple=\"\" onChange=\"{{pick}}\" style=\"max-width:100%;min-height:44px;font-size:14px\">\n<\/div>\n<div style=\"flex:1 1 240px;min-width:0\">\n<label for=\"ty\" style=\"display:block;font-size:13px;font-weight:700;margin-bottom:4px\">Document type<\/label>\n<select id=\"ty\" onChange=\"{{setType}}\" style=\"width:100%;box-sizing:border-box;min-height:44px;padding:0 10px;border:1px solid #9aa9ba;border-radius:8px;font-size:14px;background:#fff;margin-bottom:12px\">\n<sc-for list=\"{{typeOptions}}\" as=\"o\" hint-placeholder-count=\"4\"><option value=\"{{o.v}}\">{{o.v}}<\/option><\/sc-for>\n<\/select>\n<label for=\"nt\" style=\"display:block;font-size:13px;font-weight:700;margin-bottom:4px\">Note (optional)<\/label>\n<input id=\"nt\" type=\"text\" value=\"{{note}}\" onInput=\"{{setNote}}\" placeholder=\"Clause, drawing or notice reference\" style=\"width:100%;box-sizing:border-box;min-height:44px;padding:0 10px;border:1px solid #9aa9ba;border-radius:8px;font-size:14px\">\n<div style=\"font-size:12px;color:#4a5a6e;margin-top:8px;line-height:1.5\">Uploaded by: Andrew Mwaura (Project Manager)<\/div>\n<\/div>\n<\/div>\n<sc-if value=\"{{lastMsg}}\" hint-placeholder-val=\"{{ false }}\"><div style=\"margin-top:12px;font-size:13.5px;font-weight:700;color:#145c36\">✓ {{lastMsg}}<\/div><\/sc-if>\n<\/section>\n\n<section aria-labelledby=\"lsh\">\n<div style=\"display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:10px\">\n<h2 id=\"lsh\" style=\"margin:0;font-size:18px;font-weight:800\">Documents in this folder<\/h2>\n<div style=\"flex:0 1 280px;min-width:200px\"><label for=\"sq\" style=\"position:absolute;left:-9999px\">Search documents<\/label><input id=\"sq\" type=\"search\" value=\"{{q}}\" onInput=\"{{setQ}}\" placeholder=\"Search name or reference\" style=\"width:100%;box-sizing:border-box;min-height:44px;padding:0 12px;border:1px solid #cfd8e2;border-radius:10px;font-size:14px;background:#fff\"><\/div>\n<\/div>\n<div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px\">\n<sc-for list=\"{{chips}}\" as=\"c\" hint-placeholder-count=\"5\">\n<button onClick=\"{{c.pick}}\" aria-pressed=\"{{c.pressed}}\" style=\"min-height:44px;padding:0 14px;border-radius:999px;border:1px solid {{c.border}};background:{{c.bg}};color:{{c.fg}};font-size:13px;font-weight:700;cursor:pointer\">{{c.label}} · {{c.n}}<\/button>\n<\/sc-for>\n<\/div>\n<div style=\"background:#fff;border-radius:16px;border:1px solid #e1e7ee;overflow-x:auto\">\n<sc-if value=\"{{noDocs}}\" hint-placeholder-val=\"{{ true }}\"><div style=\"padding:34px 20px;text-align:center;font-size:14px;color:#4a5a6e;line-height:1.6\">{{emptyText}}<\/div><\/sc-if>\n<sc-if value=\"{{hasDocs}}\" hint-placeholder-val=\"{{ false }}\">\n<table style=\"width:100%;border-collapse:collapse;font-size:13px;min-width:860px\">\n<thead><tr style=\"background:#eef2f6;text-align:left\">\n<th style=\"padding:10px 14px\">Reference<\/th><th style=\"padding:10px 14px\">Document<\/th><th style=\"padding:10px 14px\">Type<\/th><th style=\"padding:10px 14px\">Uploaded at<\/th><th style=\"padding:10px 14px\">By<\/th><th style=\"padding:10px 14px\">File date (unverified)<\/th><th style=\"padding:10px 14px\">Fingerprint<\/th><th style=\"padding:10px 14px\">Version<\/th><th style=\"padding:10px 14px\">Status<\/th>\n<\/tr><\/thead>\n<tbody>\n<sc-for list=\"{{rows}}\" as=\"r\" hint-placeholder-count=\"3\">\n<tr style=\"border-top:1px solid #e6ebf0;vertical-align:top\">\n<td style=\"padding:10px 14px;font-weight:700;white-space:nowrap\">{{r.ref}}<\/td>\n<td style=\"padding:10px 14px;min-width:200px\"><div style=\"font-weight:600;word-break:break-word\">{{r.name}}<\/div><div style=\"font-size:12px;color:#4a5a6e\">{{r.size}}{{r.noteText}}<\/div><\/td>\n<td style=\"padding:10px 14px\">{{r.type}}<\/td>\n<td style=\"padding:10px 14px;white-space:nowrap;font-weight:700\">{{r.at}}<div style=\"font-size:11.5px;font-weight:500;color:#4a5a6e\">{{r.tz}}<\/div><\/td>\n<td style=\"padding:10px 14px;white-space:nowrap\">{{r.by}}<\/td>\n<td style=\"padding:10px 14px;white-space:nowrap;color:#4a5a6e\">{{r.fileDate}}<\/td>\n<td style=\"padding:10px 14px;font-family:ui-monospace,Menlo,monospace;font-size:12px\">{{r.hash}}<\/td>\n<td style=\"padding:10px 14px\">v{{r.ver}}<\/td>\n<td style=\"padding:10px 14px;white-space:nowrap\"><span style=\"font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;{{r.badge}}\">{{r.status}}<\/span><\/td>\n<\/tr>\n<\/sc-for>\n<\/tbody><\/table>\n<\/sc-if>\n<\/div>\n<div style=\"font-size:12.5px;color:#4a5a6e;margin-top:10px;line-height:1.6\">Records are never deleted or overwritten. Uploading a file with the same name adds a new version and marks the earlier one as superseded. The fingerprint (SHA-256) helps detect later changes to a file. File date is the device's last-modified date and does not prove when a document was created.<\/div>\n<\/section>\n<\/main>\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script data-props='{\"navKey\":{\"editor\":null,\"default\":\"eng\"},\"kicker\":{\"editor\":null,\"default\":\"CONTRACT\"},\"title\":{\"editor\":null,\"default\":\"Engineer&#39;s Communications\"},\"blurb\":{\"editor\":null,\"default\":\"Instructions, determinations, approvals and responses.\"},\"folderNo\":{\"editor\":null,\"default\":\"04\"},\"types\":{\"editor\":null,\"default\":\"Engineer&#39;s Instruction,Determination,Notice,Approval or consent,Response,Site instruction,Other\"},\"prefix\":{\"editor\":null,\"default\":\"EIN\"},\"storeKey\":{\"editor\":null,\"default\":\"eng\"},\"$preview\":{\"width\":1360,\"height\":1100}}'>\nclass Component extends DCLogic {\n  componentDidMount() {\n    try {\n      const raw = window.localStorage.getItem('beni-docs-' + (this.props.storeKey || 'x'));\n      if (raw) { const d = JSON.parse(raw); if (Array.isArray(d)) this.setState({ docs: d }); }\n    } catch (e) {}\n  }\n  save(docs) {\n    try { window.localStorage.setItem('beni-docs-' + (this.props.storeKey || 'x'), JSON.stringify(docs)); } catch (e) {}\n  }\n  async addFiles(list) {\n    const files = Array.from(list || []);\n    if (!files.length) return;\n    const when = new Date();\n    const prefix = this.props.prefix || 'DOC';\n    const types = (this.props.types || 'Other').split(',');\n    const type = this.state.type || types[0];\n    const note = this.state.note || '';\n    let docs = (this.state.docs || []).slice();\n    const tz = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone; } catch (e) { return ''; } })();\n    for (const f of files) {\n      let hash = 'unavailable';\n      try {\n        const buf = await f.arrayBuffer();\n        const h = await window.crypto.subtle.digest('SHA-256', buf);\n        hash = Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2, '0')).join('').slice(0, 12);\n      } catch (e) {}\n      const same = docs.filter(d => d.name === f.name).length;\n      docs.push({\n        ref: prefix + '-' + String(docs.length + 1).padStart(3, '0'),\n        name: f.name, bytes: f.size, type, note,\n        at: when.toISOString(), tz,\n        fileDate: f.lastModified ? new Date(f.lastModified).toISOString() : '',\n        hash, ver: same + 1, by: 'Andrew Mwaura'\n      });\n    }\n    this.save(docs);\n    this.setState({ docs, lastMsg: files.length + (files.length === 1 ? ' file' : ' files') + ' recorded at ' + when.toLocaleTimeString('en-GB') });\n  }\n  renderVals() {\n    const types = (this.props.types || 'Other').split(',');\n    const docs = this.state.docs || [];\n    const f = this.state.f || '';\n    const q = (this.state.q || '').toLowerCase();\n    const fmtSize = (b) => b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(1) + ' KB' : (b / 1048576).toFixed(1) + ' MB';\n    const fmt = (iso) => new Date(iso).toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' });\n    const maxVer = {};\n    docs.forEach(d => { maxVer[d.name] = Math.max(maxVer[d.name] || 0, d.ver); });\n    const all = docs.map(d => {\n      const cur = d.ver === maxVer[d.name];\n      return {\n        ref: d.ref, name: d.name, size: fmtSize(d.bytes), type: d.type, noteText: d.note ? ' · ' + d.note : '',\n        at: fmt(d.at), tz: d.tz, by: d.by, fileDate: d.fileDate ? new Date(d.fileDate).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : 'Not available',\n        hash: d.hash, ver: String(d.ver),\n        status: cur ? '✓ Current' : '○ Superseded',\n        badge: cur ? 'background:#e3f3ea;color:#145c36;border:1px solid #9bcdb0' : 'background:#eceff2;color:#3f4854;border:1px solid #c3cad2',\n        _type: d.type, _q: (d.name + ' ' + d.ref).toLowerCase()\n      };\n    });\n    const rows = all.filter(r => (!f || r._type === f) && (!q || r._q.indexOf(q) >= 0)).reverse();\n    const chips = [''].concat(types).map(t => ({\n      label: t || 'All', n: String(t ? docs.filter(d => d.type === t).length : docs.length),\n      pick: () => this.setState({ f: t }), pressed: f === t ? 'true' : 'false',\n      bg: f === t ? '#0a5cc2' : '#ffffff', fg: f === t ? '#ffffff' : '#0e1a2b', border: f === t ? '#0a5cc2' : '#cfd8e2'\n    }));\n    const drag = !!this.state.drag;\n    const last = docs.length ? fmt(docs[docs.length - 1].at) : 'None yet';\n    return {\n      navKey: this.props.navKey || 'eng', kicker: this.props.kicker || '', title: this.props.title || '', blurb: this.props.blurb || '', folderNo: this.props.folderNo || '00',\n      count: String(docs.length), lastUpload: last, rows, chips,\n      typeOptions: types.map(v => ({ v })),\n      hasDocs: rows.length ? 'yes' : '', noDocs: rows.length ? '' : 'yes',\n      emptyText: docs.length ? 'No documents match this filter.' : 'No documents yet. Upload the first one above and it will appear here with its date and time.',\n      note: this.state.note || '', q: this.state.q || '', lastMsg: this.state.lastMsg || '',\n      dropBorder: drag ? '#0067cc' : '#9aa9ba', dropBg: drag ? '#e6f1ff' : '#f7f9fb',\n      setType: (e) => this.setState({ type: e.target.value }),\n      setNote: (e) => this.setState({ note: e.target.value }),\n      setQ: (e) => this.setState({ q: e.target.value }),\n      pick: (e) => { const input = e.target; const list = Array.from(input.files || []); input.value = ''; this.addFiles(list); },\n      dragOver: (e) => { e.preventDefault(); if (!drag) this.setState({ drag: true }); },\n      dragLeave: () => this.setState({ drag: false }),\n      drop: (e) => { e.preventDefault(); this.setState({ drag: false }); this.addFiles(e.dataTransfer ? e.dataTransfer.files : []); }\n    };\n  }\n}\n<\/script>\n<\/body>\n<\/html>\n", "Documents": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>Drawings and Documents<\/title>\n<script src=\"./support.js\"><\/script>\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap\" rel=\"stylesheet\">\n<style>\nbody{margin:0;font-family:\"Plus Jakarta Sans\",system-ui,sans-serif;color:#0e1a2b;background:#f3f5f9}\nbutton,input{font-family:inherit}\n<\/style>\n<\/helmet>\n<div style=\"display:flex;flex-wrap:wrap;min-height:100vh\">\n<div style=\"flex:0 0 260px\"><dc-import name=\"Nav\" active=\"docs\" hint-size=\"260px,1000px\"><\/dc-import><\/div>\n<main style=\"flex:999 1 560px;min-width:0;padding:24px 28px 40px;box-sizing:border-box\">\n<div style=\"font-size:11px;letter-spacing:.14em;font-weight:700;color:#0067cc\">DOCUMENT CONTROL<\/div>\n<h1 style=\"margin:4px 0 6px;font-size:28px;font-weight:800\">Drawings and Documents<\/h1>\n<p style=\"margin:0 0 22px;font-size:14px;color:#4a5a6e;max-width:760px;line-height:1.55\">A structured project filing system with version control. A superseded drawing is clearly marked so it cannot be mistaken for the current construction revision.<\/p>\n\n<div style=\"display:flex;flex-wrap:wrap;gap:22px;alig }<\/div><div style=\"font-size:12px;color:#4a5a6e;margin-top:2px\">{{e.when}} · {{e.link}}<\/div><\/div>\n<\/div>\n<\/sc-for>\n<\/section>\n<\/aside>\n<\/div>\n\n<h2 style=\"font-size:18px;font-weight:800;margin:0 0 12px\">Live records by area<\/h2>\n<div class=\"gq c4\" style=\"gap:12px;margin-bottom:26px\">\n<sc-for list=\"{{tiles}}\" as=\"t\" hint-placeholder-count=\"8\">\n<div style=\"background:#fff;border-radius:14px;padding:14px 16px;border:1px solid #e1e7ee;border-top:4px solid {{t.color}}\">\n<div style=\"font-size:12px;color:#4a5a6e;font-weight:600;min-height:32px;line-height:1.35\">{{t.label}}<\/div>\n<div style=\"font-size:26px;font-weight:800;margin-top:4px;color:#0e1a2b\">{{t.value}}<\/div>\n<\/div>\n<\/sc-for>\n<\/div>\n<div style=\"display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:#4a5a6e;margin-bottom:18px\">\n<span><span style=\"display:inline-block;width:10px;height:10px;background:#e0b800;border-radius:3px;margin-right:6px\"><\/span>Contract<\/span>\n<span><span style=\"display:inline-block;width:10px;height:10px;background:#007FFF;border-radius:3px;margin-right:6px\"><\/span>Delivery<\/span>\n<span><span style=\"display:inline-block;width:10px;height:10px;background:#6d5bd0;border-radius:3px;margin-right:6px\"><\/span>Quality and completion<\/span>\n<\/div>\n\n<div style=\"display:flex;flex-wrap:wrap;gap:8px;font-size:12px;font-weight:700\">\n<span style=\"padding:5px 11px;border-radius:999px;background:#e3f3ea;color:#145c36;border:1px solid #9bcdb0\">✓ Completed / within deadline<\/span>\n<span style=\"padding:5px 11px;border-radius:999px;background:#fff1cc;color:#6b4600;border:1px solid #e0b84f\">▲ Pending / approaching<\/span>\n<span style=\"padding:5px 11px;border-radius:999px;background:#ffedd5;color:#9a3412;border:1px solid #fdba74\">■ Overdue / urgent<\/span>\n<span style=\"padding:5px 11px;border-radius:999px;background:#e2ecfb;color:#123f86;border:1px solid #9db9e6\">● In progress / awaiting<\/span>\n<span style=\"padding:5px 11px;border-radius:999px;background:#eceff2;color:#3f4854;border:1px solid #c3cad2\">○ Draft / not applicable<\/span>\n<\/div>\n<\/main>\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script data-props='{\"$preview\":{\"width\":1360,\"height\":1500}}'>\nclass Component extends DCLogic {\n  renderVals() {\n    const demo = this.state.demo !== false;\n    const rings = ['Overall Project Progress','Design Progress','Construction Progress','Procurement Progress'].map(label => ({ label }));\n    const dates = [\n      { label: 'Planned Completion Date', note: 'Needs Commencement Date and Time for Completion' },\n      { label: 'Current Forecast Completion', note: 'Needs approved programme' },\n      { label: 'Time Elapsed', note: 'Needs Commencement Date' },\n      { label: 'Time Remaining', note: 'Needs Time for Completion' }\n    ];\n    const B = {\n      red: 'background:#ffedd5;color:#9a3412;border:1px solid #fdba74',\n      amber: 'background:#fff1cc;color:#6b4600;border:1px solid #e0b84f',\n      blue: 'background:#e2ecfb;color:#123f86;border:1px solid #9db9e6',\n      grey: 'background:#eceff2;color:#3f4854;border:1px solid #c3cad2'\n    };\n    const BOX = {\n      red: 'background:#ffedd5;color:#9a3412',\n      amber: 'background:#fff1cc;color:#6b4600',\n      blue: 'background:#e2ecfb;color:#123f86',\n      grey: 'background:#eceff2;color:#3f4854'\n    };\n    // ref, desc, who, trigger, clause, days, status, tone\n    const raw = [\n      ['DEMO-NOT-001','Notice of Claim for access delay (sample)','Bethwell (APM)','12 Oct 2026','20.2.1 (sample, unverified)',-5,'■ OVERDUE','red'],\n      ['DEMO-RFI-007','RFI awaiting Engineer response (sample)','Andrew Mwaura (PM)','9 Oct 2026','Sample',2,'▲ DUE SOON','amber'],\n      ['DEMO-DES-003','Design submission under review (sample)','Design Manager (unassigned)','10 Oct 2026','Sample',6,'● UNDER REVIEW','blue'],\n      ['DEMO-IPC-002','Interim payment awaiting processing (sample)','Quantity Surveyor (unassigned)','5 Oct 2026','Sample',11,'● RESPONSE PENDING','blue'],\n      ['DEMO-VAR-004','Variation awaiting assessment (sample)','Contract Manager (unassigned)','1 Oct 2026','Sample',null,'○ DRAFT','grey']\n    ];\n    const alerts = demo ? raw.map(r => {\n      const d = r[5];\n      const num = d === null ? '—' : String(Math.abs(d));\n      const unit = d === null ? 'no deadline' : d < 0 ? (Math.abs(d) === 1 ? 'day overdue' : 'days overdue') : d === 0 ? 'due today' : (d === 1 ? 'day left' : 'days left');\n      return { ref: r[0], desc: r[1], who: r[2], trigger: r[3], clause: r[4], deadline: 'Sample only', status: r[6], badge: B[r[7]], box: BOX[r[7]], num, unit };\n    }) : [];\n    const buckets = [['Overdue', d => d < 0, '#c2410c'], ['Today', d => d === 0, '#b07a00'], ['1 to 3 days', d => d >= 1 && d <= 3, '#b07a00'], ['4 to 7 days', d => d >= 4 && d <= 7, '#1a56b0'], ['8 to 14 days', d => d >= 8 && d <= 14, '#1a56b0'], ['Later', d => d > 14, '#4b5563']];\n    const days = demo ? raw.map(r => r[5]).filter(x => x !== null) : [];\n    const horizon = buckets.map(b => { const n = days.filter(b[1]).length; return { label: b[0], n: String(n), w: (n / 5 * 100) + '%', color: b[2] }; });\n    const events = demo ? [\n      { when: 'Sample · today', what: 'Site photograph uploaded (capture time unverified)', link: 'Site Photos' },\n      { when: 'Sample · yesterday', what: 'Non-conformance raised on a sample inspection', link: 'Inspections and NCRs' },\n      { when: 'Sample · 3 days ago', what: 'Engineer response received to a sample RFI', link: 'RFIs' }\n    ] : [];\n    const C = '#e0b800', D = '#007FFF', Q = '#6d5bd0';\n    const tiles = [\n      ['Active Claims', '0', C], ['Outstanding Notices', '0', C], ['Upcoming Contractual Deadlines', '0', C], ['Overdue Contractual Actions', '0', C], ['Outstanding Instructions and Determinations', '0', C],\n      ['Critical Path Status', 'Not set', D], ['Pending RFIs', '0', D], ['Pending Design Submissions', '0', D], ['Pending Interim Payment Certificates', '0', D],\n      ['Outstanding Inspections', '0', Q], ['Open Non-Conformance Reports', '0', Q], ['Outstanding Tests and Commissioning', '0', Q]\n    ].map(t => ({ label: t[0], value: t[1], color: t[2] }));\n    return {\n      rings, dates, alerts, horizon, events, tiles,\n      hzNote: demo ? 'Built from the five sample alerts. Not live data.' : 'No active deadlines.',\n      noAlerts: demo ? '' : 'yes',\n      noEvents: demo ? '' : 'yes',\n      demoBtn: demo ? 'Remove demo data' : 'Restore demo data (prototype only)',\n      toggleDemo: () => this.setState({ demo: !demo })\n    };\n  }\n}\n<\/script>\n<\/body>\n<\/html>\n", "Meetings": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>Meetings and Actions<\/title>\n<script src=\"./support.js\"><\/script>\n<\/head>\n<body>\n<x-dc>\n<helmet><style>body{margin:0}<\/style><\/helmet>\n<dc-import name=\"DocFolder\" nav-key=\"meet\" kicker=\"SITE AND QUALITY\" title=\"Meetings and Actions\" blurb=\"Agendas, minutes and action lists for progress, technical, design, commercial and quality meetings.\" folder-no=\"17\" types=\"Agenda,Minutes,Action list,Attendance record,Presentation,Other\" prefix=\"MTG\" store-key=\"meet\" hint-size=\"100%,1100px\"><\/dc-import>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script data-props='{\"$preview\":{\"width\":1360,\"height\":1100}}'>\nclass Component extends DCLogic { renderVals() { return {}; } }\n<\/script>\n<\/body>\n<\/html>\n", "MonthlyReport": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>Monthly Report<\/title>\n<script src=\"./support.js\"><\/script>\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap\" rel=\"stylesheet\">\n<style>\nbody{margin:0;font-family:\"Plus Jakarta Sans\",system-ui,sans-serif;color:#0e1a2b;background:#f3f5
